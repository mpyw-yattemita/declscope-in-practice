---
apiVersion: v1
kind: Secret
metadata:
  name: client-cert-a
  namespace: default
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 

---
apiVersion: v1
kind: Secret
metadata:
  name: client-cert-b
  namespace: default
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 

---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller

---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: gateway-a
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  tls:
    backend:
      clientCertificateRef:
        name: client-cert-a
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: a.example.com

---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: gateway-b
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  tls:
    backend:
      clientCertificateRef:
        name: client-cert-b
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: b.example.com

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: http-app-1
  namespace: default
spec:
  parentRefs:
    - name: gateway-a
      kind: Gateway
      group: gateway.networking.k8s.io
    - name: gateway-b
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80
          weight: 1

---
kind: BackendTLSPolicy
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: policy-whoami
  namespace: default
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: whoami
  validation:
    hostname: whoami
    wellKnownCACertificates: System

