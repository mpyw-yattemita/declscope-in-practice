---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller

---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  tls:
    backend:
      clientCertificateRef:
        name: client-cert
  allowedListeners:
    namespaces:
      from: Same
  listeners:
    - name: web
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

---
kind: ListenerSet
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-listenerset
  namespace: default
spec:
  parentRef:
    name: my-gateway
    namespace: default
    kind: Gateway
    group: gateway.networking.k8s.io
  listeners:
    - name: http-8080
      protocol: HTTP
      port: 8080

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: http-app-1
  namespace: default
spec:
  parentRefs:
    - name: my-listenerset
      kind: ListenerSet
      group: gateway.networking.k8s.io
  hostnames:
    - "foo.com"
  rules:
    - matches:
        - path:
            type: Exact
            value: /bar
      backendRefs:
        - name: whoami
          port: 80

---
kind: BackendTLSPolicy
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: policy-1
  namespace: default
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: whoami
  validation:
    hostname: whoami
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: ca-file

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-file
  namespace: default
data:
  ca.crt: "CA1"

---
apiVersion: v1
kind: Secret
metadata:
  name: client-cert
  namespace: default

data:
  tls.crt: 
  tls.key: 
