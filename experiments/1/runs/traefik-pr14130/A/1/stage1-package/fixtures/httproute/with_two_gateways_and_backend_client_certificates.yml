---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller

---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: gateway-a
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  tls:
    backend:
      clientCertificateRef:
        name: client-cert-a
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: a.example.com
      allowedRoutes:
        namespaces:
          from: Same

---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: gateway-b
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  tls:
    backend:
      clientCertificateRef:
        name: client-cert-b
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: b.example.com
      allowedRoutes:
        namespaces:
          from: Same

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: http-app-a
  namespace: default
spec:
  parentRefs:
    - name: gateway-a
      kind: Gateway
      group: gateway.networking.k8s.io
  hostnames:
    - "a.example.com"
  rules:
    - matches:
        - path:
            type: Exact
            value: /bar
      backendRefs:
        - name: whoami
          port: 80

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: http-app-b
  namespace: default
spec:
  parentRefs:
    - name: gateway-b
      kind: Gateway
      group: gateway.networking.k8s.io
  hostnames:
    - "b.example.com"
  rules:
    - matches:
        - path:
            type: Exact
            value: /bar
      backendRefs:
        - name: whoami
          port: 80

---
kind: BackendTLSPolicy
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: policy-1
  namespace: default
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: whoami
  validation:
    hostname: whoami
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: ca-file

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-file
  namespace: default
data:
  ca.crt: "CA1"

---
apiVersion: v1
kind: Secret
metadata:
  name: client-cert-a
  namespace: default

data:
  tls.crt: 
  tls.key: 

---
apiVersion: v1
kind: Secret
metadata:
  name: client-cert-b
  namespace: default

data:
  tls.crt: 
  tls.key: 
