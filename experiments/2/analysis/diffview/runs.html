ves identically to FindTraces, except that it returns only the list\n \t// of matching trace IDs. This is useful in some contexts, such as batch jobs, where a\n \t// large list of trace IDs may be queried first and then the full traces are loaded\n \t// in batches.\n \tFindTraceIDs(ctx context.Context, query TraceQueryParams) iter.Seq2[[]FoundTraceID, error]\n \n \t// FindTraceSummaries returns an iterator over lightweight summaries of the traces\n \t// matching the query parameters (the metadata shown in search-result lists). The\n \t// iterator is single-use: once consumed, it cannot be used again.\n \t//\n \t// Backends that can compute summaries natively (e.g. via a storage-side aggregation)\n \t// should do so. Backends that cannot must yield errors.ErrUnsupported (wrapped with\n \t// %w) as the first error, before any batch; the caller then falls back to FindTraces\n \t// plus client-side aggregation. Such backends can embed UnsupportedTraceSummaries to\n \t// get this behavior for free.\n \t//\n \t// The iterator streams result batches; each yielded batch may contain one or more\n \t// summaries, and implementations may yield incrementally rather than buffering all\n \t// results first.\n \tFindTraceSummaries(ctx context.Context, query TraceQueryParams) iter.Seq2[[]TraceSummary, error]\n \n \t// SearchCapabilities reports how this reader's search methods behave.\n \t//\n \t// A reader that cannot determine its capabilities (e.g. because its backend sits\n \t// behind an API that cannot be asked) must return an error that wraps\n \t// errors.ErrUnsupported rather than a value a caller might trust. The context is\n \t// provided because the answer may require a network call.\n \t//\n \t// A Reader that wraps another Reader (a decorator) must forward this call to the\n \t// wrapped Reader rather than answer for itself.\n \tSearchCapabilities(ctx context.Context) (SearchCapabilities, error)\n }\n \n // SearchCapabilities describes how a Reader's search methods behave where\n // backends differ.\n //\n // Every field defaults to false, so the zero value describes the least capable\n // reader. A new capability is added as a new field, which every existing\n // implementation then reports as false until it opts in.\n type SearchCapabilities struct {\n \t// WithoutServiceName is true when FindTraces, FindTraceIDs and\n \t// FindTraceSummaries accept a TraceQueryParams whose ServiceName is empty\n \t// and read it as \"any service\", rather than as an error or an empty result.\n \tWithoutServiceName bool\n+\n+\t// SameSpanConjunction is true when a conjunction (several entries in the\n+\t// Attributes map, or an OpAnd in Filter) is satisfied within a single span.\n+\t// False means the backend may satisfy different conjuncts from different\n+\t// spans of the same trace, as a flat inverted index does. Callers report\n+\t// this looser scoping rather than refusing the query.\n+\tSameSpanConjunction bool\n+\n+\t// Filter is how much of TraceQueryParams.Filter the reader evaluates. A nil\n+\t// Filter means none of it: the reader serves only the legacy fields.\n+\tFilter *FilterCapabilities\n+}\n+\n+// FilterCapabilities declares how much of a structured filter a Reader\n+// evaluates, by naming the levels and operators it serves.\n+//\n+// Nothing is implicit: a Reader opts in only by naming something, so an empty\n+// FilterCapabilities says the same as no FilterCapabilities. Callers ask\n+// IsEmpty rather than comparing against nil.\n+type FilterCapabilities struct {\n+\t// Levels are the levels a reference may name. Empty means the Reader can\n+\t// serve only unqualified references.\n+\tLevels []expression.Level\n+\t// Operators are the operators the Reader evaluates, including the boolean\n+\t// combinators OpAnd, OpOr and OpNot.\n+\tOperators []expression.Operator\n+}\n+\n+// IsEmpty reports whether c names no level and no operator, which is the same\n+// as the Reader evaluating no structured filter at all. It is true for nt\n+\n+\t// Filter is the structured query filter. It is mutually exclusive with the\n+\t// predicate fields ServiceName, OperationName, Attributes and the duration\n+\t// bounds, so a reader sees one filtering model, not a mix of the two.\n+\tFilter *expression.Call\n }\n \n // FoundTraceID is a wrapper around trace ID returned from FindTraceIDs\n // with an optional time range that may be used in GetTraces calls.\n //\n // The time range is provided as an optimization hint for some storage backends\n // that can perform more efficient queries when they know the approximate time range.\n // The value should not be used for precise time-based filtering or assumptions.\n // It is meant as a rough boundary and may not be populated in all cases.\n type FoundTraceID struct {\n \tTraceID pcommon.TraceID\n \tStart   time.Time\n \tEnd     time.Time\n }\n \n // OperationQueryParams contains parameters of query operations, empty spanKind means get operations for all kinds of span.\n type OperationQueryParams struct {\n \tServiceName string\n \tSpanKind    string\n }\n \n // Operation contains operation name and span kind\n type Operation struct {\n \tName     string\n \tSpanKind string\n }\ndiff --git a/internal/storage/v2/api/tracestore/reader_test.go b/internal/storage/v2/api/tracestore/reader_test.go\nindex a3d48cc..3fa0d06 100644\n--- a/internal/storage/v2/api/tracestore/reader_test.go\n+++ b/internal/storage/v2/api/tracestore/reader_test.go\n@@ -1,21 +1,89 @@\n // Copyright (c) 2024 The Jaeger Authors.\n // SPDX-License-Identifier: Apache-2.0\n \n package tracestore\n \n import (\n \t\"reflect\"\n \t\"testing\"\n \n+\texpression \"github.com/jaegertracing/jaeger-idl/query/expression/v1\"\n \t\"github.com/stretchr/testify/assert\"\n )\n \n // TestSearchCapabilities_FieldCount fails when a field is added to SearchCapabilities.\n // The decorators' forwarding tests enumerate every field, so when this fails, extend\n // those tests to cover the new field and then update th /storage/v2/api/tracestore/filter.go\nnew file mode 100644\nindex 0000000..54ca126\n--- /dev/null\n+++ b/internal/storage/v2/api/tracestore/filter.go\n@@ -0,0 +1,427 @@\n+// Copyright (c) 2026 The Jaeger Authors.\n+// SPDX-License-Identifier: Apache-2.0\n+\n+package tracestore\n+\n+import (\n+\t\"fmt\"\n+\t\"time\"\n+\n+\t\"go.opentelemetry.io/collector/pdata/pcommon\"\n+\n+\texpression \"github.com/jaegertracing/jaeger-idl/query/expression/v1\"\n+)\n+\n+// EnsureFilterStandsAlone rejects a query that carries both a filter and one\n+// of the predicate fields the filter replaces. A reader sees one filtering\n+// model, so a query that mixes the two is malformed whatever the reader can do.\n+//\n+// The error wraps ErrFilterInvalid and names every conflicting field.\n+func (q TraceQueryParams) EnsureFilterStandsAlone() error {\n+\tif q.Filter == nil {\n+\t\treturn nil\n+\t}\n+\tvar conflicts []string\n+\tif q.ServiceName != \"\" {\n+\t\tconflicts = append(conflicts, \"service_name\")\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tconflicts = append(conflicts, \"operation_name\")\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tconflicts = append(conflicts, \"duration_min\")\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tconflicts = append(conflicts, \"duration_max\")\n+\t}\n+\tif attributeCount(q.Attributes) > 0 {\n+\t\tconflicts = append(conflicts, \"attributes\")\n+\t}\n+\tif len(conflicts) == 0 {\n+\t\treturn nil\n+\t}\n+\treturn fmt.Errorf(\"%w: a filter cannot be combined with the predicate fields %v\", ErrFilterInvalid, conflicts)\n+}\n+\n+// ForCapabilities gives the Reader whichever of the two filtering models it\n+// declared it can evaluate. A Reader that declared no filter support receives\n+// the filter expressed in the legacy predicate fields; one that declared some\n+// receives the filter as it is, provided it declared everything the filter\n+// uses. What neither model can answer is refused rather than approximated.\n+//\n+// The caller is expected to have checked the query with EnsureFilterStandsAlone.\n+func (q TraceQueryParams) ForCapabilities(caps SearchCapabilities) (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\tif caps.Filter.IsEmpty() {\n+\t\treturn q.ToLegacyShape()\n+\t}\n+\treturn q, caps.Filter.EnsureSupported(q.Filter)\n+}\n+\n+// EnsureSupported walks the filter and refuses the first predicate the Reader\n+// did not declare it can evaluate: an operator it did not list, or a\n+// reference to a level it does not index. Constants need no support.\n+//\n+// A nil filter is supported. Refusals wrap ErrFilterUnsupported.\n+func (c FilterCapabilities) EnsureSupported(filter *expression.Call) error {\n+\treturn c.ensureCallSupported(filter, 1)\n+}\n+\n+func (c FilterCapabilities) ensureCallSupported(call *expression.Call, depth int) error {\n+\tif call == nil {\n+\t\treturn nil\n+\t}\n+\tif depth > expression.MaxNestingDepth {\n+\t\treturn fmt.Errorf(\"%w: %w\", ErrFilterInvalid, expression.ErrTooDeeplyNested)\n+\t}\n+\tif !c.SupportsOperator(call.Op) {\n+\t\treturn errOperatorUnsupported(call.Op)\n+\t}\n+\tfor _, arg := range call.Args {\n+\t\tif nested, ok := arg.(*expression.Call); ok {\n+\t\t\tif err := c.ensureCallSupported(nested, depth+1); err != nil {\n+\t\t\t\treturn err\n+\t\t\t}\n+\t\t\tcontinue\n+\t\t}\n+\t\tif level, ok := referenceLevel(arg); ok && !c.SupportsLevel(level) {\n+\t\t\treturn errLevelUnsupported(level)\n+\t\t}\n+\t}\n+\treturn nil\n+}\n+\n+// referenceLevel returns the level a reference names, and false for anything\n+// that is not a reference.\n+func referenceLevel(e expression.Expression) (expression.Level, bool) {\n+\tswitch ref := e.(type) {\n+\tcase *expression.AttributeRef:\n+\t\tif ref != nil {\n+\t\t\treturn ref.Level, true\n+\t\t}\n+\tcase *expression.FieldRef:\n+\t\tif ref != nil {\n+\t\t\treturn ref.Level, true\n+\t\t}\n+\tcase *expression.NestedRef:\n+\t\tif ref != nil {\n+\t\t\treturn ref.Level, true\n+\t\t}\n+\t}\n+\treturn \"\", false\n+}\n+\n+// ToFilterShape expresses q's scalar predicate fields as filter predicates.\n+// It cannot fail, because each legacy field has an exact filter equivalent. A\n+// query that already has a Filter is returned as it is.\n+//\n+// The predicates come in the order service, operation, attributes, minimum and\n+// maximum duration, and are already in the form expression.Finalize produces.\n+func (q TraceQueryParams) ToFilterShape() TraceQueryParams {\n+\tif q.Filter != nil {\n+\t\treturn q\n+\t}\n+\tvar predicates []*expression.Call\n+\tif q.ServiceName != \"\" {\n+\t\tpredicates = append(predicates, eqString(resourceServiceRef(), q.ServiceName))\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tpredicates = append(predicates, eqString(spanNameRef(), q.OperationName))\n+\t}\n+\tif attributeCount(q.Attributes) > 0 {\n+\t\tfor key, value := range q.Attributes.All() {\n+\t\t\tpredicates = append(predicates, &expression.Call{\n+\t\t\t\tOp:   expression.OpEq,\n+\t\t\t\tArgs: []expression.Expression{&expression.AttributeRef{Key: key}, &expression.AnyValue{Value: value.AsString()}},\n+\t\t\t})\n+\t\t}\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tpredicates = append(predicates, durationBound(expression.OpGte, q.DurationMin))\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tpredicates = append(predicates, durationBound(expression.OpLte, q.DurationMax))\n+\t}\n+\n+\tq.ServiceName = \"\"\n+\tq.OperationName = \"\"\n+\tq.Attributes = pcommon.NewMap()\n+\tq.DurationMin = 0\n+\tq.DurationMax = 0\n+\tswitch len(predicates) {\n+\tcase 0:\n+\t\tq.Filter = nil\n+\tcase 1:\n+\t\tq.Filter = predicates[0]\n+\tdefault:\n+\t\targs := make([]expression.Expression, len(predicates))\n+\t\tfor i, predicate := range predicates {\n+\t\t\targs[i] = predicate\n+\t\t}\n+\t\tq.Filter = &expression.Call{Op: expression.OpAnd, Args: args}\n+\t}\n+\treturn q\n+}\n+\n+func resourceServiceRef() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelResource, Name: expression.ResourceFieldService}\n+}\n+\n+func spanNameRef() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldName}\n+}\n+\n+func eqString(ref *expression.FieldRef, value string) *expression.Call {\n+\treturn &expression.Call{\n+\t\tOp:   expression.OpEq,\n+\t\tArgs: []expression.Expression{ref, &expression.StringValue{Value: value}},\n+\t}\n+}\n+\n+func durationBound(op expression.Operator, bound time.Duration) *expression.Call {\n+\treturn &expression.Call{\n+\t\tOp: op,\n+\t\tArgs: []expression.Expression{\n+\t\t\t&expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldDuration},\n+\t\t\t&expression.DurationValue{Value: bound},\n+\t\t},\n+\t}\n+}\n+\n+// ToLegacyShape expresses q's Filter in the scalar predicate fields every\n+// backend serves. Only a flat conjunction of equalities on attributes, the\n+// service and the operation name, and inclusive bounds on the duration\n+// converts; everything else is refused with ErrFilterUnsupported rather than\n+// approximated. A query without a filter is returned unchanged.\n+//\n+// The result has a nil Filter and a new Attributes map, so the caller's map is\n+// not changed. On error the original query is returned.\n+func (q TraceQueryParams) ToLegacyShape() (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\t// The conversion writes the legacy fields, so a value already in one of\n+\t// them would be overwritten or merged with the filter's.\n+\tif err := q.EnsureFilterStandsAlone(); err != nil {\n+\t\treturn q, err\n+\t}\n+\tpredicates, err := flattenConjunction(q.Filter, nil, 1)\n+\tif err != nil {\n+\t\treturn q, err\n+\t}\n+\tw := legacyWriter{q: q, written: make(map[legacyTarget]bool)}\n+\tw.q.Filter = nil\n+\tw.q.Attributes = pcommon.NewMap()\n+\tfor _, predicate := range predicates {\n+\t\tif err := w.write(predicate); err != nil {\n+\t\t\treturn q, err\n+\t\t}\n+\t}\n+\treturn w.q, nil\n+}\n+\n+// flattenConjunction appends the conjuncts of call to predicates, descending\n+// into nested conjunctions, which and's associativity makes equivalent.\n+func flattenConjunction(call *expression.Call, predicates []*expression.Call, depth int) ([]*expression.Call, error) {\n+\tif depth > expression.MaxNestingDepth {\n+\t\treturn nil, fmt.Errorf(\"%w: %w\", ErrFilterInvalid, expression.ErrTooDeeplyNested)\n+\t}\n+\tif call.Op != expression.OpAnd {\n+\t\treturn append(predicates, call), nil\n+\t}\n+\tfor _, arg := range call.Args {\n+\t\tnested, ok := arg.(*expression.Call)\n+\t\tif !ok || nested == nil {\n+\t\t\treturn nil, fmt.Errorf(\"%w: it serves a conjunction of predicates only\", ErrFilterUnsupported)\n+\t\t}\n+\t\tvar err error\n+\t\tif predicates, err = flattenConjunction(nested, predicates, depth+1); err != nil {\n+\t\t\treturn nil, err\n+\t\t}\n+\t}\n+\treturn predicates, nil\n+}\n+\n+// legacyTarget names one legacy field a predicate writes: an attribute key, or\n+// one of the scalar fields when attribute is false.\n+type legacyTarget struct {\n+\tattribute bool\n+\tname      string\n+}\n+\n+const (\n+\ttargetDurationMin = \"duration_min\"\n+\ttargetDurationMax = \"duration_max\"\n+)\n+\n+// legacyWriter writes the predicates of a flat conjunction into the legacy\n+// fields of q. It remembers which fields it has written, because a second\n+// predicate on the same field has no legacy equivalent.\n+type legacyWriter struct {\n+\tq       TraceQueryParams\n+\twritten map[legacyTarget]bool\n+}\n+\n+// claim records that target is written, and refuses a second predicate on it.\n+// name is how the refusal names the field.\n+func (w *legacyWriter) claim(target legacyTarget, name string) error {\n+\tif w.written[target] {\n+\t\treturn fmt.Errorf(\"%w: it takes only one predicate on %q\", ErrFilterUnsupported, name)\n+\t}\n+\tw.written[target] = true\n+\treturn nil\n+}\n+\n+func (w *legacyWriter) write(predicate *expression.Call) error {\n+\tswitch predicate.Op {\n+\tcase expression.OpOr, expression.OpNot, expression.OpExists:\n+\t\treturn errOperatorUnsupported(predicate.Op)\n+\t}\n+\tif len(predicate.Args) != 2 {\n+\t\treturn errOperatorUnsupported(predicate.Op)\n+\t}\n+\tswitch ref := predicate.Args[0].(type) {\n+\tcase *expression.AttributeRef:\n+\t\tif ref != nil {\n+\t\t\treturn w.writeAttribute(predicate.Op, ref, predicate.Args[1])\n+\t\t}\n+\tcase *expression.FieldRef:\n+\t\tif ref != nil {\n+\t\t\treturn w.writeField(predicate.Op, ref, predicate.Args[1])\n+\t\t}\n+\t}\n+\treturn fmt.Errorf(\"%w: it compares a reference against a constant only\", ErrFilterUnsupported)\n+}\n+\n+// writeAttribute writes an equality on an attribute as a tag. A tag matches\n+// the span, its resource and its events, so an attribute qualified by any of\n+// those levels widens to a plain tag.\n+func (w *legacyWriter) writeAttribute(op expression.Operator, ref *expression.AttributeRef, operand expression.Expression) error {\n+\tswitch ref.Level {\n+\tcase \"\", expression.LevelSpan, expression.LevelResource, expression.LevelEvent:\n+\tdefault:\n+\t\treturn errLevelUnsupported(ref.Level)\n+\t}\n+\tvalue, err := equalString(op, ref.Key, operand)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif err := w.claim(legacyTarget{attribute: true, name: ref.Key}, ref.Key); err != nil {\n+\t\treturn err\n+\t}\n+\tw.q.Attributes.PutStr(ref.Key, value)\n+\treturn nil\n+}\n+\n+// writeField writes a predicate on one of the built-in fields that have a\n+// legacy equivalent: the service, the operation name and the duration.\n+func (w *legacyWriter) writeField(op expression.Operator, ref *expression.FieldRef, operand expression.Expression) error {\n+\tswitch {\n+\tcase ref.Level == expression.LevelResource && ref.Name == expression.ResourceFieldService:\n+\t\treturn w.writeString(&w.q.ServiceName, op, ref.Name, operand)\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldName:\n+\t\treturn w.writeString(&w.q.OperationName, op, ref.Name, operand)\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldDuration:\n+\t\treturn w.writeDuration(op, operand)\n+\tdefault:\n+\t\treturn fmt.Errorf(\"%w: it does not support the built-in field %q of the %q level\",\n+\t\t\tErrFilterUnsupported, ref.Name, ref.Level)\n+\t}\n+}\n+\n+func (w *legacyWriter) writeString(field *string, op expression.Operator, name string, operand expression.Expression) error {\n+\tvalue, err := equalString(op, name, operand)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif err := w.claim(legacyTarget{name: name}, name); err != nil {\n+\t\treturn err\n+\t}\n+\t*field = value\n+\treturn nil\n+}\n+\n+// writeDuration writes gte and lte on the duration as the inclusive bounds\n+// DurationMin and DurationMax.\n+func (w *legacyWriter) writeDuration(op expression.Operator, operand expression.Expression) error {\n+\tvar bound *time.Duration\n+\tvar target string\n+\tswitch op {\n+\tcase expression.OpGte:\n+\t\tbound, target = &w.q.DurationMin, targetDurationMin\n+\tcase expression.OpLte:\n+\t\tbound, target = &w.q.DurationMax, targetDurationMax\n+\tdefault:\n+\t\treturn errOperatorOnUnsupported(op, expression.SpanFieldDuration)\n+\t}\n+\tvalue, err := durationConstant(operand)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif err := w.claim(legacyTarget{name: target}, expression.SpanFieldDuration); err != nil {\n+\t\treturn err\n+\t}\n+\t*bound = value\n+\treturn nil\n+}\n+\n+// durationConstant returns the length of time a duration bound names.\n+func durationConstant(operand expression.Expression) (time.Duration, error) {\n+\tswitch constant := operand.(type) {\n+\tcase *expression.DurationValue:\n+\t\tif constant != nil {\n+\t\t\treturn constant.Value, nil\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif constant != nil {\n+\t\t\t// Finalizing a filter reads every constant beside the duration as\n+\t\t\t// a duration, so an untyped one means it was never finalized.\n+\t\t\treturn 0, fmt.Errorf(\"%w: the bound %q on %q was never read as a duration\",\n+\t\t\t\tErrFilterInvalid, constant.Value, expression.SpanFieldDuration)\n+\t\t}\n+\t}\n+\treturn 0, fmt.Errorf(\"%w: it compares %q against a duration such as \\\"2s\\\" only\",\n+\t\tErrFilterUnsupported, expression.SpanFieldDuration)\n+}\n+\n+// equalString returns the text of an equality against a string or untyped\n+// constant, which is the only comparison a legacy string field expresses.\n+func equalString(op expression.Operator, name string, operand expression.Expression) (string, error) {\n+\tif op != expression.OpEq {\n+\t\treturn \"\", errOperatorOnUnsupported(op, name)\n+\t}\n+\tswitch constant := operand.(type) {\n+\tcase *expression.StringValue:\n+\t\tif constant != nil {\n+\t\t\treturn constant.Value, nil\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif constant != nil {\n+\t\t\treturn constant.Value, nil\n+\t\t}\n+\t}\n+\treturn \"\", fmt.Errorf(\"%w: it compares %q against a string constant only\", ErrFilterUnsupported, name)\n+}\n+\n+// attributeCount is the number of entries in m, and zero for a map left at\n+// its zero value, on which pcommon.Map's own methods panic.\n+func attributeCount(m pcommon.Map) int {\n+\tif m == (pcommon.Map{}) {\n+\t\treturn 0\n+\t}\n+\treturn m.Len()\n+}\n+\n+func errOperatorUnsupported(op expression.Operator) error {\n+\treturn fmt.Errorf(\"%w: it does not support the operator %q\", ErrFilterUnsupported, op)\n+}\n+\n+func errOperatorOnUnsupported(op expression.Operator, name string) error {\n+\treturn fmt.Errorf(\"%w: it does not support the operator %q on %q\", ErrFilterUnsupported, op, name)\n+}\n+\n+func errLevelUnsupported(level expression.Level) error {\n+\treturn fmt.Errorf(\"%w: it does not index the %q level\", ErrFilterUnsupported, level)\n+}\ndiff --git a/internal/storage/v2/api/tracestore/filter_test.go b/internal/storage/v2/api/tracestore/filter_test.go\nnew file mode 100644\nindex 0000000..ae65451\n--- /dev/null\n+++ b/internal/storage/v2/api/tracestore/filter_test.go\n@@ -0,0 +1,507 @@\n+// Copyright (c) 2026 The Jaeger Authors.\n+// SPDX-License-Identifier: Apache-2.0\n+\n+package tracestore\n+\n+import (\n+\t\"testing\"\n+\t\"time\"\n+\n+\t\"github.com/stretchr/testify/assert\"\n+\t\"github.com/stretchr/testify/require\"\n+\t\"go.opentelemetry.io/collector/pdata/pcommon\"\n+\n+\texpression \"github.com/jaegertracing/jaeger-idl/query/expression/v1\"\n+)\n+\n+func call(op expression.Operator, args ...expression.Expression) *expression.Call {\n+\treturn &expression.Call{Op: op, Args: args}\n+}\n+\n+func tag(op expression.Operator, key, value string) *expression.Call {\n+\treturn call(op, &expression.AttributeRef{Key: key}, &expression.AnyValue{Value: value})\n+}\n+\n+func serviceRef() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelResource, Name: expression.ResourceFieldService}\n+}\n+\n+func operationRef() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldName}\n+}\n+\n+func durationRef() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldDuration}\n+}\n+\n+func str(v string) *expression.StringValue { return &expression.StringValue{Value: v} }\n+\n+func dur(d time.Duration) *expression.DurationValue { return &expression.DurationValue{Value: d} }\n+\n+func withFilter(filter *expression.Call) TraceQueryParams {\n+\treturn TraceQueryParams{Attributes: pcommon.NewMap(), Filter: filter}\n+}\n+\n+func TestEnsureFilterStandsAlone(t *testing.T) {\n+\tfilter := tag(expression.OpEq, \"http.method\", \"GET\")\n+\ttests := []struct {\n+\t\tname     string\n+\t\tquery    TraceQueryParams\n+\t\texpected string\n+\t}{\n+\t\t{name: \"no filter\", query: TraceQueryParams{ServiceName: \"cart\", DurationMin: time.Second}},\n+\t\t{name: \"filter alone\", query: withFilter(filter)},\n+\t\t{name: \"filter with zero-value attributes\", query: TraceQueryParams{Filter: filter}},\n+\t\t{name: \"service name\", query: TraceQueryParams{Filter: filter, ServiceName: \"cart\"}, expected: \"[service_name]\"},\n+\t\t{name: \"operation name\", query: TraceQueryParams{Filter: filter, OperationName: \"op\"}, expected: \"[operation_name]\"},\n+\t\t{name: \"duration min\", query: TraceQueryParams{Filter: filter, DurationMin: 1}, expected: \"[duration_min]\"},\n+\t\t{name: \"duration max\", query: TraceQueryParams{Filter: filter, DurationMax: 1}, expected: \"[duration_max]\"},\n+\t\t{\n+\t\t\tname: \"attributes\",\n+\t\t\tquery: func() TraceQueryParams {\n+\t\t\t\tq := withFilter(filter)\n+\t\t\t\tq.Attributes.PutStr(\"a\", \"1\")\n+\t\t\t\treturn q\n+\t\t\t}(),\n+\t\t\texpected: \"[attributes]\",\n+\t\t},\n+\t\t{\n+\t\t\tname: \"every field\",\n+\t\t\tquery: func() TraceQueryParams {\n+\t\t\t\tq := withFilter(filter)\n+\t\t\t\tq.ServiceName, q.OperationName = \"cart\", \"op\"\n+\t\t\t\tq.DurationMin, q.DurationMax = 1, 2\n+\t\t\t\tq.Attributes.PutStr(\"a\", \"1\")\n+\t\t\t\treturn q\n+\t\t\t}(),\n+\t\t\texpected: \"[service_name operation_name duration_min duration_max attributes]\",\n+\t\t},\n+\t}\n+\tfor _, test := range tests {\n+\t\tt.Run(test.name, func(t *testing.T) {\n+\t\t\terr := test.query.EnsureFilterStandsAlone()\n+\t\t\tif test.expected == \"\" {\n+\t\t\t\trequire.NoError(t, err)\n+\t\t\t\treturn\n+\t\t\t}\n+\t\t\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\t\t\tassert.Contains(t, err.Error(), test.expected)\n+\t\t})\n+\t}\n+}\n+\n+func TestForCapabilities(t *testing.T) {\n+\tfilter := tag(expression.OpEq, \"http.method\", \"GET\")\n+\n+\tt.Run(\"no filter is returned unchanged\", func(t *testing.T) {\n+\t\tquery := TraceQueryParams{ServiceName: \"cart\", Attributes: pcommon.NewMap()}\n+\t\tgot, err := query.ForCapabilities(SearchCapabilities{})\n+\t\trequire.NoError(t, err)\n+\t\tassert.Equal(t, query, got)\n+\t})\n+\n+\tfor name, caps := range map[string]SearchCapabilities{\n+\t\t\"no declaration\":    {},\n+\t\t\"empty declaration\": {Filter: &FilterCapabilities{}},\n+\t} {\n+\t\tt.Run(name+\" rewrites into legacy fields\", func(t *testing.T) {\n+\t\t\tgot, err := withFilter(filter).ForCapabilities(caps)\n+\t\t\trequire.NoError(t, err)\n+\t\t\tassert.Nil(t, got.Filter)\n+\t\t\tvalue, ok := got.Attributes.Get(\"http.method\")\n+\t\t\trequire.True(t, ok)\n+\t\t\tassert.Equal(t, \"GET\", value.Str())\n+\t\t})\n+\t}\n+\n+\tt.Run(\"empty declaration refuses what legacy cannot express\", func(t *testing.T) {\n+\t\tquery := withFilter(call(expression.OpOr, filter, filter))\n+\t\tgot, err := query.ForCapabilities(SearchCapabilities{})\n+\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\tassert.Equal(t, query, got)\n+\t})\n+\n+\tt.Run(\"declaring reader gets the filter as it is\", func(t *testing.T) {\n+\t\tquery := withFilter(filter)\n+\t\tgot, err := query.ForCapabilities(SearchCapabilities{\n+\t\t\tFilter: &FilterCapabilities{Operators: []expression.Operator{expression.OpEq}},\n+\t\t})\n+\t\trequire.NoError(t, err)\n+\t\tassert.Equal(t, query, got)\n+\t})\n+\n+\tt.Run(\"declaring reader refuses what it did not declare\", func(t *testing.T) {\n+\t\tquery := withFilter(filter)\n+\t\tgot, err := query.ForCapabilities(SearchCapabilities{\n+\t\t\tFilter: &FilterCapabilities{Operators: []expression.Operator{expression.OpNe}},\n+\t\t})\n+\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\tassert.Contains(t, err.Error(), `it does not support the operator \"eq\"`)\n+\t\tassert.Equal(t, query, got)\n+\t})\n+}\n+\n+func TestEnsureSupported(t *testing.T) {\n+\tcaps := FilterCapabilities{\n+\t\tLevels: []expression.Level{expression.LevelSpan},\n+\t\tOperators: []expression.Operator{\n+\t\t\texpression.OpAnd, expression.OpEq, expression.OpNe, expression.OpSome,\n+\t\t},\n+\t}\n+\teventName := call(expression.OpEq,\n+\t\t&expression.FieldRef{Level: expression.LevelEvent, Name: expression.EventFieldName}, str(\"exception\"))\n+\ttests := []struct {\n+\t\tname     string\n+\t\tfilter   *expression.Call\n+\t\texpected string\n+\t}{\n+\t\t{name: \"nil filter\"},\n+\t\t{name: \"unqualified attribute\", filter: tag(expression.OpEq, \"a\", \"1\")},\n+\t\t{\n+\t\t\tname: \"declared level and operators, nested\",\n+\t\t\tfilter: call(expression.OpAnd,\n+\t\t\t\ttag(expression.OpEq, \"a\", \"1\"),\n+\t\t\t\tcall(expression.OpNe, &expression.AttributeRef{Key: \"b\", Level: expression.LevelSpan}, str(\"x\")),\n+\t\t\t\tcall(expression.OpEq, operationRef(), str(\"GET\"))),\n+\t\t},\n+\t\t{name: \"operator\", filter: tag(expression.OpGt, \"a\", \"1\"), expected: `it does not support the operator \"gt\"`},\n+\t\t{\n+\t\t\tname:     \"nested operator\",\n+\t\t\tfilter:   call(expression.OpAnd, tag(expression.OpEq, \"a\", \"1\"), call(expression.OpOr, tag(expression.OpEq, \"b\", \"1\"), tag(expression.OpEq, \"c\", \"1\"))),\n+\t\t\texpected: `it does not support the operator \"or\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"attribute level\",\n+\t\t\tfilter:   call(expression.OpEq, &expression.AttributeRef{Key: \"a\", Level: expression.LevelLink}, str(\"1\")),\n+\t\t\texpected: `it does not index the \"link\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"field level\",\n+\t\t\tfilter:   call(expression.OpEq, serviceRef(), str(\"cart\")),\n+\t\t\texpected: `it does not index the \"resource\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"nested reference level\",\n+\t\t\tfilter:   call(expression.OpSome, &expression.NestedRef{Level: expression.LevelEvent}, eventName),\n+\t\t\texpected: `it does not index the \"event\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"level on the right of a comparison\",\n+\t\t\tfilter: call(expression.OpNe,\n+\t\t\t\t&expression.AttributeRef{Key: \"a\", Level: expression.LevelSpan},\n+\t\t\t\t&expression.AttributeRef{Key: \"a\", Level: expression.LevelResource}),\n+\t\t\texpected: `it does not index the \"resource\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"call on the right of a comparison\",\n+\t\t\tfilter:   call(expression.OpEq, &expression.AttributeRef{Key: \"a\"}, call(expression.OpRegex)),\n+\t\t\texpected: `it does not support the operator \"regex\"`,\n+\t\t},\n+\t}\n+\tfor _, test := range tests {\n+\t\tt.Run(test.name, func(t *testing.T) {\n+\t\t\terr := caps.EnsureSupported(test.filter)\n+\t\t\tif test.expected == \"\" {\n+\t\t\t\trequire.NoError(t, err)\n+\t\t\t\treturn\n+\t\t\t}\n+\t\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\t\tassert.Contains(t, err.Error(), test.expected)\n+\t\t})\n+\t}\n+}\n+\n+func TestEnsureSupported_RefusesACycle(t *testing.T) {\n+\tcycle := call(expression.OpAnd)\n+\tcycle.Args = []expression.Expression{cycle, cycle}\n+\terr := FilterCapabilities{Operators: []expression.Operator{expression.OpAnd}}.EnsureSupported(cycle)\n+\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\trequire.ErrorIs(t, err, expression.ErrTooDeeplyNested)\n+}\n+\n+func TestToFilterShape(t *testing.T) {\n+\tstart := time.Unix(100, 0)\n+\tattrs := pcommon.NewMap()\n+\tattrs.PutStr(\"http.method\", \"GET\")\n+\tattrs.PutInt(\"http.status_code\", 500)\n+\n+\ttests := []struct {\n+\t\tname     string\n+\t\tquery    TraceQueryParams\n+\t\texpected *expression.Call\n+\t}{\n+\t\t{name: \"no predicates\", query: TraceQueryParams{Attributes: pcommon.NewMap()}},\n+\t\t{name: \"zero-value attributes\", query: TraceQueryParams{}},\n+\t\t{\n+\t\t\tname:     \"one predicate stands on its own\",\n+\t\t\tquery:    TraceQueryParams{ServiceName: \"cart\", Attributes: pcommon.NewMap()},\n+\t\t\texpected: call(expression.OpEq, serviceRef(), str(\"cart\")),\n+\t\t},\n+\t\t{\n+\t\t\tname: \"every field, in order\",\n+\t\t\tquery: TraceQueryParams{\n+\t\t\t\tServiceName:   \"cart\",\n+\t\t\t\tOperationName: \"GET /cart\",\n+\t\t\t\tAttributes:    attrs,\n+\t\t\t\tDurationMin:   time.Second,\n+\t\t\t\tDurationMax:   2 * time.Second,\n+\t\t\t},\n+\t\t\texpected: call(expression.OpAnd,\n+\t\t\t\tcall(expression.OpEq, serviceRef(), str(\"cart\")),\n+\t\t\t\tcall(expression.OpEq, operationRef(), str(\"GET /cart\")),\n+\t\t\t\ttag(expression.OpEq, \"http.method\", \"GET\"),\n+\t\t\t\ttag(expression.OpEq, \"http.status_code\", \"500\"),\n+\t\t\t\tcall(expression.OpGte, durationRef(), dur(time.Second)),\n+\t\t\t\tcall(expression.OpLte, durationRef(), dur(2*time.Second))),\n+\t\t},\n+\t}\n+\tfor _, test := range tests {\n+\t\tt.Run(test.name, func(t *testing.T) {\n+\t\t\tquery := test.query\n+\t\t\tquery.StartTimeMin = start\n+\t\t\tquery.SearchDepth = 20\n+\t\t\tgot := query.ToFilterShape()\n+\n+\t\t\tassert.Equal(t, test.expected, got.Filter)\n+\t\t\tassert.Equal(t, TraceQueryParams{\n+\t\t\t\tAttributes:   pcommon.NewMap(),\n+\t\t\t\tStartTimeMin: start,\n+\t\t\t\tSearchDepth:  20,\n+\t\t\t\tFilter:       test.expected,\n+\t\t\t}, got)\n+\t\t\tif got.Filter != nil {\n+\t\t\t\trequire.NoError(t, expression.ValidateFilter(got.Filter))\n+\t\t\t\tresolved, err := expression.ResolveConstants(got.Filter)\n+\t\t\t\trequire.NoError(t, err)\n+\t\t\t\tassert.Equal(t, got.Filter, resolved)\n+\t\t\t}\n+\t\t})\n+\t}\n+\tassert.Equal(t, 2, attrs.Len(), \"the caller's map is not changed\")\n+}\n+\n+func TestToFilterShape_KeepsAnExistingFilter(t *testing.T) {\n+\tquery := withFilter(tag(expression.OpEq, \"a\", \"1\"))\n+\tquery.ServiceName = \"cart\"\n+\tassert.Equal(t, query, query.ToFilterShape())\n+}\n+\n+func TestToLegacyShape_RoundTrip(t *testing.T) {\n+\tattrs := pcommon.NewMap()\n+\tattrs.PutStr(\"http.method\", \"GET\")\n+\tattrs.PutStr(\"peer.service\", \"db\")\n+\tqueries := map[string]TraceQueryParams{\n+\t\t\"empty\":   {Attributes: pcommon.NewMap()},\n+\t\t\"service\": {ServiceName: \"cart\", Attributes: pcommon.NewMap()},\n+\t\t\"every field\": {\n+\t\t\tServiceName:   \"cart\",\n+\t\t\tOperationName: \"GET /cart\",\n+\t\t\tAttributes:    attrs,\n+\t\t\tStartTimeMin:  time.Unix(100, 0),\n+\t\t\tStartTimeMax:  time.Unix(200, 0),\n+\t\t\tDurationMin:   time.Second,\n+\t\t\tDurationMax:   time.Minute,\n+\t\t\tSearchDepth:   20,\n+\t\t},\n+\t}\n+\tfor name, query := range queries {\n+\t\tt.Run(name, func(t *testing.T) {\n+\t\t\tgot, err := query.ToFilterShape().ToLegacyShape()\n+\t\t\trequire.NoError(t, err)\n+\t\t\tassert.Equal(t, query, got)\n+\t\t})\n+\t}\n+}\n+\n+func TestToLegacyShape_NoFilterIsUnchanged(t *testing.T) {\n+\tquery := TraceQueryParams{ServiceName: \"cart\"}\n+\tgot, err := query.ToLegacyShape()\n+\trequire.NoError(t, err)\n+\tassert.Equal(t, query, got)\n+}\n+\n+func TestToLegacyShape_Converts(t *testing.T) {\n+\tquery := withFilter(call(expression.OpAnd,\n+\t\tcall(expression.OpAnd,\n+\t\t\tcall(expression.OpEq, serviceRef(), &expression.AnyValue{Value: \"cart\"}),\n+\t\t\tcall(expression.OpEq, operationRef(), str(\"GET /cart\"))),\n+\t\tcall(expression.OpEq, &expression.AttributeRef{Key: \"a\", Level: expression.LevelSpan}, str(\"1\")),\n+\t\tcall(expression.OpEq, &expression.AttributeRef{Key: \"b\", Level: expression.LevelResource}, str(\"2\")),\n+\t\tcall(expression.OpEq, &expression.AttributeRef{Key: \"c\", Level: expression.LevelEvent}, str(\"3\")),\n+\t\ttag(expression.OpEq, \"d\", \"4\"),\n+\t\tcall(expression.OpLte, durationRef(), dur(time.Minute)),\n+\t\tcall(expression.OpGte, durationRef(), dur(time.Second))))\n+\tquery.SearchDepth = 10\n+\tcallerAttrs := query.Attributes\n+\n+\tgot, err := query.ToLegacyShape()\n+\trequire.NoError(t, err)\n+\n+\texpectedAttrs := pcommon.NewMap()\n+\tfor _, kv := range [][2]string{{\"a\", \"1\"}, {\"b\", \"2\"}, {\"c\", \"3\"}, {\"d\", \"4\"}} {\n+\t\texpectedAttrs.PutStr(kv[0], kv[1])\n+\t}\n+\tassert.Equal(t, TraceQueryParams{\n+\t\tServiceName:   \"cart\",\n+\t\tOperationName: \"GET /cart\",\n+\t\tAttributes:    expectedAttrs,\n+\t\tDurationMin:   time.Second,\n+\t\tDurationMax:   time.Minute,\n+\t\tSearchDepth:   10,\n+\t}, got)\n+\tassert.Equal(t, 0, callerAttrs.Len(), \"the caller's map is not changed\")\n+}\n+\n+func TestToLegacyShape_ConvertsWithZeroValueAttributes(t *testing.T) {\n+\tgot, err := TraceQueryParams{Filter: tag(expression.OpEq, \"a\", \"1\")}.ToLegacyShape()\n+\trequire.NoError(t, err)\n+\tvalue, ok := got.Attributes.Get(\"a\")\n+\trequire.True(t, ok)\n+\tassert.Equal(t, \"1\", value.Str())\n+}\n+\n+func TestToLegacyShape_Refuses(t *testing.T) {\n+\tok := tag(expression.OpEq, \"a\", \"1\")\n+\tattrAt := func(level expression.Level) *expression.AttributeRef {\n+\t\treturn &expression.AttributeRef{Key: \"a\", Level: level}\n+\t}\n+\ttests := []struct {\n+\t\tname     string\n+\t\tfilter   *expression.Call\n+\t\texpected string\n+\t}{\n+\t\t{name: \"or\", filter: call(expression.OpOr, ok, ok), expected: `does not support the operator \"or\"`},\n+\t\t{name: \"not\", filter: call(expression.OpNot, ok), expected: `does not support the operator \"not\"`},\n+\t\t{\n+\t\t\tname:     \"exists\",\n+\t\t\tfilter:   call(expression.OpExists, &expression.AttributeRef{Key: \"a\"}),\n+\t\t\texpected: `does not support the operator \"exists\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"or nested in a conjunction\",\n+\t\t\tfilter:   call(expression.OpAnd, ok, call(expression.OpOr, ok, ok)),\n+\t\t\texpected: `does not support the operator \"or\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"predicate with three arguments\",\n+\t\t\tfilter:   call(expression.OpEq, &expression.AttributeRef{Key: \"a\"}, str(\"1\"), str(\"2\")),\n+\t\t\texpected: `does not support the operator \"eq\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"bare reference in a conjunction\",\n+\t\t\tfilter:   call(expression.OpAnd, ok, &expression.AttributeRef{Key: \"b\"}),\n+\t\t\texpected: \"conjunction of predicates only\",\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"nil call in a conjunction\",\n+\t\t\tfilter:   call(expression.OpAnd, ok, (*expression.Call)(nil)),\n+\t\t\texpected: \"conjunction of predicates only\",\n+\t\t},\n+\t\t{name: \"ne on an attribute\", filter: tag(expression.OpNe, \"http.method\", \"GET\"), expected: `does not support the operator \"ne\" on \"http.method\"`},\n+\t\t{\n+\t\t\tname:     \"in on an attribute\",\n+\t\t\tfilter:   call(expression.OpIn, &expression.AttributeRef{Key: \"http.status_code\"}, &expression.List{Values: []string{\"500\"}, Type: exp turn fmt.Errorf(\"%w: a query with a filter cannot also set %v\", ErrFilterInvalid, conflicts)\n+}\n+\n+// ForCapabilities gives the Reader whichever of the two filtering models it\n+// declared it can evaluate. A Reader that declared no filter support gets the\n+// filter expressed in the legacy predicate fields; one that did gets the\n+// filter as it is, provided it declared everything the filter uses.\n+func (q TraceQueryParams) ForCapabilities(caps SearchCapabilities) (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\tif caps.Filter.IsEmpty() {\n+\t\treturn q.ToLegacyShape()\n+\t}\n+\treturn q, caps.Filter.EnsureSupported(q.Filter)\n+}\n+\n+// ToFilterShape expresses q's scalar predicate fields as filter predicates.\n+// It cannot fail, because each legacy field has an exact filter equivalent.\n+// A query that already has a Filter is returned as it is.\n+func (q TraceQueryParams) ToFilterShape() TraceQueryParams {\n+\tif q.Filter != nil {\n+\t\treturn q\n+\t}\n+\tvar predicates []*expression.Call\n+\tif q.ServiceName != \"\" {\n+\t\tpredicates = append(predicates, eq(\n+\t\t\t&expression.FieldRef{Level: expression.LevelResource, Name: expression.ResourceFieldService},\n+\t\t\t&expression.StringValue{Value: q.ServiceName}))\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tpredicates = append(predicates, eq(\n+\t\t\t&expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldName},\n+\t\t\t&expression.StringValue{Value: q.OperationName}))\n+\t}\n+\tif attributeCount(q.Attributes) > 0 {\n+\t\tfor key, value := range q.Attributes.All() {\n+\t\t\tpredicates = append(predicates, eq(\n+\t\t\t\t&expression.AttributeRef{Key: key},\n+\t\t\t\t&expression.AnyValue{Value: value.AsString()}))\n+\t\t}\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tpredicates = append(predicates, durationBound(expression.OpGte, q.DurationMin))\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tpredicates = append(predicates, durationBound(expression.OpLte, q.DurationMax))\n+\t}\n+\n+\tq.ServiceName = \"\"\n+\tq.OperationName = \"\"\n+\tq.Attributes = pcommon.NewMap()\n+\tq.DurationMin = 0\n+\tq.DurationMax = 0\n+\tswitch len(predicates) {\n+\tcase 0:\n+\t\tq.Filter = nil\n+\tcase 1:\n+\t\tq.Filter = predicates[0]\n+\tdefault:\n+\t\targs := make([]expression.Expression, len(predicates))\n+\t\tfor i, predicate := range predicates {\n+\t\t\targs[i] = predicate\n+\t\t}\n+\t\tq.Filter = &expression.Call{Op: expression.OpAnd, Args: args}\n+\t}\n+\treturn q\n+}\n+\n+func eq(ref, constant expression.Expression) *expression.Call {\n+\treturn &expression.Call{Op: expression.OpEq, Args: []expression.Expression{ref, constant}}\n+}\n+\n+func durationBound(op expression.Operator, d time.Duration) *expression.Call {\n+\treturn &expression.Call{Op: op, Args: []expression.Expression{\n+\t\t&expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldDuration},\n+\t\t&expression.DurationValue{Value: d},\n+\t}}\n+}\n+\n+// ToLegacyShape expresses q's Filter in the scalar predicate fields every\n+// backend serves. Only a flat conjunction of the predicates those fields can\n+// hold converts; anything else is refused with ErrFilterUnsupported rather\n+// than approximated. On error the original query is returned.\n+//\n+// The result has a nil Filter and a new Attributes map, so the caller's map\n+// is not changed.\n+func (q TraceQueryParams) ToLegacyShape() (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\t// Writing the filter into fields the query already sets would merge two\n+\t// questions into one, so only a filter that stands alone is converted.\n+\tif err := q.EnsureFilterStandsAlone(); err != nil {\n+\t\treturn q, err\n+\t}\n+\tpredicates, err := flattenConjunction(q.Filter, nil, 1)\n+\tif err != nil {\n+\t\treturn q, err\n+\t}\n+\tlegacy := q\n+\tlegacy.Filter = nil\n+\tlegacy.Attributes = pcommon.NewMap()\n+\tw := legacyWriter{query: &legacy}\n+\tfor _, predicate := range predicates {\n+\t\tif err := w.write(predicate); err != nil {\n+\t\t\treturn q, err\n+\t\t}\n+\t}\n+\treturn legacy, nil\n+}\n+\n+// flattenConjunction appends the predicates of call to out, reading through\n+// nested conjunctions, since and is associative. depth bounds the walk the\n+// way expression.MaxNestingDepth bounds validation.\n+func flattenConjunction(call *expression.Call, out []*expression.Call, depth int) ([]*expression.Call, error) {\n+\tif depth > expression.MaxNestingDepth {\n+\t\treturn nil, fmt.Errorf(\"%w: %w\", ErrFilterInvalid, expression.ErrTooDeeplyNested)\n+\t}\n+\tif call.Op != expression.OpAnd {\n+\t\treturn append(out, call), nil\n+\t}\n+\tfor _, arg := range call.Args {\n+\t\tnested, ok := arg.(*expression.Call)\n+\t\tif !ok || nested == nil {\n+\t\t\treturn nil, fmt.Errorf(\"%w: it serves a conjunction of predicates only\", ErrFilterUnsupported)\n+\t\t}\n+\t\tvar err error\n+\t\tif out, err = flattenConjunction(nested, out, depth+1); err != nil {\n+\t\t\treturn nil, err\n+\t\t}\n+\t}\n+\treturn out, nil\n+}\n+\n+// legacyWriter writes predicates into the legacy fields of query, refusing a\n+// second predicate on a field one has already written.\n+type legacyWriter struct {\n+\tquery                    *TraceQueryParams\n+\tservice, operation       bool\n+\tdurationMin, durationMax bool\n+}\n+\n+func (w *legacyWriter) write(predicate *expression.Call) error {\n+\tswitch predicate.Op {\n+\tcase expression.OpOr, expression.OpNot, expression.OpExists:\n+\t\treturn errOperatorUnsupported(predicate.Op)\n+\t}\n+\tif len(predicate.Args) != 2 {\n+\t\treturn errOperatorUnsupported(predicate.Op)\n+\t}\n+\tswitch ref := predicate.Args[0].(type) {\n+\tcase *expression.AttributeRef:\n+\t\tif ref != nil {\n+\t\t\treturn w.writeAttribute(predicate.Op, ref, predicate.Args[1])\n+\t\t}\n+\tcase *expression.FieldRef:\n+\t\tif ref != nil {\n+\t\t\treturn w.writeField(predicate.Op, ref, predicate.Args[1])\n+\t\t}\n+\t}\n+\treturn fmt.Errorf(\"%w: it compares a reference against a constant only\", ErrFilterUnsupported)\n+}\n+\n+// writeAttribute writes an equality on an attribute as a tag. A tag is matched\n+// at the span, resource and event levels alike, so a predicate at one of them\n+// widens to a plain tag; the link and scope levels have no tag to widen to.\n+func (w *legacyWriter) writeAttribute(op expression.Operator, ref *expression.AttributeRef, constant expression.Expression) error {\n+\tswitch ref.Level {\n+\tcase \"\", expression.LevelSpan, expression.LevelResource, expression.LevelEvent:\n+\tdefault:\n+\t\treturn errLevelUnsupported(ref.Level)\n+\t}\n+\tif _, exists := w.query.Attributes.Get(ref.Key); exists {\n+\t\treturn errDuplicatePredicate(ref.Key)\n+\t}\n+\tvar value string\n+\tif err := stringOperand(op, ref.Key, constant, &value); err != nil {\n+\t\treturn err\n+\t}\n+\tw.query.Attributes.PutStr(ref.Key, value)\n+\treturn nil\n+}\n+\n+func (w *legacyWriter) writeField(op expression.Operator, ref *expression.FieldRef, constant expression.Expression) error {\n+\tswitch {\n+\tcase ref.Level == expression.LevelResource && ref.Name == expression.ResourceFieldService:\n+\t\treturn writeOnce(&w.service, ref.Name, func() error {\n+\t\t\treturn stringOperand(op, ref.Name, constant, &w.query.ServiceName)\n+\t\t})\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldName:\n+\t\treturn writeOnce(&w.operation, ref.Name, func() error {\n+\t\t\treturn stringOperand(op, ref.Name, constant, &w.query.OperationName)\n+\t\t})\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldDuration:\n+\t\tswitch op {\n+\t\tcase expression.OpGte:\n+\t\t\treturn writeOnce(&w.durationMin, ref.Name, func() error {\n+\t\t\t\treturn durationOperand(ref.Name, constant, &w.query.DurationMin)\n+\t\t\t})\n+\t\tcase expression.OpLte:\n+\t\t\treturn writeOnce(&w.durationMax, ref.Name, func() error {\n+\t\t\t\treturn durationOperand(ref.Name, constant, &w.query.DurationMax)\n+\t\t\t})\n+\t\tdefault:\n+\t\t\treturn errOperatorOnUnsupported(op, ref.Name)\n+\t\t}\n+\tdefault:\n+\t\treturn fmt.Errorf(\"%w: it does not support the built-in field %q of the %q level\",\n+\t\t\tErrFilterUnsupported, ref.Name, ref.Level)\n+\t}\n+}\n+\n+// writeOnce runs write unless written says a predicate already wrote the\n+// field, and records that one has.\n+func writeOnce(written *bool, name string, write func() error) error {\n+\tif *written {\n+\t\treturn errDuplicatePredicate(name)\n+\t}\n+\tif err := write(); err != nil {\n+\t\treturn err\n+\t}\n+\t*written = true\n+\treturn nil\n+}\n+\n+// stringOperand reads the constant of an equality on a field that holds text\n+// into field.\n+func stringOperand(op expression.Operator, name string, constant expression.Expression, field *string) error {\n+\tif op != expression.OpEq {\n+\t\treturn errOperatorOnUnsupported(op, name)\n+\t}\n+\tswitch value := constant.(type) {\n+\tcase *expression.StringValue:\n+\t\tif value != nil {\n+\t\t\t*field = value.Value\n+\t\t\treturn nil\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif value != nil {\n+\t\t\t*field = value.Value\n+\t\t\treturn nil\n+\t\t}\n+\t}\n+\treturn fmt.Errorf(\"%w: it compares %q against a string constant only\", ErrFilterUnsupported, name)\n+}\n+\n+// durationOperand reads the constant of a duration bound into bound.\n+func durationOperand(name string, constant expression.Expression, bound *time.Duration) error {\n+\tswitch value := constant.(type) {\n+\tcase *expression.DurationValue:\n+\t\tif value != nil {\n+\t\t\t*bound = value.Value\n+\t\t\treturn nil\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif value != nil {\n+\t\t\t// expression.ResolveConstants reads such a constant as a duration,\n+\t\t\t// so one that is still untyped was never resolved.\n+\t\t\treturn fmt.Errorf(\"%w: the bound %q on %q was never read as a duration\",\n+\t\t\t\tErrFilterInvalid, value.Value, name)\n+\t\t}\n+\t}\n+\treturn fmt.Errorf(\"%w: it compares %q against a duration such as \\\"2s\\\" only\", ErrFilterUnsupported, name)\n+}\n+\n+func errOperatorOnUnsupported(op expression.Operator, name string) error {\n+\treturn fmt.Errorf(\"%w: it does not support the operator %q on %q\", ErrFilterUnsupported, op, name)\n+}\n+\n+func errDuplicatePredicate(name string) error {\n+\treturn fmt.Errorf(\"%w: it holds only one predicate on %q\", ErrFilterUnsupported, name)\n+}\n+\n+// attributeCount is the number of entries in m. An Attributes map left at its\n+// zero value, rather than created with pcommon.NewMap, has none, and asking\n+// it directly would panic.\n+func attributeCount(m pcommon.Map) int {\n+\tif m == (pcommon.Map{}) {\n+\t\treturn 0\n+\t}\n+\treturn m.Len()\n+}\ndiff --git a/internal/storage/v2/api/tracestore/query_shape_test.go b/internal/storage/v2/api/tracestore/query_shape_test.go\nnew file mode 100644\nindex 0000000..3c7e745\n--- /dev/null\n+++ b/internal/storage/v2/api/tracestore/query_shape_test.go\n@@ -0,0 +1,572 @@\n+// Copyright (c) 2026 The Jaeger Authors.\n+// SPDX-License-Identifier: Apache-2.0\n+\n+package tracestore\n+\n+import (\n+\t\"testing\"\n+\t\"time\"\n+\n+\t\"github.com/stretchr/testify/assert\"\n+\t\"github.com/stretchr/testify/require\"\n+\t\"go.opentelemetry.io/collector/pdata/pcommon\"\n+\n+\texpression \"github.com/jaegertracing/jaeger-idl/query/expression/v1\"\n+)\n+\n+func attr(key, value string) *expression.Call {\n+\treturn call(expression.OpEq, &expression.AttributeRef{Key: key}, &expression.AnyValue{Value: value})\n+}\n+\n+func service(value string) *expression.Call {\n+\treturn call(expression.OpEq,\n+\t\t&expression.FieldRef{Level: expression.LevelResource, Name: expression.ResourceFieldService},\n+\t\t&expression.StringValue{Value: value})\n+}\n+\n+func operation(value string) *expression.Call {\n+\treturn call(expression.OpEq,\n+\t\t&expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldName},\n+\t\t&expression.StringValue{Value: value})\n+}\n+\n+func bound(op expression.Operator, d time.Duration) *expression.Call {\n+\treturn call(op, spanDuration(), &expression.DurationValue{Value: d})\n+}\n+\n+func withFilter(filter *expression.Call) TraceQueryParams {\n+\treturn TraceQueryParams{Attributes: pcommon.NewMap(), Filter: filter}\n+}\n+\n+func attributesOf(kv ...string) pcommon.Map {\n+\tm := pcommon.NewMap()\n+\tfor i := 0; i < len(kv); i += 2 {\n+\t\tm.PutStr(kv[i], kv[i+1])\n+\t}\n+\treturn m\n+}\n+\n+func TestEnsureFilterStandsAlone_Passes(t *testing.T) {\n+\ttests := map[string]TraceQueryParams{\n+\t\t\"no filter, legacy fields set\": {\n+\t\t\tServiceName: \"cart\", DurationMin: time.Second, Attributes: attributesOf(\"a\", \"1\"),\n+\t\t},\n+\t\t\"a filter alone\": withFilter(attr(\"a\", \"1\")),\n+\t\t\"a filter beside an Attributes zero value\": {Filter: attr(\"a\", \"1\")},\n+\t\t\"a filter beside a time range and depth\": {\n+\t\t\tAttributes:   pcommon.NewMap(),\n+\t\t\tStartTimeMin: time.Unix(1, 0),\n+\t\t\tStartTimeMax: time.Unix(2, 0),\n+\t\t\tSearchDepth:  10,\n+\t\t\tFilter:       attr(\"a\", \"1\"),\n+\t\t},\n+\t}\n+\tfor name, query := range tests {\n+\t\tt.Run(name, func(t *testing.T) {\n+\t\t\tassert.NoError(t, query.EnsureFilterStandsAlone())\n+\t\t})\n+\t}\n+}\n+\n+func TestEnsureFilterStandsAlone_Refuses(t *testing.T) {\n+\ttests := []struct {\n+\t\tname     string\n+\t\tmutate   func(*TraceQueryParams)\n+\t\texpected string\n+\t}{\n+\t\t{\"service name\", func(q *TraceQueryParams) { q.ServiceName = \"cart\" }, \"[service_name]\"},\n+\t\t{\"operation name\", func(q *TraceQueryParams) { q.OperationName = \"GET\" }, \"[operation_name]\"},\n+\t\t{\"duration min\", func(q *TraceQueryParams) { q.DurationMin = time.Second }, \"[duration_min]\"},\n+\t\t{\"duration max\", func(q *TraceQueryParams) { q.DurationMax = time.Second }, \"[duration_max]\"},\n+\t\t{\"attributes\", func(q *TraceQueryParams) { q.Attributes.PutStr(\"a\", \"1\") }, \"[attributes]\"},\n+\t\t{\n+\t\t\tname: \"all of them, in a fixed order\",\n+\t\t\tmutate: func(q *TraceQueryParams) {\n+\t\t\t\tq.Attributes.PutStr(\"a\", \"1\")\n+\t\t\t\tq.DurationMax = time.Second\n+\t\t\t\tq.DurationMin = time.Second\n+\t\t\t\tq.OperationName = \"GET\"\n+\t\t\t\tq.ServiceName = \"cart\"\n+\t\t\t},\n+\t\t\texpected: \"[service_name operation_name duration_min duration_max attributes]\",\n+\t\t},\n+\t}\n+\tfor _, tt := range tests {\n+\t\tt.Run(tt.name, func(t *testing.T) {\n+\t\t\tquery := withFilter(attr(\"b\", \"2\"))\n+\t\t\ttt.mutate(&query)\n+\t\t\terr := query.EnsureFilterStandsAlone()\n+\t\t\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\t\t\tassert.ErrorContains(t, err, tt.expected)\n+\t\t})\n+\t}\n+}\n+\n+func TestForCapabilities_WithoutFilter(t *testing.T) {\n+\tquery := TraceQueryParams{ServiceName: \"cart\", Attributes: attributesOf(\"a\", \"1\")}\n+\tgot, err := query.ForCapabilities(SearchCapabilities{})\n+\trequire.NoError(t, err)\n+\tassert.Equal(t, query, got)\n+}\n+\n+func TestForCapabilities_UndeclaredReaderGetsTheLegacyShape(t *testing.T) {\n+\tfor name, caps := range map[string]*FilterCapabilities{\n+\t\t\"nil\":   nil,\n+\t\t\"empty\": {},\n+\t} {\n+\t\tt.Run(name, func(t *testing.T) {\n+\t\t\tgot, err := withFilter(call(expression.OpAnd, service(\"cart\"), attr(\"a\", \"1\"))).\n+\t\t\t\tForCapabilities(SearchCapabilities{Filter: caps})\n+\t\t\trequire.NoError(t, err)\n+\t\t\tassert.Equal(t, TraceQueryParams{ServiceName: \"cart\", Attributes: attributesOf(\"a\", \"1\")}, got)\n+\t\t})\n+\t}\n+\n+\tt.Run(\"what the legacy fields cannot hold\", func(t *testing.T) {\n+\t\tquery := withFilter(call(expression.OpOr, attr(\"a\", \"1\"), attr(\"b\", \"2\")))\n+\t\tgot, err := query.ForCapabilities(SearchCapabilities{})\n+\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\tassert.ErrorContains(t, err, `does not support the operator \"or\"`)\n+\t\tassert.Equal(t, query, got)\n+\t})\n+}\n+\n+func TestForCapabilities_DeclaringReaderGetsTheFilter(t *testing.T) {\n+\tcaps := SearchCapabilities{Filter: &FilterCapabilities{\n+\t\tOperators: []expression.Operator{expression.OpOr, expression.OpEq},\n+\t}}\n+\tquery := withFilter(call(expression.OpOr, attr(\"a\", \"1\"), attr(\"b\", \"2\")))\n+\tgot, err := query.ForCapabilities(caps)\n+\trequire.NoError(t, err)\n+\tassert.Equal(t, query, got)\n+\n+\tquery = withFilter(call(expression.OpAnd, attr(\"a\", \"1\"), attr(\"b\", \"2\")))\n+\tgot, err = query.ForCapabilities(caps)\n+\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\tassert.ErrorContains(t, err, `does not support the operator \"and\"`)\n+\tassert.Equal(t, query, got)\n+}\n+\n+func TestToFilterShape(t *testing.T) {\n+\tstart, end := time.Unix(100, 0), time.Unix(200, 0)\n+\ttests := []struct {\n+\t\tname     string\n+\t\tquery    TraceQueryParams\n+\t\texpected *expression.Call\n+\t}{\n+\t\t{\n+\t\t\tname:     \"no predicates\",\n+\t\t\tquery:    TraceQueryParams{Attributes: pcommon.NewMap()},\n+\t\t\texpected: nil,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"one predicate stands on its own\",\n+\t\t\tquery:    TraceQueryParams{ServiceName: \"cart\", Attributes: pcommon.NewMap()},\n+\t\t\texpected: service(\"cart\"),\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"an operation\",\n+\t\t\tquery:    TraceQueryParams{OperationName: \"GET /cart\", Attributes: pcommon.NewMap()},\n+\t\t\texpected: operation(\"GET /cart\"),\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a lower duration bound\",\n+\t\t\tquery:    TraceQueryParams{DurationMin: time.Second, Attributes: pcommon.NewMap()},\n+\t\t\texpected: bound(expression.OpGte, time.Second),\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"an upper duration bound\",\n+\t\t\tquery:    TraceQueryParams{DurationMax: time.Second, Attributes: pcommon.NewMap()},\n+\t\t\texpected: bound(expression.OpLte, time.Second),\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"an Attributes zero value\",\n+\t\t\tquery:    TraceQueryParams{ServiceName: \"cart\"},\n+\t\t\texpected: service(\"cart\"),\n+\t\t},\n+\t\t{\n+\t\t\tname: \"every field, in order\",\n+\t\t\tquery: TraceQueryParams{\n+\t\t\t\tServiceName:   \"cart\",\n+\t\t\t\tOperationName: \"GET /cart\",\n+\t\t\t\tAttributes:    attributesOf(\"http.method\", \"GET\", \"http.status_code\", \"500\"),\n+\t\t\t\tDurationMin:   time.Second,\n+\t\t\t\tDurationMax:   2 * time.Second,\n+\t\t\t},\n+\t\t\texpected: call(expression.OpAnd,\n+\t\t\t\tservice(\"cart\"),\n+\t\t\t\toperation(\"GET /cart\"),\n+\t\t\t\tattr(\"http.method\", \"GET\"),\n+\t\t\t\tattr(\"http.status_code\", \"500\"),\n+\t\t\t\tbound(expression.OpGte, time.Second),\n+\t\t\t\tbound(expression.OpLte, 2*time.Second)),\n+\t\t},\n+\t}\n+\tfor _, tt := range tests {\n+\t\tt.Run(tt.name, func(t *testing.T) {\n+\t\t\tquery := tt.query\n+\t\t\tquery.StartTimeMin, query.StartTimeMax, query.SearchDepth = start, end, 20\n+\n+\t\t\tgot := query.ToFilterShape()\n+\t\t\tassert.Equal(t, TraceQueryParams{\n+\t\t\t\tAttributes:   pcommon.NewMap(),\n+\t\t\t\tStartTimeMin: start,\n+\t\t\t\tStartTimeMax: end,\n+\t\t\t\tSearchDepth:  20,\n+\t\t\t\tFilter:       tt.expected,\n+\t\t\t}, got)\n+\t\t\tif tt.expected == nil {\n+\t\t\t\treturn\n+\t\t\t}\n+\t\t\trequire.NoError(t, expression.ValidateFilter(got.Filter))\n+\t\t\tresolved, err := expression.ResolveConstants(got.Filter)\n+\t\t\trequire.NoError(t, err)\n+\t\t\tassert.Equal(t, got.Filter, resolved, \"nothing is left to resolve\")\n+\t\t})\n+\t}\n+}\n+\n+func TestToFilterShape_AttributeOfAnotherType(t *testing.T) {\n+\tattributes := pcommon.NewMap()\n+\tattributes.PutInt(\"http.status_code\", 500)\n+\tgot := TraceQueryParams{Attributes: attributes}.ToFilterShape()\n+\tassert.Equal(t, attr(\"http.status_code\", \"500\"), got.Filter)\n+\tassert.Equal(t, 1, attributes.Len(), \"the caller's map is not cleared\")\n+}\n+\n+func TestToFilterShape_KeepsAFilter(t *testing.T) {\n+\tquery := withFilter(attr(\"a\", \"1\"))\n+\tassert.Equal(t, query, query.ToFilterShape())\n+}\n+\n+func TestToLegacyShape_WithoutFilter(t *testing.T) {\n+\tquery := TraceQueryParams{ServiceName: \"cart\", Attributes: attributesOf(\"a\", \"1\")}\n+\tgot, err := query.T rFilterInvalid\n+// and names every conflicting field.\n+func (q TraceQueryParams) EnsureFilterStandsAlone() error {\n+\tif q.Filter == nil {\n+\t\treturn nil\n+\t}\n+\tvar conflicts []string\n+\tif q.ServiceName != \"\" {\n+\t\tconflicts = append(conflicts, \"service_name\")\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tconflicts = append(conflicts, \"operation_name\")\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tconflicts = append(conflicts, \"duration_min\")\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tconflicts = append(conflicts, \"duration_max\")\n+\t}\n+\tif !isEmptyMap(q.Attributes) {\n+\t\tconflicts = append(conflicts, \"attributes\")\n+\t}\n+\tif len(conflicts) == 0 {\n+\t\treturn nil\n+\t}\n+\treturn fmt.Errorf(\"%w: the filter replaces the predicate fields %v and cannot be combined with them\",\n+\t\tErrFilterInvalid, conflicts)\n+}\n+\n+// ForCapabilities gives the Reader whichever of the two filtering models it\n+// declared it can evaluate. A Reader that declares no filter support receives\n+// the filter expressed in the legacy predicate fields (see ToLegacyShape); any\n+// other Reader receives the query as it is, provided caps covers the filter\n+// (see FilterCapabilities.EnsureSupported). A query without a filter is\n+// returned unchanged.\n+func (q TraceQueryParams) ForCapabilities(caps SearchCapabilities) (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\tif caps.Filter.IsEmpty() {\n+\t\treturn q.ToLegacyShape()\n+\t}\n+\treturn q, caps.Filter.EnsureSupported(q.Filter)\n+}\n+\n+// ToFilterShape expresses q's scalar predicate fields as filter predicates and\n+// clears them. It cannot fail, because each legacy field has an exact filter\n+// equivalent. A query that already has a Filter is returned as it is.\n+//\n+// The filter it builds is already finalized: every constant has the type the\n+// field it is compared against holds, and every reference comes first.\n+func (q TraceQueryParams) ToFilterShape() TraceQueryParams {\n+\tif q.Filter != nil {\n+\t\treturn q\n+\t}\n+\tvar predicates []*expression.Call\n+\tif q.ServiceName != \"\" {\n+\t\tpredicates = append(predicates, eq(\n+\t\t\t&expression.FieldRef{Level: expression.LevelResource, Name: expression.ResourceFieldService},\n+\t\t\t&expression.StringValue{Value: q.ServiceName}))\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tpredicates = append(predicates, eq(\n+\t\t\t&expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldName},\n+\t\t\t&expression.StringValue{Value: q.OperationName}))\n+\t}\n+\tif !isEmptyMap(q.Attributes) {\n+\t\tq.Attributes.Range(func(key string, value pcommon.Value) bool {\n+\t\t\tpredicates = append(predicates, eq(\n+\t\t\t\t&expression.AttributeRef{Key: key},\n+\t\t\t\t&expression.AnyValue{Value: value.AsString()}))\n+\t\t\treturn true\n+\t\t})\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tpredicates = append(predicates, durationBound(expression.OpGte, q.DurationMin))\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tpredicates = append(predicates, durationBound(expression.OpLte, q.DurationMax))\n+\t}\n+\n+\tout := q\n+\tout.ServiceName = \"\"\n+\tout.OperationName = \"\"\n+\tout.Attributes = pcommon.NewMap()\n+\tout.DurationMin = 0\n+\tout.DurationMax = 0\n+\tout.Filter = conjunction(predicates)\n+\treturn out\n+}\n+\n+// ToLegacyShape expresses q's Filter in the scalar predicate fields every\n+// backend serves, and clears the Filter. A query without a filter is returned\n+// unchanged. It is the inverse of ToFilterShape.\n+//\n+// Only what those fields can say exactly converts: a flat conjunction of\n+// equalities on attributes, the service and the operation name, and inclusive\n+// bounds on the duration. Anything else is refused with ErrFilterUnsupported\n+// rather than approximated. On error the original query is returned.\n+//\n+// The result has a new Attributes map, so the caller's map is never changed. A\n+// query whose filter does not stand alone is refused (see\n+// EnsureFilterStandsAlone), since converting it would overwrite the fields the\n+// caller set.\n+func (q TraceQueryParams) ToLegacyShape() (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\tif err := q.EnsureFilterStandsAlone(); err != nil {\n+\t\treturn q, err\n+\t}\n+\tconjuncts, err := conjunctsOf(q.Filter)\n+\tif err != nil {\n+\t\treturn q, err\n+\t}\n+\tout := q\n+\tout.Filter = nil\n+\tout.Attributes = pcommon.NewMap()\n+\tw := legacyWriter{query: &out, written: make(map[string]bool)}\n+\tfor _, predicate := range conjuncts {\n+\t\tif err := w.write(predicate); err != nil {\n+\t\t\treturn q, err\n+\t\t}\n+\t}\n+\treturn out, nil\n+}\n+\n+// legacyWriter writes the predicates of a conjunction into the legacy fields of\n+// query, refusing a second predicate on a field it has already written.\n+type legacyWriter struct {\n+\tquery *TraceQueryParams\n+\t// written holds the slot of every field written so far: \"attribute:<key>\",\n+\t// \"service\", \"operation\", or \"duration:<op>\" for a bound.\n+\twritten map[string]bool\n+}\n+\n+func (w legacyWriter) write(predicate *expression.Call) error {\n+\tswitch predicate.Op {\n+\tcase expression.OpOr, expression.OpNot, expression.OpExists:\n+\t\treturn errOperatorUnsupported(predicate.Op)\n+\t}\n+\tif len(predicate.Args) != 2 {\n+\t\treturn errOperatorUnsupported(predicate.Op)\n+\t}\n+\toperand := predicate.Args[1]\n+\tswitch ref := predicate.Args[0].(type) {\n+\tcase *expression.AttributeRef:\n+\t\tif ref != nil {\n+\t\t\treturn w.writeAttribute(predicate.Op, ref, operand)\n+\t\t}\n+\tcase *expression.FieldRef:\n+\t\tif ref != nil {\n+\t\t\treturn w.writeField(predicate.Op, ref, operand)\n+\t\t}\n+\t}\n+\treturn fmt.Errorf(\"%w: it compares a reference against a constant only\", ErrFilterUnsupported)\n+}\n+\n+func (w legacyWriter) writeAttribute(op expression.Operator, ref *expression.AttributeRef, operand expression.Expression) error {\n+\tswitch ref.Level {\n+\tcase \"\", expression.LevelSpan, expression.LevelResource, expression.LevelEvent:\n+\t\t// The legacy Attributes match a tag at any of these levels, so a qualified\n+\t\t// reference widens to an unqualified one.\n+\tdefault:\n+\t\treturn errLevelUnsupported(ref.Level)\n+\t}\n+\tvalue, err := equalString(op, ref.Key, operand)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif err := w.claim(\"attribute:\"+ref.Key, ref.Key); err != nil {\n+\t\treturn err\n+\t}\n+\tw.query.Attributes.PutStr(ref.Key, value)\n+\treturn nil\n+}\n+\n+func (w legacyWriter) writeField(op expression.Operator, ref *expression.FieldRef, operand expression.Expression) error {\n+\tvar target *string\n+\tvar slot string\n+\tswitch {\n+\tcase ref.Level == expression.LevelResource && ref.Name == expression.ResourceFieldService:\n+\t\ttarget, slot = &w.query.ServiceName, \"service\"\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldName:\n+\t\ttarget, slot = &w.query.OperationName, \"operation\"\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldDuration:\n+\t\treturn w.writeDurationBound(op, ref.Name, operand)\n+\tdefault:\n+\t\treturn fmt.Errorf(\"%w: it does not support the built-in field %q of the %q level\",\n+\t\t\tErrFilterUnsupported, ref.Name, ref.Level)\n+\t}\n+\tvalue, err := equalString(op, ref.Name, operand)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif err := w.claim(slot, ref.Name); err != nil {\n+\t\treturn err\n+\t}\n+\t*target = value\n+\treturn nil\n+}\n+\n+func (w legacyWriter) writeDurationBound(op expression.Operator, name string, operand expression.Expression) error {\n+\tvar target *time.Duration\n+\tswitch op {\n+\tcase expression.OpGte:\n+\t\ttarget = &w.query.DurationMin\n+\tcase expression.OpLte:\n+\t\ttarget = &w.query.DurationMax\n+\tdefault:\n+\t\treturn errOperatorOnUnsupported(op, name)\n+\t}\n+\tswitch value := operand.(type) {\n+\tcase *expression.DurationValue:\n+\t\tif value != nil {\n+\t\t\tif err := w.claim(\"duration:\"+string(op), name); err != nil {\n+\t\t\t\treturn err\n+\t\t\t}\n+\t\t\t*target = value.Value\n+\t\t\treturn nil\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif value != nil {\n+\t\t\t// expression.Finalize reads such a constant as a duration, so meeting one\n+\t\t\t// here means the filter skipped it. That is the caller's error, not a\n+\t\t\t// limit of the legacy fields.\n+\t\t\treturn fmt.Errorf(\"%w: the bound %q on %q was never read as a duration\",\n+\t\t\t\tErrFilterInvalid, value.Value, name)\n+\t\t}\n+\t}\n+\treturn fmt.Errorf(\"%w: it compares %q against a duration such as \\\"2s\\\" only\", ErrFilterUnsupported, name)\n+}\n+\n+// claim records that slot is written, refusing it if it already was: the legacy\n+// fields hold one value each, so a second predicate would silently replace the\n+// first.\n+func (w legacyWriter) claim(slot, name string) error {\n+\tif w.written[slot] {\n+\t\treturn fmt.Errorf(\"%w: it takes only one predicate on %q\", ErrFilterUnsupported, name)\n+\t}\n+\tw.written[slot] = true\n+\treturn nil\n+}\n+\n+// equalString returns the text of an equality against a string or untyped\n+// constant, which is the only comparison the legacy string fields express.\n+func equalString(op expression.Operator, name string, operand expression.Expression) (string, error) {\n+\tif op != expression.OpEq {\n+\t\treturn \"\", errOperatorOnUnsupported(op, name)\n+\t}\n+\tswitch value := operand.(type) {\n+\tcase *expression.StringValue:\n+\t\tif value != nil {\n+\t\t\treturn value.Value, nil\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif value != nil {\n+\t\t\treturn value.Value, nil\n+\t\t}\n+\t}\n+\treturn \"\", fmt.Errorf(\"%w: it compares %q against a string constant only\", ErrFilterUnsupported, name)\n+}\n+\n+// conjunctsOf flattens filter into the predicates it conjoins. A filter that is\n+// not a conjunction is a single predicate.\n+func conjunctsOf(filter *expression.Call) ([]*expression.Call, error) {\n+\tif filter.Op != expression.OpAnd {\n+\t\treturn []*expression.Call{filter}, nil\n+\t}\n+\tvar conjuncts []*expression.Call\n+\tfor _, arg := range filter.Args {\n+\t\tnested, ok := arg.(*expression.Call)\n+\t\tif !ok || nested == nil {\n+\t\t\treturn nil, fmt.Errorf(\"%w: it serves a conjunction of predicates only\", ErrFilterUnsupported)\n+\t\t}\n+\t\tflattened, err := conjunctsOf(nested)\n+\t\tif err != nil {\n+\t\t\treturn nil, err\n+\t\t}\n+\t\tconjuncts = append(conjuncts, flattened...)\n+\t}\n+\treturn conjuncts, nil\n+}\n+\n+func errOperatorOnUnsupported(op expression.Operator, name string) error {\n+\treturn fmt.Errorf(\"%w: it does not support the operator %q on %q\", ErrFilterUnsupported, op, name)\n+}\n+\n+func eq(ref, value expression.Expression) *expression.Call {\n+\treturn &expression.Call{Op: expression.OpEq, Args: []expression.Expression{ref, value}}\n+}\n+\n+func durationBound(op expression.Operator, bound time.Duration) *expression.Call {\n+\treturn &expression.Call{Op: op, Args: []expression.Expression{\n+\t\t&expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldDuration},\n+\t\t&expression.DurationValue{Value: bound},\n+\t}}\n+}\n+\n+// conjunction returns nil for no predicates, the predicate itself for one, and\n+// an OpAnd call over them for more.\n+func conjunction(predicates []*expression.Call) *expression.Call {\n+\tswitch len(predicates) {\n+\tcase 0:\n+\t\treturn nil\n+\tcase 1:\n+\t\treturn predicates[0]\n+\t}\n+\targs := make([]expression.Expression, len(predicates))\n+\tfor i, predicate := range predicates {\n+\t\targs[i] = predicate\n+\t}\n+\treturn &expression.Call{Op: expression.OpAnd, Args: args}\n+}\n+\n+// isEmptyMap reports whether m holds no entries. Unlike m.Len(), it is safe on\n+// a map left at its zero value rather than created with pcommon.NewMap().\n+func isEmptyMap(m pcommon.Map) bool {\n+\treturn m == (pcommon.Map{}) || m.Len() == 0\n+}\ndiff --git a/internal/storage/v2/api/tracestore/query_shape_test.go b/internal/storage/v2/api/tracestore/query_shape_test.go\nnew file mode 100644\nindex 0000000..eed66d4\n--- /dev/null\n+++ b/internal/storage/v2/api/tracestore/query_shape_test.go\n@@ -0,0 +1,490 @@\n+// Copyright (c) 2026 The Jaeger Authors.\n+// SPDX-License-Identifier: Apache-2.0\n+\n+package tracestore\n+\n+import (\n+\t\"testing\"\n+\t\"time\"\n+\n+\t\"github.com/jaegertracing/jaeger-idl/query/expression/v1\"\n+\t\"github.com/stretchr/testify/assert\"\n+\t\"github.com/stretchr/testify/require\"\n+\t\"go.opentelemetry.io/collector/pdata/pcommon\"\n+)\n+\n+var (\n+\tserviceField  = &expression.FieldRef{Level: expression.LevelResource, Name: expression.ResourceFieldService}\n+\tnameField     = &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldName}\n+\tdurationField = &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldDuration}\n+)\n+\n+func attr(key string) *expression.AttributeRef {\n+\treturn &expression.AttributeRef{Key: key}\n+}\n+\n+func str(v string) *expression.StringValue {\n+\treturn &expression.StringValue{Value: v}\n+}\n+\n+func anyValue(v string) *expression.AnyValue {\n+\treturn &expression.AnyValue{Value: v}\n+}\n+\n+func dur(d time.Duration) *expression.DurationValue {\n+\treturn &expression.DurationValue{Value: d}\n+}\n+\n+func attributes(kv ...string) pcommon.Map {\n+\tm := pcommon.NewMap()\n+\tfor i := 0; i < len(kv); i += 2 {\n+\t\tm.PutStr(kv[i], kv[i+1])\n+\t}\n+\treturn m\n+}\n+\n+func TestEnsureFilterStandsAlone(t *testing.T) {\n+\tfilter := call(expression.OpEq, attr(\"k\"), anyValue(\"v\"))\n+\ttests := []struct {\n+\t\tname    string\n+\t\tquery   TraceQueryParams\n+\t\twantErr string\n+\t}{\n+\t\t{name: \"no filter\", query: TraceQueryParams{ServiceName: \"svc\", Attributes: attributes(\"k\", \"v\")}},\n+\t\t{name: \"filter alone\", query: TraceQueryParams{Filter: filter, Attributes: pcommon.NewMap()}},\n+\t\t{name: \"filter with zero-value attributes\", query: TraceQueryParams{Filter: filter}},\n+\t\t{\n+\t\t\tname: \"filter with time ter: call(expression.OpEq, serviceField, str(\"svc\"))}\n+\t\tfor _, caps := range []*FilterCapabilities{nil, {}} {\n+\t\t\tgot, err := query.ForCapabilities(SearchCapabilities{Filter: caps})\n+\t\t\trequire.NoError(t, err)\n+\t\t\tassert.Equal(t, TraceQueryParams{ServiceName: \"svc\", Attributes: pcommon.NewMap()}, got)\n+\t\t}\n+\t})\n+\n+\tt.Run(\"no filter support refuses what the legacy shape cannot express\", func(t *testing.T) {\n+\t\tquery := TraceQueryParams{Filter: call(expression.OpNe, serviceField, str(\"svc\"))}\n+\t\tgot, err := query.ForCapabilities(SearchCapabilities{})\n+\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\tassert.Equal(t, query, got)\n+\t})\n+\n+\tt.Run(\"supported filter is passed through\", func(t *testing.T) {\n+\t\tquery := TraceQueryParams{Filter: call(expression.OpEq, attr(\"k\"), anyValue(\"v\"))}\n+\t\tgot, err := query.ForCapabilities(SearchCapabilities{Filter: native})\n+\t\trequire.NoError(t, err)\n+\t\tassert.Equal(t, query, got)\n+\t})\n+\n+\tt.Run(\"unsupported filter is refused\", func(t *testing.T) {\n+\t\tquery := TraceQueryParams{Filter: call(expression.OpNe, attr(\"k\"), anyValue(\"v\"))}\n+\t\tgot, err := query.ForCapabilities(SearchCapabilities{Filter: native})\n+\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\trequire.ErrorContains(t, err, `it does not support the operator \"ne\"`)\n+\t\tassert.Equal(t, query, got)\n+\t})\n+}\n+\n+func TestToFilterShape(t *testing.T) {\n+\tstart, end := time.Unix(100, 0), time.Unix(200, 0)\n+\ttests := []struct {\n+\t\tname  string\n+\t\tquery TraceQueryParams\n+\t\twant  *expression.Call\n+\t}{\n+\t\t{name: \"no predicates\", query: TraceQueryParams{Attributes: pcommon.NewMap()}},\n+\t\t{name: \"zero-value attributes\", query: TraceQueryParams{}},\n+\t\t{\n+\t\t\tname:  \"one predicate stands alone\",\n+\t\t\tquery: TraceQueryParams{ServiceName: \"svc\"},\n+\t\t\twant:  call(expression.OpEq, serviceField, str(\"svc\")),\n+\t\t},\n+\t\t{\n+\t\t\tname:  \"operation name\",\n+\t\t\tquery: TraceQueryParams{OperationName: \"op\"},\n+\t\t\twant:  call(expression.OpEq, nameField, str(\"op\")),\n+\t\t},\n+\t\t{\n+\t\t\tname:  \"duration bounds\",\n+\t\t\tquery: TraceQueryParams{DurationMin: time.Second, DurationMax: time.Minute},\n+\t\t\twant: call(expression.OpAnd,\n+\t\t\t\tcall(expression.OpGte, durationField, dur(time.Second)),\n+\t\t\t\tcall(expression.OpLte, durationField, dur(time.Minute))),\n+\t\t},\n+\t\t{\n+\t\t\tname: \"every field in order\",\n+\t\t\tquery: TraceQueryParams{\n+\t\t\t\tServiceName: \"svc\", OperationName: \"op\",\n+\t\t\t\tAttributes:  attributes(\"b\", \"2\", \"a\", \"1\"),\n+\t\t\t\tDurationMin: time.Second, DurationMax: time.Minute,\n+\t\t\t},\n+\t\t\twant: call(expression.OpAnd,\n+\t\t\t\tcall(expression.OpEq, serviceField, str(\"svc\")),\n+\t\t\t\tcall(expression.OpEq, nameField, str(\"op\")),\n+\t\t\t\tcall(expression.OpEq, attr(\"b\"), anyValue(\"2\")),\n+\t\t\t\tcall(expression.OpEq, attr(\"a\"), anyValue(\"1\")),\n+\t\t\t\tcall(expression.OpGte, durationField, dur(time.Second)),\n+\t\t\t\tcall(expression.OpLte, durationField, dur(time.Minute))),\n+\t\t},\n+\t}\n+\tfor _, tt := range tests {\n+\t\tt.Run(tt.name, func(t *testing.T) {\n+\t\t\tquery := tt.query\n+\t\t\tquery.StartTimeMin, query.StartTimeMax, query.SearchDepth = start, end, 20\n+\n+\t\t\tgot := query.ToFilterShape()\n+\n+\t\t\tassert.Equal(t, TraceQueryParams{\n+\t\t\t\tAttributes:   pcommon.NewMap(),\n+\t\t\t\tStartTimeMin: start,\n+\t\t\t\tStartTimeMax: end,\n+\t\t\t\tSearchDepth:  20,\n+\t\t\t\tFilter:       tt.want,\n+\t\t\t}, got)\n+\t\t\tif tt.want == nil {\n+\t\t\t\treturn\n+\t\t\t}\n+\t\t\trequire.NoError(t, expression.ValidateFilter(got.Filter))\n+\t\t\tresolved, err := expression.ResolveConstants(got.Filter)\n+\t\t\trequire.NoError(t, err)\n+\t\t\tassert.Equal(t, got.Filter, resolved)\n+\t\t})\n+\t}\n+}\n+\n+func TestToFilterShape_StringifiesAttributeValues(t *testing.T) {\n+\tm := pcommon.NewMap()\n+\tm.PutInt(\"http.status_code\", 200)\n+\tgot := TraceQueryParams{Attributes: m}.ToFilterShape()\n+\tassert.Equal(t, call(expression.OpEq, attr(\"http.status_code\"), anyValue(\"200\")), got.Filter)\n+}\n+\n+func TestToFilterShape_KeepsExistingFilter(t *testing.T) {\n+\tquery := TraceQueryParams{\n+\t\tServiceName: \"svc\",\n+\t\tFilter:      call(expression.OpEq, attr(\"k\"), anyValue(\"v\")),\n+\t}\n+\tassert.Equal(t, query, query.ToFilterShape())\n+}\n+\n+func TestToLegacyShape_RoundTrip(t *testing.T) {\n+\tqueries := map[string]TraceQueryParams{\n+\t\t\"service only\":   {ServiceName: \"svc\", Attributes: pcommon.NewMap()},\n+\t\t\"attribute only\": {Attributes: attributes(\"k\", \"v\")},\n+\t\t\"every field\": {\n+\t\t\tServiceName: \"svc\", OperationName: \"op\",\n+\t\t\tAttributes:  attributes(\"b\", \"2\", \"a\", \"1\"),\n+\t\t\tDurationMin: time.Second, DurationMax: time.Minute,\n+\t\t\tStartTimeMin: time.Unix(1, 0), StartTimeMax: time.Unix(2, 0), SearchDepth: 5,\n+\t\t},\n+\t}\n+\tfor name, query := range queries {\n+\t\tt.Run(name, func(t *testing.T) {\n+\t\t\tgot, err := query.ToFilterShape().ToLegacyShape()\n+\t\t\trequire.NoError(t, err)\n+\t\t\tassert.Equal(t, query, got)\n+\t\t})\n+\t}\n+}\n+\n+func TestToLegacyShape_NoFilter(t *testing.T) {\n+\tquery := TraceQueryParams{ServiceName: \"svc\"}\n+\tgot, err := query.ToLegacyShape()\n+\trequire.NoError(t, err)\n+\tassert.Equal(t, query, got)\n+}\n+\n+func TestToLegacyShape_LeavesCallerMapAlone(t *testing.T) {\n+\tcaller := pcommon.NewMap()\n+\tquery := TraceQueryParams{\n+\t\tAttributes: caller,\n+\t\tFilter:     call(expression.OpEq, attr(\"k\"), anyValue(\"v\")),\n+\t}\n+\tgot, err := query.ToLegacyShape()\n+\trequire.NoError(t, err)\n+\tassert.Equal(t, 0, caller.Len())\n+\tassert.Equal(t, attributes(\"k\", \"v\"), got.Attributes)\n+\tassert.Nil(t, got.Filter)\n+}\n+\n+func TestToLegacyShape_RefusesFilterBesideLegacyFields(t *testing.T) {\n+\tquery := TraceQueryParams{\n+\t\tServiceName: \"svc\",\n+\t\tFilter:      call(express
