tionMax != 0 {\n+\t\tconflicts = append(conflicts, \"duration_max\")\n+\t}\n+\tif attributeCount(q.Attributes) > 0 {\n+\t\tconflicts = append(conflicts, \"attributes\")\n+\t}\n+\tif len(conflicts) == 0 {\n+\t\treturn nil\n+\t}\n+\treturn fmt.Errorf(\"%w: a query with a filter cannot also set the predicate fields %v\",\n+\t\tErrFilterInvalid, conflicts)\n+}\n+\n+// ForCapabilities gives the Reader whichever of the two filtering models it\n+// declared it can evaluate.\n+//\n+// A query without a filter is returned unchanged. A Reader that declares no\n+// filter support gets the filter rewritten into the legacy predicate fields\n+// (see ToLegacyShape). Any other Reader gets the query as it is, provided it\n+// declared everything the filter uses (see FilterCapabilities.EnsureSupported).\n+func (q TraceQueryParams) ForCapabilities(caps SearchCapabilities) (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\tif caps.Filter.IsEmpty() {\n+\t\treturn q.ToLegacyShape()\n+\t}\n+\treturn q, caps.Filter.EnsureSupported(q.Filter)\n+}\n+\n+// ToFilterShape expresses q's scalar predicate fields as filter predicates.\n+//\n+// It cannot fail, because each legacy field has an exact filter equivalent. A\n+// query that already has a Filter is returned as it is. Otherwise the\n+// converted fields are cleared and every other field is kept. The Filter is\n+// nil when there is nothing to convert, a single predicate when there is one,\n+// and an OpAnd of the predicates when there are several. The constants are\n+// already typed as ResolveConstants would type them, so the result needs no\n+// further resolution.\n+func (q TraceQueryParams) ToFilterShape() TraceQueryParams {\n+\tif q.Filter != nil {\n+\t\treturn q\n+\t}\n+\tvar predicates []*expression.Call\n+\tif q.ServiceName != \"\" {\n+\t\tpredicates = append(predicates, eqCall(serviceField(), &expression.StringValue{Value: q.ServiceName}))\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tpredicates = append(predicates, eqCall(operationField(), &expression.StringValue{Value: q.OperationName}))\n+\t}\n+\tif attributeCount(q.Attributes) > 0 {\n+\t\tq.Attributes.Range(func(key string, value pcommon.Value) bool {\n+\t\t\tpredicates = append(predicates, eqCall(\n+\t\t\t\t&expression.AttributeRef{Key: key}, &expression.AnyValue{Value: value.AsString()}))\n+\t\t\treturn true\n+\t\t})\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tpredicates = append(predicates, durationBound(expression.OpGte, q.DurationMin))\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tpredicates = append(predicates, durationBound(expression.OpLte, q.DurationMax))\n+\t}\n+\n+\tq.ServiceName = \"\"\n+\tq.OperationName = \"\"\n+\tq.Attributes = pcommon.NewMap()\n+\tq.DurationMin = 0\n+\tq.DurationMax = 0\n+\tq.Filter = conjunction(predicates)\n+\treturn q\n+}\n+\n+// conjunction joins predicates, with an OpAnd only when there are several.\n+func conjunction(predicates []*expression.Call) *expression.Call {\n+\tswitch len(predicates) {\n+\tcase 0:\n+\t\treturn nil\n+\tcase 1:\n+\t\treturn predicates[0]\n+\t}\n+\targs := make([]expression.Expression, len(predicates))\n+\tfor i, predicate := range predicates {\n+\t\targs[i] = predicate\n+\t}\n+\treturn &expression.Call{Op: expression.OpAnd, Args: args}\n+}\n+\n+// ToLegacyShape expresses q's Filter in the scalar predicate fields every\n+// backend serves.\n+//\n+// A query without a filter is returned unchanged. Otherwise the result has a\n+// nil Filter and its own Attributes map, so the caller's map is not changed.\n+// Only a flat conjunction of the predicates the legacy fields can say converts;\n+// anything else is refused with ErrFilterUnsupported rather than approximated,\n+// because dropping or loosening a predicate would answer a different question.\n+// On error the original query is returned.\n+//\n+// The filter is expected to be finalized (see expression.Finalize). A\n+// duration bound that is still untyped, or a query that also sets the\n+// predicate fields the filter replaces (see EnsureFilterStandsAlone), is\n+// refused with ErrFilterInvalid.\n+func (q TraceQueryParams) ToLegacyShape() (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\tif err := q.EnsureFilterStandsAlone(); err != nil {\n+\t\treturn q, err\n+\t}\n+\tvar predicates []*expression.Call\n+\tif err := flattenConjunction(q.Filter, 1, &predicates); err != nil {\n+\t\treturn q, err\n+\t}\n+\tlegacy := q\n+\tlegacy.Filter = nil\n+\tlegacy.Attributes = pcommon.NewMap()\n+\twritten := map[legacySlot]bool{}\n+\tfor _, predicate := range predicates {\n+\t\tslot, err := legacy.writePredicate(predicate)\n+\t\tif err != nil {\n+\t\t\treturn q, err\n+\t\t}\n+\t\tif written[slot] {\n+\t\t\treturn q, unsupported(\"it accepts only one predicate on %q\", slot.name)\n+\t\t}\n+\t\twritten[slot] = true\n+\t}\n+\treturn legacy, nil\n+}\n+\n+// legacySlot names the legacy field a predicate writes, so that a second\n+// predicate on the same one is refused rather than overwriting the first.\n+type legacySlot struct {\n+\tkind string // \"attribute\", \"service\", \"operation\", \"duration_min\" or \"duration_max\"\n+\tname string // what the refusal calls it\n+}\n+\n+// flattenConjunction appends the predicates of a conjunction to out, flattening\n+// nested conjunctions, and refuses anything that is not one.\n+func flattenConjunction(call *expression.Call, depth int, out *[]*expression.Call) error {\n+\tif depth > expression.MaxNestingDepth {\n+\t\treturn fmt.Errorf(\"%w: %w\", ErrFilterInvalid, expression.ErrTooDeeplyNested)\n+\t}\n+\tif call.Op != expression.OpAnd {\n+\t\t*out = append(*out, call)\n+\t\treturn nil\n+\t}\n+\tif len(call.Args) == 0 {\n+\t\treturn unsupported(\"it does not support the operator %q without arguments\", call.Op)\n+\t}\n+\tfor _, arg := range call.Args {\n+\t\tnested, ok := arg.(*expression.Call)\n+\t\tif !ok || nested == nil {\n+\t\t\treturn unsupported(\"it serves a conjunction of predicates only\")\n+\t\t}\n+\t\tif err := flattenConjunction(nested, depth+1, out); err != nil {\n+\t\t\treturn err\n+\t\t}\n+\t}\n+\treturn nil\n+}\n+\n+// writePredicate writes one comparison into the legacy field that says the\n+// same thing, and returns the slot it wrote.\n+func (q *TraceQueryParams) writePredicate(call *expression.Call) (legacySlot, error) {\n+\tswitch call.Op {\n+\tcase expression.OpOr, expression.OpNot, expression.OpExists:\n+\t\treturn legacySlot{}, unsupported(\"it does not support the operator %q\", call.Op)\n+\t}\n+\tif len(call.Args) != 2 {\n+\t\treturn legacySlot{}, unsupported(\"it does not support the operator %q\", call.Op)\n+\t}\n+\tswitch ref := call.Args[0].(type) {\n+\tcase *expression.AttributeRef:\n+\t\tif ref != nil {\n+\t\t\treturn q.writeAttribute(call.Op, ref, call.Args[1])\n+\t\t}\n+\tcase *expression.FieldRef:\n+\t\tif ref != nil {\n+\t\t\treturn q.writeField(call.Op, ref, call.Args[1])\n+\t\t}\n+\t}\n+\treturn legacySlot{}, unsupported(\"it compares a reference against a constant only\")\n+}\n+\n+// writeAttribute writes a tag. A span-, resource- or event-level attribute\n+// widens to a plain tag, which is what the legacy Attributes field searches.\n+func (q *TraceQueryParams) writeAttribute(\n+\top expression.Operator, ref *expression.AttributeRef, operand expression.Expression,\n+) (legacySlot, error) {\n+\tswitch ref.Level {\n+\tcase \"\", expression.LevelSpan, expression.LevelResource, expression.LevelEvent:\n+\tdefault:\n+\t\treturn legacySlot{}, unsupported(\"it does not index the %q level\", ref.Level)\n+\t}\n+\tvalue, err := stringOperand(op, ref.Key, operand)\n+\tif err != nil {\n+\t\treturn legacySlot{}, err\n+\t}\n+\tq.Attributes.PutStr(ref.Key, value)\n+\treturn legacySlot{kind: \"attribute\", name: ref.Key}, nil\n+}\n+\n+// writeField writes the service, the operation name or a duration bound, the\n+// built-in fields the legacy query has a field for.\n+func (q *TraceQueryParams) writeField(\n+\top expression.Operator, ref *expression.FieldRef, operand expression.Expression,\n+) (legacySlot, error) {\n+\tswitch {\n+\tcase ref.Level == expression.LevelResource && ref.Name == expression.ResourceFieldService:\n+\t\tvalue, err := stringOperand(op, ref.Name, operand)\n+\t\tif err != nil {\n+\t\t\treturn legacySlot{}, err\n+\t\t}\n+\t\tq.ServiceName = value\n+\t\treturn legacySlot{kind: \"service\", name: ref.Name}, nil\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldName:\n+\t\tvalue, err := stringOperand(op, ref.Name, operand)\n+\t\tif err != nil {\n+\t\t\treturn legacySlot{}, err\n+\t\t}\n+\t\tq.OperationName = value\n+\t\treturn legacySlot{kind: \"operation\", name: ref.Name}, nil\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldDuration:\n+\t\treturn q.writeDuration(op, ref.Name, operand)\n+\tdefault:\n+\t\treturn legacySlot{}, unsupported(\"it does not support the built-in field %q of the %q level\", ref.Name, ref.Level)\n+\t}\n+}\n+\n+// writeDuration writes an inclusive duration bound.\n+func (q *TraceQueryParams) writeDuration(\n+\top expression.Operator, name string, operand expression.Expression,\n+) (legacySlot, error) {\n+\tif op != expression.OpGte && op != expression.OpLte {\n+\t\treturn legacySlot{}, unsupported(\"it does not support the operator %q on %q\", op, name)\n+\t}\n+\tif untyped, ok := operand.(*expression.AnyValue); ok && untyped != nil {\n+\t\treturn legacySlot{}, fmt.Errorf(\"%w: the bound %q on %q was never read as a duration\",\n+\t\t\tErrFilterInvalid, untyped.Value, name)\n+\t}\n+\tconstant, ok := operand.(*expression.DurationValue)\n+\tif !ok || constant == nil {\n+\t\treturn legacySlot{}, unsupported(\"it compares %q against a duration such as \\\"2s\\\" only\", name)\n+\t}\n+\tbound := constant.Value\n+\tif op == expression.OpGte {\n+\t\tq.DurationMin = bound\n+\t\treturn legacySlot{kind: \"duration_min\", name: name}, nil\n+\t}\n+\tq.DurationMax = bound\n+\treturn legacySlot{kind: \"duration_max\", name: name}, nil\n+}\n+\n+// stringOperand returns the text of an equality against a string or untyped\n+// constant, the only comparison the legacy string fields can say.\n+func stringOperand(op expression.Operator, name string, operand expression.Expression) (string, error) {\n+\tif op != expression.OpEq {\n+\t\treturn \"\", unsupported(\"it does not support the operator %q on %q\", op, name)\n+\t}\n+\tswitch constant := operand.(type) {\n+\tcase *expression.StringValue:\n+\t\tif constant != nil {\n+\t\t\treturn constant.Value, nil\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif constant != nil {\n+\t\t\treturn constant.Value, nil\n+\t\t}\n+\t}\n+\treturn \"\", unsupported(\"it compares %q against a string constant only\", name)\n+}\n+\n+func unsupported(format string, args ...any) error {\n+\treturn fmt.Errorf(\"%w: \"+format, append([]any{ErrFilterUnsupported}, args...)...)\n+}\n+\n+// attributeCount is Attributes.Len, also for a Map left at its zero value,\n+// whose Len would panic.\n+func attributeCount(attributes pcommon.Map) int {\n+\tif attributes == (pcommon.Map{}) {\n+\t\treturn 0\n+\t}\n+\treturn attributes.Len()\n+}\n+\n+func eqCall(ref, constant expression.Expression) *expression.Call {\n+\treturn &expression.Call{Op: expression.OpEq, Args: []expression.Expression{ref, constant}}\n+}\n+\n+func durationBound(op expression.Operator, bound time.Duration) *expression.Call {\n+\treturn &expression.Call{Op: op, Args: []expression.Expression{\n+\t\t&expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldDuration},\n+\t\t&expression.DurationValue{Value: bound},\n+\t}}\n+}\n+\n+func serviceField() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelResource, Name: expression.ResourceFieldService}\n+}\n+\n+func operationField() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldName}\n+}\ndiff --git a/internal/storage/v2/api/tracestore/query_filter_test.go b/internal/storage/v2/api/tracestore/query_filter_test.go\nnew file mode 100644\nindex 0000000..199cfd9\n--- /dev/null\n+++ b/internal/storage/v2/api/tracestore/query_filter_test.go\n@@ -0,0 +1,575 @@\n+// Copyright (c) 2026 The Jaeger Authors.\n+// SPDX-License-Identifier: Apache-2.0\n+\n+package tracestore\n+\n+import (\n+\t\"testing\"\n+\t\"time\"\n+\n+\t\"github.com/jaegertracing/jaeger-idl/query/expression/v1\"\n+\t\"github.com/stretchr/testify/assert\"\n+\t\"github.com/stretchr/testify/require\"\n+\t\"go.opentelemetry.io/collector/pdata/pcommon\"\n+)\n+\n+func call(op expression.Operator, args ...expression.Expression) *expression.Call {\n+\treturn &expression.Call{Op: op, Args: args}\n+}\n+\n+func and(args ...expression.Expression) *expression.Call {\n+\treturn call(expression.OpAnd, args...)\n+}\n+\n+func eq(ref, constant expression.Expression) *expression.Call {\n+\treturn call(expression.OpEq, ref, constant)\n+}\n+\n+func attr(key string) *expression.AttributeRef {\n+\treturn &expression.AttributeRef{Key: key}\n+}\n+\n+func str(value string) *expression.StringValue {\n+\treturn &expression.StringValue{Value: value}\n+}\n+\n+func untyped(value string) *expression.AnyValue {\n+\treturn &expression.AnyValue{Value: value}\n+}\n+\n+func duration() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldDuration}\n+}\n+\n+func spanKind() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldKind}\n+}\n+\n+func minDuration(d time.Duration) *expression.Call {\n+\treturn call(expression.OpGte, duration(), &expression.DurationValue{Value: d})\n+}\n+\n+func maxDuration(d time.Duration) *expression.Call {\n+\treturn call(expression.OpLte, duration(), &expression.DurationValue{Value: d})\n+}\n+\n+func withFilter(filter *expression.Call) TraceQueryParams {\n+\treturn TraceQueryParams{Attributes: pcommon.NewMap(), Filter: filter}\n+}\n+\n+func attributes(kv ...string) pcommon.Map {\n+\tm := pcommon.NewMap()\n+\tfor i := 0; i < len(kv); i += 2 {\n+\t\tm.PutStr(kv[i], kv[i+1])\n+\t}\n+\treturn m\n+}\n+\n+func TestEnsureFilterStandsAlone(t *testing.T) {\n+\tfilter := eq(attr(\"a\"), untyped(\"1\"))\n+\ttests := []struct {\n+\t\tname        string\n+\t\tquery       TraceQueryParams\n+\t\texpectedErr string\n+\t}{\n+\t\t{name: \"no filter\", query: TraceQueryParams{ServiceName: \"cart\", Attributes: attributes(\"a\", \"1\")}},\n+\t\t{name: \"a filter alone\", query: withFilter(filter)},\n+\t\t{name: \"a filter beside an empty map\", query: TraceQueryParams{Attributes: pcommon.NewMap(), Filter: filter}},\n+\t\t{name: \"a filter beside a zero-value map\", query: TraceQueryParams{Filter: filter}},\n+\t\t{\n+\t\t\tname:        \"service name\",\n+\t\t\tquery:       TraceQueryParams{ServiceName: \"cart\", Filter: filter},\n+\t\t\texpectedErr: \"[service_name]\",\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"operation name\",\n+\t\t\tquery:       TraceQueryParams{OperationName: \"GET\", Filter: filter},\n+\t\t\texpectedErr: \"[operation_name]\",\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"duration min\",\n+\t\t\tquery:       TraceQueryParams{DurationMin: time.Second, Filter: filter},\n+\t\t\texpectedErr: \"[duration_min]\",\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"duration max\",\n+\t\t\tquery:       TraceQueryParams{DurationMax: time.Second, Filter: filter},\n+\t\t\texpectedErr: \"[duration_max]\",\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"attributes\",\n+\t\t\tquery:       TraceQueryParams{Attributes: attributes(\"a\", \"1\"), Filter: filter},\n+\t\t\texpectedErr: \"[attributes]\",\n+\t\t},\n+\t\t{\n+\t\t\tname: \"all of them, in order\",\n+\t\t\tquery: TraceQueryParams{\n+\t\t\t\tServiceName: \"cart\", OperationName: \"GET\", DurationMin: 1, DurationMax: 2,\n+\t\t\t\tAttributes: attributes(\"a\", \"1\"), Filter: filter,\n+\t\t\t},\n+\t\t\texpectedErr: \"[service_name operation_name duration_min duration_max attributes]\",\n+\t\t},\n+\t}\n+\tfor _, test := range tests {\n+\t\tt.Run(test.name, func(t *testing.T) {\n+\t\t\terr := test.query.EnsureFilterStandsAlone()\n+\t\t\tif test.expectedErr == \"\" {\n+\t\t\t\trequire.NoError(t, err)\n+\t\t\t\treturn\n+\t\t\t}\n+\t\t\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\t\t\tassert.ErrorContains(t, err, test.expectedErr)\n+\t\t})\n+\t}\n+}\n+\n+func TestForCapabilities(t *testing.T) {\n+\tdeclared := SearchCapabilities{Filter: &FilterCapabilities{\n+\t\tOperators: []expression.Operator{expression.OpAnd, expression.OpEq},\n+\t}}\n+\n+\tt.Run(\"no filter is returned unchanged\", func(t *testing.T) {\n+\t\tquery := TraceQueryParams{ServiceName: \"cart\", Attributes: attributes(\"a\", \"1\")}\n+\t\tfor _, caps := range []SearchCapabilities{{}, declared} {\n+\t\t\tgot, err := query.ForCapabilities(caps)\n+\t\t\trequire.NoError(t, err)\n+\t\t\tassert.Equal(t, query, got)\n+\t\t}\n+\t})\n+\n+\tt.Run(\"no declaration rewrites into the legacy fields\", func(t *testing.T) {\n+\t\tquery := withFilter(and(eq(serviceField(), str(\"cart\")), eq(attr(\"a\"), untyped(\"1\"))))\n+\t\tfor name, caps := range map[string]SearchCapabilities{\n+\t\t\t\"nil\":   {},\n+\t\t\t\"empty\": {Filter: &FilterCapabilities{}},\n+\t\t} {\n+\t\t\tt.Run(name, func(t *testing.T) {\n+\t\t\t\tgot, err := query.ForCapabilities(caps)\n+\t\t\t\trequire.NoError(t, err)\n+\t\t\t\twant, err := query.ToLegacyShape()\n+\t\t\t\trequire.NoError(t, err)\n+\t\t\t\tassert.Equal(t, want, got)\n+\t\t\t\tassert.Nil(t, got.Filter)\n+\t\t\t\tassert.Equal(t, \"cart\", got.ServiceName)\n+\t\t\t})\n+\t\t}\n+\t})\n+\n+\tt.Run(\"no declaration refuses what the legacy fields cannot say\", func(t *testing.T) {\n+\t\tquery := withFilter(call(expression.OpOr, eq(attr(\"a\"), untyped(\"1\")), eq(attr(\"b\"), untyped(\"2\"))))\n+\t\tgot, err := query.ForCapabilities(SearchCapabilities{})\n+\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\tassert.Equal(t, query, got)\n+\t})\n+\n+\tt.Run(\"a declaration gets the filter as it is\", func(t *testing.T) {\n+\t\tquery := withFilter(and(eq(attr(\"a\"), untyped(\"1\")), eq(attr(\"b\"), untyped(\"2\"))))\n+\t\tgot, err := query.ForCapabilities(declared)\n+\t\trequire.NoError(t, err)\n+\t\tassert.Equal(t, query, got)\n+\t})\n+\n+\tt.Run(\"a declaration refuses what it did not name\", func(t *testing.T) {\n+\t\tquery := withFilter(call(expression.OpNe, attr(\"a\"), untyped(\"1\")))\n+\t\tgot, err := query.ForCapabilities(declared)\n+\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\trequire.ErrorContains(t, err, `it does not support the operator \"ne\"`)\n+\t\tassert.Equal(t, query, got)\n+\t})\n+}\n+\n+func TestToFilterShape(t *testing.T) {\n+\tstart := time.Unix(100, 0)\n+\tend := time.Unix(200, 0)\n+\ttests := []struct {\n+\t\tname     string\n+\t\tquery    TraceQueryParams\n+\t\texpected *expression.Call\n+\t}{\n+\t\t{name: \"nothing to convert\", query: TraceQueryParams{Attributes: pcommon.NewMap()}},\n+\t\t{name: \"a zero-value map\", query: TraceQueryParams{}},\n+\t\t{\n+\t\t\tname:     \"one predicate stands on its own\",\n+\t\t\tquery:    TraceQueryParams{ServiceName: \"cart\", Attributes: pcommon.NewMap()},\n+\t\t\texpected: eq(serviceField(), str(\"cart\")),\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"one predicate with a zero-value map\",\n+\t\t\tquery:    TraceQueryParams{DurationMax: time.Second},\n+\t\t\texpected: maxDuration(time.Second),\n+\t\t},\n+\t\t{\n+\t\t\tname: \"every field, in order\",\n+\t\t\tquery: TraceQueryParams{\n+\t\t\t\tServiceName:   \"cart\",\n+\t\t\t\tOperationName: \"GET /cart\",\n+\t\t\t\tAttributes:    attributes(\"http.method\", \"GET\", \"http.status_code\", \"500\"),\n+\t\t\t\tDurationMin:   time.Second,\n+\t\t\t\tDurationMax:   2 * time.Second,\n+\t\t\t},\n+\t\t\texpected: and(\n+\t\t\t\teq(serviceField(), str(\"cart\")),\n+\t\t\t\teq(operationField(), str(\"GET /cart\")),\n+\t\t\t\teq(attr(\"http.method\"), untyped(\"GET\")),\n+\t\t\t\teq(attr(\"http.status_code\"), untyped(\"500\")),\n+\t\t\t\tminDuration(time. ix(200, 0),\n+\t\t\tDurationMin:   time.Millisecond,\n+\t\t\tDurationMax:   time.Minute,\n+\t\t\tSearchDepth:   10,\n+\t\t},\n+\t}\n+\tfor name, query := range queries {\n+\t\tt.Run(name, func(t *testing.T) {\n+\t\t\tback, err := query.ToFilterShape().ToLegacyShape()\n+\t\t\trequire.NoError(t, err)\n+\t\t\tassert.Equal(t, query, back)\n+\t\t})\n+\t}\n+}\n+\n+func TestToLegacyShape(t *testing.T) {\n+\ttests := []struct {\n+\t\tname     string\n+\t\tfilter   *expression.Call\n+\t\texpected TraceQueryParams\n+\t}{\n+\t\t{\n+\t\t\tname:     \"an unqualified attribute against an untyped constant\",\n+\t\t\tfilter:   eq(attr(\"http.method\"), untyped(\"GET\")),\n+\t\t\texpected: TraceQueryParams{Attributes: attributes(\"http.method\", \"GET\")},\n+\t\t},\n+\t\t{\n+\t\t\tname: \"attributes at the levels that widen to a tag\",\n+\t\t\tfilter: and(\n+\t\t\t\teq(&expression.AttributeRef{Key: \"a\", Level: expression.LevelSpan}, str(\"1\")),\n+\t\t\t\teq(&expression.AttributeRef{Key: \"b\", Level: expression.LevelResource}, untyped(\"2\")),\n+\t\t\t\teq(&expression.AttributeRef{Key: \"c\", Level: expression.LevelEvent}, str(\"3\")),\n+\t\t\t),\n+\t\t\texpected: TraceQueryParams{Attributes: attributes(\"a\", \"1\", \"b\", \"2\", \"c\", \"3\")},\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"the service against an untyped constant\",\n+\t\t\tfilter:   eq(serviceField(), untyped(\"cart\")),\n+\t\t\texpected: TraceQueryParams{ServiceName: \"cart\", Attributes: pcommon.NewMap()},\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"the operation name against a string\",\n+\t\t\tfilter:   eq(operationField(), str(\"GET /cart\")),\n+\t\t\texpected: TraceQueryParams{OperationName: \"GET /cart\", Attributes: pcommon.NewMap()},\n+\t\t},\n+\t\t{\n+\t\t\tname:   \"both duration bounds\",\n+\t\t\tfilter: and(minDuration(time.Second), maxDuration(time.Minute)),\n+\t\t\texpected: TraceQueryParams{\n+\t\t\t\tDurationMin: time.Second, DurationMax: time.Minute, Attributes: pcommon.NewMap(),\n+\t\t\t},\n+\t\t},\n+\t\t{\n+\t\t\tname: \"a nested conjunction is flattened\",\n+\t\t\tfilter: and(\n+\t\t\t\teq(serviceField(), str(\"cart\")),\n+\t\t\t\tand(eq(attr(\"a\"), untyped(\"1\")), and(minDuration(time.Second))),\n+\t\t\t),\n+\t\t\texpected: TraceQueryParams{\n+\t\t\t\tServiceName: \"cart\", DurationMin: time.Second, Attributes: attributes(\"a\", \"1\"),\n+\t\t\t},\n+\t\t},\n+\t}\n+\tfor _, test := range tests {\n+\t\tt.Run(test.name, func(t *testing.T) {\n+\t\t\tgot, err := withFilter(test.filter).ToLegacyShape()\n+\t\t\trequire.NoError(t, err)\n+\t\t\tassert.Equal(t, test.expected, got)\n+\t\t})\n+\t}\n+}\n+\n+func TestToLegacyShape_NoFilterIsUnchanged(t *testing.T) {\n+\tquery := TraceQueryParams{ServiceName: \"cart\", Attributes: attributes(\"a\", \"1\"), DurationMin: time.Second}\n+\tgot, err := query.ToLegacyShape()\n+\trequire.NoError(t, err)\n+\tassert.Equal(t, query, got)\n+}\n+\n+func TestToLegacyShape_LeavesTheCallersMapAlone(t *testing.T) {\n+\tfor name, query := range map[string]TraceQueryParams{\n+\t\t\"an empty map\":      withFilter(eq(attr(\"a\"), untyped(\"1\"))),\n+\t\t\"a zero-value map\":  {Filter: eq(attr(\"a\"), untyped(\"1\"))},\n+\t\t\"a time range kept\": {Attributes: pcommon.NewMap(), StartTimeMin: time.Unix(1, 0), Filter: eq(attr(\"a\"), untyped(\"1\"))},\n+\t} {\n+\t\tt.Run(name, func(t *testing.T) {\n+\t\t\tgot, err := query.ToLegacyShape()\n+\t\t\trequire.NoError(t, err)\n+\t\t\tassert.Equal(t, attributes(\"a\", \"1\"), got.Attributes)\n+\t\t\tassert.Equal(t, query.StartTimeMin, got.StartTimeMin)\n+\t\t\tassert.Zero(t, attributeCount(query.Attributes), \"the caller's map is not written\")\n+\t\t})\n+\t}\n+}\n+\n+func TestToLegacyShape_Refuses(t *testing.T) {\n+\ta := eq(attr(\"a\"), untyped(\"1\"))\n+\ttests := []struct {\n+\t\tname        string\n+\t\tfilter      *expression.Call\n+\t\texpectedErr string\n+\t}{\n+\t\t{\n+\t\t\tname:        \"a disjunction\",\n+\t\t\tfilter:      call(expression.OpOr, a, eq(attr(\"b\"), untyped(\"2\"))),\n+\t\t\texpectedErr: `does not support the operator \"or\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"a negation nested in a conjunction\",\n+\t\t\tfilter:      and(a, call(expression.OpNot, eq(attr(\"b\"), untyped(\"2\")))),\n+\t\t\texpectedErr: `does not support the operator \"not\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"an existence check\",\n+\t\t\tfilter:      call(expression.OpExists, attr(\"a\")),\n+\t\t\texpectedErr: `does not support the operator \"exists\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"a comparison without two arguments\",\n+\t\t\tfilter:      call(expression.OpEq, attr(\"a\")),\n+\t\t\texpectedErr: `does not support the operator \"eq\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"an empty conjunction\",\n+\t\t\tfilter:      and(),\n+\t\t\texpectedErr: `does not support the operator \"and\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"a bare reference as a conjunct\",\n+\t\t\tfilter:      and(a, attr(\"b\")),\n+\t\t\texpectedErr: \"conjunction of predicates only\",\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"ne on an attribute\",\n+\t\t\tfilter:      call(expression.OpNe, attr(\"http.method\"), untyped(\"GET\")),\n+\t\t\texpectedErr: `does not support the operator \"ne\" on \"http.method\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"gt on the duration\",\n+\t\t\tfilter:      call(expression.OpGt, duration(), &expression.DurationValue{Value: time.Second}),\n+\t\t\texpectedErr: `does not support the operator \"gt\" on \"duration\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"regex on the operation name\",\n+\t\t\tfilter:      call(expression.OpRegex, operationField(), untyped(\"GET.*\")),\n+\t\t\texpectedErr: `does not support the operator \"regex\" on \"name\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"ne on the service\",\n+\t\t\tfilter:      call(expression.OpNe, serviceField(), str(\"cart\")),\n+\t\t\texpectedErr: `does not support the operator \"ne\" on \"service\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"membership on an attribute\",\n+\t\t\tfilter: call(expression.OpIn, attr(\"http.status_code\"),\n+\t\t\t\t&expression.List{Values: []string{\"500\"}, Type: expression.ValueTypeInt}),\n+\t\t\texpectedErr: `does not support the operator \"in\" on \"http.status_code\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"an attribute at the link level\",\n+\t\t\tfilter:      eq(&expression.AttributeRef{Key: \"a\", Level: expression.LevelLink}, untyped(\"1\")),\n+\t\t\texpectedErr: `does not index the \"link\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"an attribute at the scope level\",\n+\t\t\tfilter:      eq(&expression.AttributeRef{Key: \"a\", Level: expression.LevelScope}, untyped(\"1\")),\n+\t\t\texpectedErr: `does not index the \"scope\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"another built-in field\",\n+\t\t\tfilter:      eq(spanKind(), str(\"server\")),\n+\t\t\texpectedErr: `does not support the built-in field \"kind\" of the \"span\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"a field of the same name at another level\",\n+\t\t\tfilter: eq(&expression.FieldRef{Level: expression.LevelEvent, Name: expression.EventFieldName},\n+\t\t\t\tstr(\"exception\")),\n+\t\t\texpectedErr: `does not support the built-in field \"name\" of the \"event\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"an attribute against a list\",\n+\t\t\tfilter: eq(attr(\"http.method\"),\n+\t\t\t\t&expression.List{Values: []string{\"GET\"}, Type: expression.ValueTypeString}),\n+\t\t\texpectedErr: `compares \"http.method\" against a string constant only`,\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"an attribute against an integer\",\n+\t\t\tfilter:      eq(attr(\"http.status_code\"), &expression.IntValue{Value: 500}),\n+\t\t\texpectedErr: `compares \"http.status_code\" against a string constant only`,\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"the service against a boolean\",\n+\t\t\tfilter:      eq(serviceField(), &expression.BoolValue{Value: true}),\n+\t\t\texpectedErr: `compares \"service\" against a string constant only`,\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"the operation ion name twice\",\n+\t\t\tfilter:      and(eq(operationField(), str(\"a\")), and(eq(operationField(), str(\"b\")))),\n+\t\t\texpectedErr: `only one predicate on \"name\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"the lower duration bound twice\",\n+\t\t\tfilter:      and(minDuration(time.Second), minDuration(time.Minute)),\n+\t\t\texpectedErr: `only one predicate on \"duration\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:        \"the upper duration bound twice\",\n+\t\t\tfilter:      and(maxDuration(time.Second), maxDuration(time.Minute)),\n+\t\t\texpectedErr: `only one predicate on \"duration\"`,\n+\t\t},\n+\t}\n+\tfor _, test := range tests {\n+\t\tt.Run(test.name, func(t *testing.T) {\n+\t\t\tquery := withFilter(test.filter)\n+\t\t\tgot, err := query.ToLegacyShape()\n+\t\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\t\trequire.ErrorContains(t, err, test.expectedErr)\n+\t\t\tassert.Equal(t, query, got, \"the original query is returned\")\n+\t\t\tassert.Zero(t, query.Attributes.Len(), \"the caller's map is not written\")\n+\t\t})\n+\t}\n+}\n+\n+func TestToLegacyShape_RefusesAnUnresolvedDurationBound(t *testing.T) {\n+\tquery := withFilter(and(eq(attr(\"a\"), untyped(\"1\")), call(expression.OpGte, duration(), untyped(\"2s\"))))\n+\tgot, err := query.ToLegacyShape()\n+\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\trequire.ErrorContains(t, err, `the bound \"2s\" on \"duration\" was never read as a duration`)\n+\tassert.Equal(t, query, got)\n+}\n+\n+func TestToLegacyShape_RefusesAFilterBesideTheLegacyFields(t *testing.T) {\n+\tquery := withFilter(eq(serviceField(), str(\"b\")))\n+\tquery.ServiceName = \"a\"\n+\tgot, err := query.ToLegacyShape()\n+\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\trequire.ErrorContains(t, err, \"[service_name]\")\n+\tassert.Equal(t, query, got)\n+}\n+\n+func TestToLegacyShape_BoundsItsWalk(t *testing.T) {\n+\tcycle := and(eq(attr(\"a\"), untyped(\"1\")))\n+\tcycle.Args = append(cycle.Args, cycle)\n+\t_, err := withFilter(cycle).ToLegacyShape()\n+\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\trequire.ErrorIs(t, err, expression.ErrTooDeeplyNested)\n+}\n+\n+func TestToLegacyShape_ToleratesNilTerms(t *testing.T) {\n+\ttests := map[string]*expression.Call{\n+\t\t\"a nil conjunct\":      and(eq(attr(\"a\"), untyped(\"1\")), (*expression.Call)(nil)),\n+\t\t\"a nil attribute\":     eq((*expression.AttributeRef)(nil), untyped(\"1\")),\n+\t\t\"a nil field\":         eq((*expression.FieldRef)(nil), untyped(\"1\")),\n+\t\t\"a nil string\":        eq(attr(\"a\"), (*expression.StringValue)(nil)),\n+\t\t\"a nil untyped\":       eq(attr(\"a\"), (*expression.AnyValue)(nil)),\n+\t\t\"a nil duration\":      call(expression.OpGte, duration(), (*expression.DurationValue)(nil)),\n+\t\t\"a nil untyped bound\": call(expression.OpGte, duration(), (*expression.AnyValue)(nil)),\n+\t}\n+\tfor name, filter := range tests {\n+\t\tt.Run(name, func(t *testing.T) {\n+\t\t\t_, err := withFilter(filter).ToLegacyShape()\n+\t\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\t})\n+\t}\n+}\n", "cut": false, "full": true}]}]}]};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ARM = { M: "M: 最小限", MD: "M′: 最小限＋declscope", R: "R: リファクタリング", RD: "R′: リファクタリング＋declscope" };
const state = { task: 0, step: 0 };

function parseDiff(text) {
  const files = [];
  let cur = null;
  for (const line of text.split("\n")) {
    const m = /^diff --git a\/(.*?) b\/(.*)$/.exec(line);
    if (m) { cur = { path: m[2], lines: [], plus: 0, minus: 0 }; files.push(cur); continue; }
    if (!cur || /^(index |--- |\+\+\+ |new file mode|deleted file mode|similarity |rename )/.test(line)) continue;
    cur.lines.push(line);
    if (line.startsWith("+")) cur.plus++; else if (line.startsWith("-")) cur.minus++;
  }
  return files;
}

// Keep each change with `ctx` lines around it; mark the gaps with a hunk line.
function aroundChanges(lines, ctx) {
  const keep = new Array(lines.length).fill(false);
  lines.forEach((l, i) => {
    if (l.startsWith("+") || l.startsWith("-")) for (let j = Math.max(0, i - ctx); j <= Math.min(lines.length - 1, i + ctx); j++) keep[j] = true;
    if (l.startsWith("@@")) keep[i] = false;
  });
  const out = [];
  let skipped = 0;
  lines.forEach((l, i) => {
    if (l.startsWith("@@")) return;
    if (keep[i]) { if (skipped) { out.push(`@@ ${skipped} 行省略 @@`); skipped = 0; } out.push(l); } else skipped++;
  });
  if (skipped) out.push(`@@ ${skipped} 行省略 @@`);
  return out;
}

// Render lines with the line number in the new file, taken from each hunk header.
function numbered(lines) {
  let n = 0;
  return lines.map((l) => {
    const h = /^@@ -\d+(?:,\d+)? \+(\d+)/.exec(l);
    if (h) { n = +h[1] - 1; return `<div class="h"><span class="ln"></span>${esc(l)}</div>`; }
    if (l.startsWith("@@")) return `<div class="h"><span class="ln"></span>${esc(l)}</div>`;
    const cls = l.startsWith("+") ? "a" : l.startsWith("-") ? "d" : "";
    const ln = l.startsWith("-") ? "" : String(++n);
    return `<div class="${cls}"><span class="ln">${ln}</span>${esc(l) || " "}</div>`;
  }).join("");
}

function isTool(path) { return /(^|\/)\.declscope-baseline\.yaml$/.test(path) || path.startsWith(".claude/"); }

function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function render() {
  const t = DATA.tasks[state.task];
  const step = t.steps[state.step];
  const blind = $("blind").checked, pkgonly = $("pkgonly").checked;
  $("steps").innerHTML = t.steps.map((s, i) =>
    `<button type="button" data-i="${i}" aria-pressed="${i === state.step}">段 ${s.n}${s.pr ? ` · #${s.pr}` : ""}${s.stage === 2 ? " · 段階2" : ""}</button>`).join("");
  $("steptitle").innerHTML = `${esc(step.title || `段 ${step.n}`)}<span class="tag">${step.stage === 2 ? "段階2（どの群も A と同じ条件）" : "段階1（各群の条件）"}</span>`;
  let runs = step.runs.slice();
  if (blind) runs.sort((a, b) => hash(t.id + step.n + a.arm + a.rep) - hash(t.id + step.n + b.arm + b.rep));
  $("cols").innerHTML = runs.map((r, i) => column(r, i, blind, pkgonly, t.package)).join("") ||
    `<p class="empty">この段の結果はまだない。</p>`;
}

function column(r, i, blind, pkgonly, pkg) {
  const name = blind ? `コード ${i + 1}` : `${ARM[r.arm] || r.arm} · ${r.rep}回目`;
  let files = parseDiff(r.diff);
  if (!$("whole").checked) files = files.map((f) => ({ ...f, lines: aroundChanges(f.lines, 3) }));
  if (blind) {
    files = files.filter((f) => !isTool(f.path)).map((f) => {
      const lines = f.lines.filter((l) => !/^[+\- ]\s*\/\/declscope:/.test(l));
      return { ...f, lines: lines.map((l) => l.replace(/\s*\/\/declscope:\S+(?:\s\/\/.*)?$/, "")) };
    });
  }
  const inPkg = (p) => !pkg || p === pkg || p.startsWith(pkg + "/");
  const shown = pkgonly ? files.filter((f) => inPkg(f.path)) : files;
  const hidden = files.length - shown.length;
  const chips = [];
  if (r.success === true) chips.push(`<span class="chip ok">成功</span>`);
  else if (r.success === false) chips.push(`<span class="chip bad">失敗${r.failed && r.failed.length ? `（${r.failed.length}件）` : ""}</span>`);
  if (r.tokens != null) chips.push(`<span class="chip">${(r.tokens / 1000).toFixed(0)}k トークン</span>`);
  if (r.turns != null) chips.push(`<span class="chip">${r.turns} ターン</span>`);
  if (r.files != null) chips.push(`<span class="chip">${r.files} ファイル · ${r.lines} 行</span>`);
  if (!blind && r.directives) chips.push(`<span class="chip">ディレクティブ ${r.directives}</span>`);
  if (r.renamed) chips.push(`<span class="chip warn">名前合わせあり${r.no_counterpart.length ? `・対応なし ${r.no_counterpart.length}` : ""}</span>`);
  if (r.audit_ok === false) chips.push(`<span class="chip bad">監査で違反</span>`);
  const body = shown.map((f) => `
    <details class="file" open>
      <summary><span class="path">${esc(f.path)}</span><span class="n"><span class="plus">+${f.plus}</span> <span class="minus">−${f.minus}</span></span></summary>
      <div class="diff">${numbered(f.lines)}</div>
    </details>`).join("") || `<p class="empty">差分なし</p>`;
  const notes = [];
  if (hidden) notes.push(`package の外の ${hidden} ファイルを隠している。`);
  if (r.cut) notes.push("差分が長いので途中で切った。");
  return `<section class="col" aria-label="${esc(name)}">
    <div class="colhead"><div class="name">${esc(name)}</div><div class="chips">${chips.join("")}</div></div>
    ${body}${notes.length ? `<p class="note">${notes.join(" ")}</p>` : ""}
  </section>`;
}

function init() {
  if (!DATA || !DATA.tasks.length) { $("cols").innerHTML = `<p class="empty">結果はまだない。</p>`; return; }
  $("task").innerHTML = DATA.tasks.map((t, i) => `<option value="${i}">${esc(t.id)}</option>`).join("");
  $("task").addEventListener("change", (e) => { state.task = +e.target.value; state.step = 0; render(); });
  $("steps").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { state.step = +b.dataset.i; render(); } });
  $("blind").addEventListener("change", render);
  $("pkgonly").addEventListener("change", render);
  $("whole").addEventListener("change", render);
  render();
}
init();
</script>
</body>
</html>
