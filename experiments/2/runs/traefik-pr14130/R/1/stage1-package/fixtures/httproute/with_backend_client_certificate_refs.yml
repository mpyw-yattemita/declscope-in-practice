---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller
---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: unsupported-kind
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  tls:
    backend:
      clientCertificateRef:
        kind: ConfigMap
        name: ca-file
  listeners:
    - name: http
      protocol: HTTP
      port: 8001
      allowedRoutes:
        namespaces:
          from: Same
---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: unsupported-group
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  tls:
    backend:
      clientCertificateRef:
        group: example.com
        kind: Secret
        name: client-cert
  listeners:
    - name: http
      protocol: HTTP
      port: 8002
      allowedRoutes:
        namespaces:
          from: Same
---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: not-permitted
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  tls:
    backend:
      clientCertificateRef:
        namespace: bar
        name: client-cert
  listeners:
    - name: http
      protocol: HTTP
      port: 8003
      allowedRoutes:
        namespaces:
          from: Same
---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: missing-secret
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  tls:
    backend:
      clientCertificateRef:
        name: missing
  listeners:
    - name: http
      protocol: HTTP
      port: 8004
      allowedRoutes:
        namespaces:
          from: Same
---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: malformed-secret
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  tls:
    backend:
      clientCertificateRef:
        name: malformed
  listeners:
    - name: http
      protocol: HTTP
      port: 8005
      allowedRoutes:
        namespaces:
          from: Same
---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: granted
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  tls:
    backend:
      clientCertificateRef:
        group: core
        kind: Secret
        namespace: certs
        name: client-cert
  listeners:
    - name: http
      protocol: HTTP
      port: 8006
      allowedRoutes:
        namespaces:
          from: Same
---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: http-app-1
  namespace: default
spec:
  parentRefs:
    - name: unsupported-kind
      kind: Gateway
      group: gateway.networking.k8s.io
    - name: unsupported-group
      kind: Gateway
      group: gateway.networking.k8s.io
    - name: not-permitted
      kind: Gateway
      group: gateway.networking.k8s.io
    - name: missing-secret
      kind: Gateway
      group: gateway.networking.k8s.io
    - name: malformed-secret
      kind: Gateway
      group: gateway.networking.k8s.io
    - name: granted
      kind: Gateway
      group: gateway.networking.k8s.io
  hostnames:
    - foo.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /whoami
      backendRefs:
        - name: whoami
          port: 80
---
kind: BackendTLSPolicy
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: policy-1
  namespace: default
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: whoami
  validation:
    hostname: whoami
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: ca-file
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-file
  namespace: default
data:
  ca.crt: "CA1"
---
apiVersion: v1
kind: Secret
metadata:
  name: client-cert
  namespace: bar
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
apiVersion: v1
kind: Secret
metadata:
  name: client-cert
  namespace: certs
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
apiVersion: v1
kind: Secret
metadata:
  name: client-cert
  namespace: default
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
apiVersion: v1
kind: Secret
metadata:
  name: malformed
  namespace: default
type: kubernetes.io/tls
data:
  tls.crt: 
---
kind: ReferenceGrant
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: client-cert-from-gateways
  namespace: certs
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: default
  to:
    - group: ""
      kind: Secret
      name: client-cert
---
kind: ReferenceGrant
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: client-cert-from-routes
  namespace: bar
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
  to:
    - group: ""
      kind: Secret
