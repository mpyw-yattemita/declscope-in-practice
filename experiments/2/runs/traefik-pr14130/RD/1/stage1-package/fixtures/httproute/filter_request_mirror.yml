---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller

---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: Same

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: http-app-1
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  hostnames:
    - "foo.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /bar
      timeouts:
        backendRequest: 5s
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Foo
                value: Bar
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: whoami2
              port: 8080
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Bar
                value: Foo
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: whoami
              port: 8000
            percent: 25
      backendRefs:
        - name: whoami
          port: 80
          weight: 1
          kind: Service
          group: ""
          filters:
            - type: RequestMirror
              requestMirror:
                backendRef:
                  name: whoami2
                  port: 8080
                fraction:
                  numerator: 1
                  denominator: 4
