---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: route-a
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  hostnames:
    - "a.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80

---
kind: BackendTLSPolicy
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: policy-1
  namespace: default
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: whoami
  validation:
    hostname: whoami
    wellKnownCACertificates: System

---
kind: ReferenceGrant
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: granted
  namespace: granted
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: default
  to:
    - group: ""
      kind: Secret

---
apiVersion: v1
kind: Secret
metadata:
  name: client-cert
  namespace: default

data:
  tls.crt: 
  tls.key: 

---
apiVersion: v1
kind: Secret
metadata:
  name: client-cert
  namespace: granted

data:
  tls.crt: 
  tls.key: 

---
apiVersion: v1
kind: Secret
metadata:
  name: client-cert
  namespace: not-granted

data:
  tls.crt: 
  tls.key: 

---
apiVersion: v1
kind: Secret
metadata:
  name: malformed-cert
  namespace: default

data:
  tls.crt: 
