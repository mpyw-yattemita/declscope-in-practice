notes:
  - "Tool schema snapshots: the package's tests compare each tool definition with __toolsnaps__/<tool>.snap through internal/toolsnaps.Test. If a snapshot file is missing, the helper WRITES it and passes, unless GITHUB_ACTIONS=true (then it fails); if UPDATE_TOOLSNAPS=true it overwrites the snapshot. So the harness must run test_cmd with GITHUB_ACTIONS=true and without UPDATE_TOOLSNAPS, and must re-lay the given snapshots of steps 1..n over the workspace before scoring step n, so the agent cannot pass by regenerating them."
  - "GraphQL tests: internal/githubv4mock matches the exact GraphQL document text and variables that the tool sends (for example query($after:String$first:Int!$owner:String!$repo:String!){repository(...){discussions(...){nodes{number,title,...}}}}). This is the request sent to GitHub's API, so the task texts state the exact documents. The Go query structs that produce them are the agent's choice."
  - "README.md is generated from the tool definitions by `go run ./cmd/github-mcp-server generate-docs` (marker blocks START/END AUTOMATED TOOLS). Every step changes it; it is not tested."
