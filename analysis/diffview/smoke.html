che-2.0\n+\n+package tracestore\n+\n+import (\n+\t\"testing\"\n+\n+\t\"github.com/jaegertracing/jaeger-idl/query/expression/v1\"\n+\t\"github.com/stretchr/testify/assert\"\n+)\n+\n+func TestFilterCapabilities_IsEmpty(t *testing.T) {\n+\ttests := []struct {\n+\t\tname string\n+\t\tcaps *FilterCapabilities\n+\t\twant bool\n+\t}{\n+\t\t{name: \"nil\", caps: nil, want: true},\n+\t\t{name: \"zero value\", caps: &FilterCapabilities{}, want: true},\n+\t\t{\n+\t\t\tname: \"empty non-nil slices\",\n+\t\t\tcaps: &FilterCapabilities{Levels: []expression.Level{}, Operators: []expression.Operator{}},\n+\t\t\twant: true,\n+\t\t},\n+\t\t{name: \"one level\", caps: &FilterCapabilities{Levels: []expression.Level{expression.LevelSpan}}, want: false},\n+\t\t{name: \"one operator\", caps: &FilterCapabilities{Operators: []expression.Operator{expression.OpEq}}, want: false},\n+\t}\n+\tfor _, tt := range tests {\n+\t\tt.Run(tt.name, func(t *testing.T) {\n+\t\t\tassert.Equal(t, tt.want, tt.caps.IsEmpty())\n+\t\t})\n+\t}\n+}\n+\n+func TestFilterCapabilities_SupportsLevel(t *testing.T) {\n+\tcaps := FilterCapabilities{Levels: []expression.Level{expression.LevelSpan, expression.LevelResource}}\n+\tassert.True(t, caps.SupportsLevel(\"\"), \"an unqualified reference is always supported\")\n+\tassert.True(t, caps.SupportsLevel(expression.LevelSpan))\n+\tassert.True(t, caps.SupportsLevel(expression.LevelResource))\n+\tassert.False(t, caps.SupportsLevel(expression.LevelEvent))\n+\n+\tvar zero FilterCapabilities\n+\tassert.True(t, zero.SupportsLevel(\"\"), \"an unqualified reference is always supported\")\n+\tassert.False(t, zero.SupportsLevel(expression.LevelSpan))\n+}\n+\n+func TestFilterCapabilities_SupportsOperator(t *testing.T) {\n+\tconjunctive := FilterCapabilities{Operators: []expression.Operator{expression.OpAnd, expression.OpEq}}\n+\tassert.True(t, conjunctive.SupportsOperator(expression.OpAnd))\n+\tassert.True(t, conjunctive.SupportsOperator(expression.OpEq))\n+\tassert.False(t, conjunct ns returns all operation names for a given service\n \t// known to the backend from spans within its retention period.\n \tGetOperations(ctx context.Context, query OperationQueryParams) ([]Operation, error)\n \n \t// FindTraces returns an iterator that retrieves traces matching query parameters.\n \t// The iterator is single-use: once consumed, it cannot be used again.\n \t//\n \t// The chunking rules is the same as for GetTraces.\n \t//\n \t// If no matching traces are found, the function returns an empty iterator.\n \t// If an error is encountered, the iterator returns the error and stops.\n \t//\n \t// There's currently an implementation-dependent ambiguity whether all query filters\n \t// (such as multiple tags) must apply to the same span within a trace, or can be satisfied\n \t// by different spans.\n \tFindTraces(ctx context.Context, query TraceQueryParams) iter.Seq2[[]ptrace.Traces, error]\n \n \t// FindTraceIDs returns an iterator that retrieves IDs of traces matching query parameters.\n \t// The iterator is single-use: once consumed, it cannot be used again.\n \t//\n \t// If no matching traces are found, the function returns an empty iterator.\n \t// If an error is encountered, the iterator returns the error and stops.\n \t//\n \t// This function behaves identically to FindTraces, except that it returns only the list\n \t// of matching trace IDs. This is useful in some contexts, such as batch jobs, where a\n \t// large list of trace IDs may be queried first and then the full traces are loaded\n \t// in batches.\n \tFindTraceIDs(ctx context.Context, query TraceQueryParams) iter.Seq2[[]FoundTraceID, error]\n \n \t// FindTraceSummaries returns an iterator over lightweight summaries of the traces\n \t// matching the query parameters (the metadata shown in search-result lists). The\n \t// iterator is single-use: once consumed, it cannot be used again.\n \t//\n \t// Backends that can compute summaries natively (e.g. via a storage-side aggregation)\n \t// should do so. Backends that cannot must yield errors.ErrUnsupported (wrapped with\n \t// %w) as the first error, before any batch; the caller then falls back to FindTraces\n \t// plus client-side aggregation. Such backends can embed UnsupportedTraceSummaries to\n \t// get this behavior for free.\n \t//\n \t// The iterator streams result batches; each yielded batch may contain one or more\n \t// summaries, and implementations may yield incrementally rather than buffering all\n \t// results first.\n \tFindTraceSummaries(ctx context.Context, query TraceQueryParams) iter.Seq2[[]TraceSummary, error]\n \n \t// SearchCapabilities reports how this reader's search methods behave.\n \t//\n \t// A Reader that cannot find out, for example because its backend sits behind\n \t// an API that cannot be asked, returns an error that wraps errors.ErrUnsupported\n \t// instead of a value that a caller might trust. The context is there because\n \t// the answer may come over the network.\n \t//\n \t// A Reader that wraps another Reader (a decorator) must forward this call to\n \t// the wrapped Reader, so that wrapping does not change the declaration.\n \tSearchCapabilities(ctx context.Context) (SearchCapabilities, error)\n }\n \n // GetTraceParams contains single-trace parameters for a GetTraces request.\n // Some storage backends (e.g. Tempo) perform GetTraces much more efficiently\n // if they know the approximate time range of the trace.\n type GetTraceParams struct {\n \t// TraceID is the ID of the trace to retrieve. Required.\n \tTraceID pcommon.TraceID\n \t// Start of the time interval to search for trace ID. Optional.\n \tStart time.Time\n \t// End of the time interval to search for trace ID. Optional.\n \tEnd time.Time\n }\n \n // TraceQueryParams contains query parameters to find traces. For a detailed\n // definition of each field in this message, refer to `TraceQueryParameters` in `jaeger.api_v3`\n // (https://github.com/jaegertracing/jaeger-idl/blob/main/proto/api_v3/query_service.proto).\n type TraceQueryParams struct {\n \tServiceName   string\n \tOperationName string\n \t// Attributes must initialized with pcommon.NewMap() before use.\n \tAttributes   pcommon.Map\n \tStartTimeMin time.Time\n \tStartTimeMax time.Time\n \tDurationMin  time.Duration\n \tDurationMax  time.Duration\n \tSearchDepth  int\n+\n+\t// Filter is the structured query filter. It is mutually exclusive with the\n+\t// predicate fields ServiceName, OperationName, Attributes and the duration\n+\t// bounds, so a reader sees one filtering model, not a mix of the two.\n+\tFilter *expression.Call\n }\n \n // FoundTraceID is a wrapper around trace ID returned from FindTraceIDs\n // with an optional time range that may be used in GetTraces calls.\n //\n // The time range is provided as an optimization hint for some storage backends\n // that can perform more efficient queries when they know the approximate time range.\n // The value should not be used for precise time-based filtering or assumptions.\n // It is meant as a rough boundary and may not be populated in all cases.\n type FoundTraceID struct {\n \tTraceID pcommon.TraceID\n \tStart   time.Time\n \tEnd     time.Time\n }\n \n // OperationQueryParams contains parameters of query operations, empty spanKind means get operations for all kinds of span.\n type OperationQueryParams struct {\n \tServiceName string\n \tSpanKind    string\n }\n \n // Operation contains operation name and span kind\n type Operation struct {\n \tName     string\n \tSpanKind string\n }\ndiff --git a/internal/storage/v2/api/tracestore/search_capabilities.go b/internal/storage/v2/api/tracestore/search_capabilities.go\nindex 609b77a..e224e46 100644\n--- a/internal/storage/v2/api/tracestore/search_capabilities.go\n+++ b/internal/storage/v2/api/tracestore/search_capabilities.go\n@@ -1,18 +1,30 @@\n // Copyright (c) 2026 The Jaeger Authors.\n // SPDX-License-Identifier: Apache-2.0\n \n package tracestore\n \n // SearchCapabilities describes how a Reader's search methods behave where\n // backends differ. Reader.SearchCapabilities returns it.\n //\n-// The zero value is the least capable reader: every field is false, and a\n-// field that is false means the reader does not declare that behaviour. A new\n-// capability is added as a new field, so every existing implementation\n-// declares it as false until it opts in.\n+// The zero value is the least capable reader: every field is false or nil, and\n+// a field that is false or nil means the reader does not declare that\n+// behaviour. A new capability is added as a new field, so every existing\n+// implementation declares nothing for it until it opts in.\n type SearchCapabilities struct {\n \t// WithoutServiceName is true when FindTraces, FindTraceIDs and\n \t// FindTraceSummaries accept a TraceQueryParams whose ServiceName is empty\n \t// and read it as \"any service\", rather than as an error or an empty result.\n \tWithoutServiceName bool\n+\n+\t// SameSpanConjunction is true when a conjunction (several entries in the\n+\t// Attributes map, or an OpAnd in Filter) is satisfied within a single span.\n+\t// False means the backend may satisfy different conjuncts from different\n+\t// spans of the same trace, as a flat inverted index does. Callers report\n+\t// this looser scoping rather than refusing the query.\n+\tSameSpanConjunction bool\n+\n+\t// Filter is how much of TraceQueryParams.Filter the reader evaluates. A nil\n+\t// Filter means none of it: the reader serves only the legacy fields.\n+\t// Callers ask Filter.IsEmpty rather than comparing against nil.\n+\tFilter *FilterCapabilities\n }\ndiff --git a/internal/storage/v2/api/tracestore/search_capabilities_test.go b/internal/storage/v2/api/tracestore/search_capabilities_test.go\nindex fd7a68d..d34a924 100644\n--- a/internal/storage/v2/api/tracestore/search_capabilities_test.go\n+++ b/internal/storage/v2/api/tracestore/search_capabilities_test.go\n@@ -1,27 +1,29 @@\n // Copyright (c) 2026 The Jaeger Authors.\n // SPDX-License-Identifier: Apache-2.0\n \n package tracestore\n \n import (\n \t\"reflect\"\n \t\"testing\"\n \n \t\"github.com/stretchr/testify/assert\"\n )\n \n func TestSearchCapabilities_ZeroValueDeclaresNothing(t *testing.T) {\n \tassert.False(t, SearchCapabilities{}.WithoutServiceName)\n+\tassert.False(t, SearchCapabilities{}.SameSpanConjunction)\n+\tassert.True(t, SearchCapabilities{}.Filter.IsEmpty())\n }\n \n // TestSearchCapabilities_FieldCount fails when a field is added to\n // SearchCapabilities. When it fails, extend the forwarding tests of the\n // decorators, which enumerate every field:\n //   - tracestoremetrics: TestReadMetricsDecorator_SearchCapabilities\n //   - queryinterceptor: TestReader_SearchCapabilities_ForwardsBackendDeclaration\n //\n // Then update the count below.\n func TestSearchCapabilities_FieldCount(t *testing.T) {\n-\tassert.Equal(t, 1, reflect.TypeFor[SearchCapabilities]().NumField(),\n+\tassert.Equal(t, 3, reflect.TypeFor[SearchCapabilities]().NumField(),\n \t\t\"a field was added to SearchCapabilities: extend the decorators' forwarding tests, then update this count\")\n }\n", "cut": false, "full": true}]}, {"n": 3, "pr": 9357, "title": "feat(query): Serve a filter query in the shape the backend understands", "stage": 2, "runs": [{"arm": "A", "rep": "1", "stage": 2, "setup": "A", "success": true, "failed": [], "no_counterpart": [], "renamed": false, "tokens": 849237, "turns": 16, "files": 2, "lines": 787, "directives": 0, "audit_ok": true, "diff": "diff --git a/internal/storage/v2/api/tracestore/filter.go b/internal/storage/v2/api/tracestore/filter.go\nnew file mode 100644\nindex 0000000..a4f500f\n--- /dev/null\n+++ b/internal/storage/v2/api/tracestore/filter.go\n@@ -0,0 +1,393 @@\n+// Copyright (c) 2026 The Jaeger Authors.\n+// SPDX-License-Identifier: Apache-2.0\n+\n+package tracestore\n+\n+import (\n+\t\"fmt\"\n+\t\"time\"\n+\n+\texpression \"github.com/jaegertracing/jaeger-idl/query/expression/v1\"\n+\t\"go.opentelemetry.io/collector/pdata/pcommon\"\n+)\n+\n+// EnsureFilterStandsAlone rejects a query that carries both a filter and one\n+// of the predicate fields the filter replaces. The two filtering models are\n+// mutually exclusive, so a reader never sees a mix of them.\n+func (q TraceQueryParams) EnsureFilterStandsAlone() error {\n+\tif q.Filter == nil {\n+\t\treturn nil\n+\t}\n+\tvar conflicts []string\n+\tif q.ServiceName != \"\" {\n+\t\tconflicts = append(conflicts, \"service_name\")\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tconflicts = append(conflicts, \"operation_name\")\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tconflicts = append(conflicts, \"duration_min\")\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tconflicts = append(conflicts, \"duration_max\")\n+\t}\n+\tif attributeCount(q.Attributes) > 0 {\n+\t\tconflicts = append(conflicts, \"attributes\")\n+\t}\n+\tif len(conflicts) == 0 {\n+\t\treturn nil\n+\t}\n+\treturn fmt.Errorf(\"%w: a filter replaces the predicate fields %v, so it cannot be combined with them\",\n+\t\tErrFilterInvalid, conflicts)\n+}\n+\n+// ForCapabilities gives the Reader whichever of the two filtering models it\n+// declared it can evaluate: the filter itself when the Reader declared filter\n+// support, and otherwise the filter expressed in the legacy predicate fields.\n+// A filter that neither model can serve is refused.\n+func (q TraceQueryParams) ForCapabilities(caps SearchCapabilities) (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\tif caps.Filter.IsEmpty() {\n+\t\treturn q.ToLegacyShape()\n+\t}\n+\treturn q, caps.Filter.EnsureSupported(q.Filter)\n+}\n+\n+// EnsureSupported walks the filter and refuses the first predicate the Reader\n+// did not declare it can evaluate: an operator it did not list, or a reference\n+// to a level it does not index. Constants need no support.\n+func (c FilterCapabilities) EnsureSupported(filter *expression.Call) error {\n+\tif filter == nil {\n+\t\treturn nil\n+\t}\n+\treturn c.ensureCallSupported(filter, 1)\n+}\n+\n+func (c FilterCapabilities) ensureCallSupported(call *expression.Call, depth int) error {\n+\tif depth > expression.MaxNestingDepth {\n+\t\treturn fmt.Errorf(\"%w: %w\", ErrFilterInvalid, expression.ErrTooDeeplyNested)\n+\t}\n+\tif !c.SupportsOperator(call.Op) {\n+\t\treturn errUnsupportedOperator(call.Op)\n+\t}\n+\tfor _, arg := range call.Args {\n+\t\tvar err error\n+\t\tswitch term := arg.(type) {\n+\t\tcase *expression.Call:\n+\t\t\tif term != nil {\n+\t\t\t\terr = c.ensureCallSupported(term, depth+1)\n+\t\t\t}\n+\t\tcase *expression.AttributeRef:\n+\t\t\tif term != nil {\n+\t\t\t\terr = c.ensureLevelSupported(term.Level)\n+\t\t\t}\n+\t\tcase *expression.FieldRef:\n+\t\t\tif term != nil {\n+\t\t\t\terr = c.ensureLevelSupported(term.Level)\n+\t\t\t}\n+\t\tcase *expression.NestedRef:\n+\t\t\tif term != nil {\n+\t\t\t\terr = c.ensureLevelSupported(term.Level)\n+\t\t\t}\n+\t\t}\n+\t\tif err != nil {\n+\t\t\treturn err\n+\t\t}\n+\t}\n+\treturn nil\n+}\n+\n+func (c FilterCapabilities) ensureLevelSupported(level expression.Level) error {\n+\tif c.SupportsLevel(level) {\n+\t\treturn nil\n+\t}\n+\treturn errUnindexedLevel(level)\n+}\n+\n+// ToFilterShape expresses q's scalar predicate fields as filter predicates.\n+// It cannot fail, because each legacy field has an exact filter equivalent. A\n+// query that already has a Filter is returned as it is.\n+//\n+// The predicates come in the order service, operation, attributes, minimum\n+// duration, maximum duration, and are already resolved: the result passes\n+// expression.ValidateFilter, and expression.ResolveConstants leaves it as it is.\n+func (q TraceQueryParams) ToFilterShape() TraceQueryParams {\n+\tif q.Filter != nil {\n+\t\treturn q\n+\t}\n+\tvar predicates []*expression.Call\n+\tif q.ServiceName != \"\" {\n+\t\tpredicates = append(predicates, equals(\n+\t\t\t&expression.FieldRef{Level: expression.LevelResource, Name: expression.ResourceFieldService},\n+\t\t\t&expression.StringValue{Value: q.ServiceName}))\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tpredicates = append(predicates, equals(\n+\t\t\t&expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldName},\n+\t\t\t&expression.StringValue{Value: q.OperationName}))\n+\t}\n+\tif attributeCount(q.Attributes) > 0 {\n+\t\tfor key, value := range q.Attributes.All() {\n+\t\t\t// A tag declares no type, so its value stays untyped: a backend matches\n+\t\t\t// it at whatever type the attribute was stored.\n+\t\t\tpredicates = append(predicates, equals(\n+\t\t\t\t&expression.AttributeRef{Key: key},\n+\t\t\t\t&expression.AnyValue{Value: value.AsString()}))\n+\t\t}\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tpredicates = append(predicates, durationBound(expression.OpGte, q.DurationMin))\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tpredicates = append(predicates, durationBound(expression.OpLte, q.DurationMax))\n+\t}\n+\n+\tresult := q\n+\tresult.ServiceName = \"\"\n+\tresult.OperationName = \"\"\n+\tresult.Attributes = pcommon.NewMap()\n+\tresult.DurationMin = 0\n+\tresult.DurationMax = 0\n+\tswitch len(predicates) {\n+\tcase 0:\n+\t\tresult.Filter = nil\n+\tcase 1:\n+\t\tresult.Filter = predicates[0]\n+\tdefault:\n+\t\targs := make([]expression.Expression, len(predicates))\n+\t\tfor i, predicate := range predicates {\n+\t\t\targs[i] = predicate\n+\t\t}\n+\t\tresult.Filter = &expression.Call{Op: expression.OpAnd, Args: args}\n+\t}\n+\treturn result\n+}\n+\n+func equals(ref, constant expression.Expression) *expression.Call {\n+\treturn &expression.Call{Op: expression.OpEq, Args: []expression.Expression{ref, constant}}\n+}\n+\n+func durationBound(op expression.Operator, d time.Duration) *expression.Call {\n+\treturn &expression.Call{Op: op, Args: []expression.Expression{\n+\t\t&expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldDuration},\n+\t\t&expression.DurationValue{Value: d},\n+\t}}\n+}\n+\n+// ToLegacyShape expresses q's Filter in the scalar predicate fields every\n+// backend serves. Only a flat conjunction of the predicates those fields can\n+// hold converts; anything else is refused rather than approximated.\n+//\n+// The result has a nil Filter and a new Attributes map, so the caller's map\n+// is not changed. On error the original query is returned.\n+func (q TraceQueryParams) ToLegacyShape() (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\tconjuncts, err := flattenConjunction(q.Filter, 1)\n+\tif err != nil {\n+\t\treturn q, err\n+\t}\n+\tresult := q\n+\tresult.Filter = nil\n+\tresult.Attributes = pcommon.NewMap()\n+\tif attributeCount(q.Attributes) > 0 {\n+\t\tq.Attributes.CopyTo(result.Attributes)\n+\t}\n+\tl := legacyBuilder{query: &result, attributes: make(map[string]bool)}\n+\tfor _, conjunct := range conjuncts {\n+\t\tif err := l.add(conjunct); err != nil {\n+\t\t\treturn q, err\n+\t\t}\n+\t}\n+\treturn result, nil\n+}\n+\n+// flattenConjunction returns the conjuncts of a filter, reading nested\n+// conjunctions as one, since and is associative. A filter that is not a\n+// conjunction is a conjunction of itself.\n+func flattenConjunction(filter expression.Expression, depth int) ([]expression.Expression, error) {\n+\tcall, ok := filter.(*expression.Call)\n+\tif !ok || call == nil || call.Op != expression.OpAnd {\n+\t\treturn []expression.Expression{filter}, nil\n+\t}\n+\tif depth > expression.MaxNestingDepth {\n+\t\treturn nil, fmt.Errorf(\"%w: %w\", ErrFilterInvalid, expression.ErrTooDeeplyNested)\n+\t}\n+\tvar conjuncts []expression.Expression\n+\tfor _, arg := range call.Args {\n+\t\tnested, err := flattenConjunction(arg, depth+1)\n+\t\tif err != nil {\n+\t\t\treturn nil, err\n+\t\t}\n+\t\tconjuncts = append(conjuncts, nested...)\n+\t}\n+\treturn conjuncts, nil\n+}\n+\n+// legacyBuilder writes the conjuncts of a filter into the legacy fields of a\n+// query, refusing a second predicate on a field that holds a single value.\n+type legacyBuilder struct {\n+\tquery       *TraceQueryParams\n+\tservice     bool\n+\toperation   bool\n+\tdurationMin bool\n+\tdurationMax bool\n+\tattributes  map[string]bool\n+}\n+\n+func (l *legacyBuilder) add(conjunct expression.Expression) error {\n+\tcall, ok := conjunct.(*expression.Call)\n+\tif !ok || call == nil {\n+\t\treturn fmt.Errorf(\"%w: it serves a conjunction of predicates only\", ErrFilterUnsupported)\n+\t}\n+\tswitch call.Op {\n+\tcase expression.OpOr, expression.OpNot, expression.OpExists:\n+\t\treturn errUnsupportedOperator(call.Op)\n+\t}\n+\tif len(call.Args) != 2 {\n+\t\treturn errUnsupportedOperator(call.Op)\n+\t}\n+\tswitch ref := call.Args[0].(type) {\n+\tcase *expression.AttributeRef:\n+\t\tif ref != nil {\n+\t\t\treturn l.addAttribute(call.Op, ref, call.Args[1])\n+\t\t}\n+\tcase *expression.FieldRef:\n+\t\tif ref != nil {\n+\t\t\treturn l.addField(call.Op, ref, call.Args[1])\n+\t\t}\n+\t}\n+\treturn fmt.Errorf(\"%w: it compares a reference against a constant only\", ErrFilterUnsupported)\n+}\n+\n+func (l *legacyBuilder) addAttribute(op expression.Operator, ref *expression.AttributeRef, operand expression.Expression) error {\n+\tswitch ref.Level {\n+\tcase \"\", expression.LevelSpan, expression.LevelResource, expression.LevelEvent:\n+\t\t// A plain tag matches any of these levels, so a qualified one widens to it.\n+\tdefault:\n+\t\treturn errUnindexedLevel(ref.Level)\n+\t}\n+\tvalue, err := stringOperand(op, ref.Key, operand)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif l.attributes[ref.Key] {\n+\t\treturn errDuplicatePredicate(ref.Key)\n+\t}\n+\tl.attributes[ref.Key] = true\n+\tl.query.Attributes.PutStr(ref.Key, value)\n+\treturn nil\n+}\n+\n+func (l *legacyBuilder) addField(op expression.Operator, ref *expression.FieldRef, operand expression.Expression) error {\n+\tswitch {\n+\tcase ref.Level == expression.LevelResource && ref.Name == expression.ResourceFieldService:\n+\t\treturn setOnce(&l.service, &l.query.ServiceName, op, ref.Name, operand)\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldName:\n+\t\treturn setOnce(&l.operation, &l.query.OperationName, op, ref.Name, operand)\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldDuration:\n+\t\treturn l.addDurationBound(op, ref.Name, operand)\n+\tdefault:\n+\t\treturn fmt.Errorf(\"%w: it does not support the built-in field %q of the %q level\",\n+\t\t\tErrFilterUnsupported, ref.Name, ref.Level)\n+\t}\n+}\n+\n+func setOnce(seen *bool, field *string, op expression.Operator, name string, operand expression.Expression) error {\n+\tvalue, err := stringOperand(op, name, operand)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif *seen {\n+\t\treturn errDuplicatePredicate(name)\n+\t}\n+\t*seen = true\n+\t*field = value\n+\treturn nil\n+}\n+\n+func (l *legacyBuilder) addDurationBound(op expression.Operator, name string, operand expression.Expression) error {\n+\tvar seen *bool\n+\tvar bound *time.Duration\n+\tswitch op {\n+\tcase expression.OpGte:\n+\t\tseen, bound = &l.durationMin, &l.query.DurationMin\n+\tcase expression.OpLte:\n+\t\tseen, bound = &l.durationMax, &l.query.DurationMax\n+\tdefault:\n+\t\treturn errUnsupportedComparison(op, name)\n+\t}\n+\tvar value time.Duration\n+\tok := false\n+\tswitch constant := operand.(type) {\n+\tcase *expression.DurationValue:\n+\t\tif constant != nil {\n+\t\t\tvalue, ok = constant.Value, true\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif constant != nil {\n+\t\t\treturn fmt.Errorf(\"%w: the bound %q on %q was never read as a duration; finalize the filter first\",\n+\t\t\t\tErrFilterInvalid, constant.Value, name)\n+\t\t}\n+\t}\n+\tif !ok {\n+\t\treturn errNotADuration(name)\n+\t}\n+\tif *seen {\n+\t\treturn errDuplicatePredicate(name)\n+\t}\n+\t*seen = true\n+\t*bound = value\n+\treturn nil\n+}\n+\n+// stringOperand returns the text of the constant an equality compares a tag,\n+// the service or the operation name against.\n+func stringOperand(op expression.Operator, name string, operand expression.Expression) (string, error) {\n+\tif op != expression.OpEq {\n+\t\treturn \"\", errUnsupportedComparison(op, name)\n+\t}\n+\tswitch constant := operand.(type) {\n+\tcase *expression.StringValue:\n+\t\tif constant != nil {\n+\t\t\treturn constant.Value, nil\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif constant != nil {\n+\t\t\treturn constant.Value, nil\n+\t\t}\n+\t}\n+\treturn \"\", fmt.Errorf(\"%w: it compares %q against a string constant only\", ErrFilterUnsupported, name)\n+}\n+\n+// attributeCount is the number of entries in m, which is zero for a Map left\n+// at its zero value rather than created with pcommon.NewMap.\n+func attributeCount(m pcommon.Map) int {\n+\tif m == (pcommon.Map{}) {\n+\t\treturn 0\n+\t}\n+\treturn m.Len()\n+}\n+\n+func errUnsupportedOperator(op expression.Operator) error {\n+\treturn fmt.Errorf(\"%w: it does not support the operator %q\", ErrFilterUnsupported, op)\n+}\n+\n+func errUnsupportedComparison(op expression.Operator, name string) error {\n+\treturn fmt.Errorf(\"%w: it does not support the operator %q on %q\", ErrFilterUnsupported, op, name)\n+}\n+\n+func errUnindexedLevel(level expression.Level) error {\n+\treturn fmt.Errorf(\"%w: it does not index the %q level\", ErrFilterUnsupported, level)\n+}\n+\n+func errNotADuration(name string) error {\n+\treturn fmt.Errorf(\"%w: it compares %q against a duration such as \\\"2s\\\" only\", ErrFilterUnsupported, name)\n+}\n+\n+func errDuplicatePredicate(name string) error {\n+\treturn fmt.Errorf(\"%w: it accepts only one predicate on %q\", ErrFilterUnsupported, name)\n+}\ndiff --git a/internal/storage/v2/api/tracestore/filter_test.go b/internal/storage/v2/api/tracestore/filter_test.go\nnew file mode 100644\nindex 0000000..f69f08b\n--- /dev/null\n+++ b/internal/storage/v2/api/tracestore/filter_test.go\n@@ -0,0 +1,394 @@\n+// Copyright (c) 2026 The Jaeger Authors.\n+// SPDX-License-Identifier: Apache-2.0\n+\n+package tracestore\n+\n+import (\n+\t\"testing\"\n+\t\"time\"\n+\n+\t\"github.com/stret +\t\t{\"service name\", func() TraceQueryParams {\n+\t\t\tq := filterQuery(filter)\n+\t\t\tq.ServiceName = \"cart\"\n+\t\t\treturn q\n+\t\t}, \"[service_name]\"},\n+\t\t{\"every field\", func() TraceQueryParams {\n+\t\t\tq := filterQuery(filter)\n+\t\t\tq.ServiceName = \"cart\"\n+\t\t\tq.OperationName = \"GET\"\n+\t\t\tq.DurationMin = time.Second\n+\t\t\tq.DurationMax = time.Minute\n+\t\t\tq.Attributes.PutStr(\"a\", \"1\")\n+\t\t\treturn q\n+\t\t}, \"[service_name operation_name duration_min duration_max attributes]\"},\n+\t}\n+\tfor _, test := range tests {\n+\t\tt.Run(test.name, func(t *testing.T) {\n+\t\t\terr := test.query().EnsureFilterStandsAlone()\n+\t\t\tif test.expected == \"\" {\n+\t\t\t\trequire.NoError(t, err)\n+\t\t\t\treturn\n+\t\t\t}\n+\t\t\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\t\t\tassert.Contains(t, err.Error(), test.expected)\n+\t\t})\n+\t}\n+}\n+\n+func TestForCapabilities(t *testing.T) {\n+\tfilter := call(expression.OpEq, attr(\"http.method\"), untyped(\"GET\"))\n+\n+\tt.Run(\"no filter\", func(t *testing.T) {\n+\t\tq := TraceQueryParams{ServiceName: \"cart\", Attributes: pcommon.NewMap()}\n+\t\tgot, err := q.ForCapabilities(SearchCapabilities{})\n+\t\trequire.NoError(t, err)\n+\t\tassert.Equal(t, q, got)\n+\t})\n+\tt.Run(\"no declaration rewrites to legacy\", func(t *testing.T) {\n+\t\tgot, err := filterQuery(filter).ForCapabilities(SearchCapabilities{Filter: &FilterCapabilities{}})\n+\t\trequire.NoError(t, err)\n+\t\tassert.Nil(t, got.Filter)\n+\t\tassert.Equal(t, map[string]any{\"http.method\": \"GET\"}, got.Attributes.AsRaw())\n+\t})\n+\tt.Run(\"no declaration refuses what legacy cannot hold\", func(t *testing.T) {\n+\t\tq := filterQuery(call(expression.OpOr, filter, filter))\n+\t\tgot, err := q.ForCapabilities(SearchCapabilities{})\n+\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\tassert.Equal(t, q, got)\n+\t})\n+\tt.Run(\"declaration passes the filter\", func(t *testing.T) {\n+\t\tq := filterQuery(filter)\n+\t\tcaps := SearchCapabilities{Filter: &FilterCapabilities{Operators: []expression.Operator{expression.OpEq}}}\n+\t\tgot, err := q.ForCapabilities(caps)\n+\t\trequire.NoError(t, err)\n+\t\tassert.Equal(t, q, got)\n+\t})\n+\tt.Run(\"declaration refuses what it lacks\", func(t *testing.T) {\n+\t\tcaps := SearchCapabilities{Filter: &FilterCapabilities{Operators: []expression.Operator{expression.OpNe}}}\n+\t\t_, err := filterQuery(filter).ForCapabilities(caps)\n+\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\tassert.Contains(t, err.Error(), `it does not support the operator \"eq\"`)\n+\t})\n+}\n+\n+func TestEnsureSupported(t *testing.T) {\n+\tcaps := FilterCapabilities{\n+\t\tLevels:    []expression.Level{expression.LevelSpan},\n+\t\tOperators: []expression.Operator{expression.OpAnd, expression.OpEq, expression.OpNe, expression.OpSome},\n+\t}\n+\ttests := []struct {\n+\t\tname     string\n+\t\tfilter   *expression.Call\n+\t\texpected string\n+\t}{\n+\t\t{\"nil filter\", nil, \"\"},\n+\t\t{\"supported\", call(expression.OpAnd,\n+\t\t\tcall(expression.OpEq, attr(\"a\"), untyped(\"1\")),\n+\t\t\tcall(expression.OpNe, attrAt(expression.LevelSpan, \"b\"), attrAt(expression.LevelSpan, \"c\"))), \"\"},\n+\t\t{\"operator\", call(expression.OpOr, call(expression.OpEq, attr(\"a\"), untyped(\"1\"))),\n+\t\t\t`it does not support the operator \"or\"`},\n+\t\t{\"nested operator\", call(expression.OpAnd, call(expression.OpGt, attr(\"a\"), untyped(\"1\"))),\n+\t\t\t`it does not support the operator \"gt\"`},\n+\t\t{\"attribute level\", call(expression.OpEq, attrAt(expression.LevelLink, \"a\"), untyped(\"1\")),\n+\t\t\t`it does not index the \"link\" level`},\n+\t\t{\"field level\", call(expression.OpEq, serviceField, str(\"cart\")),\n+\t\t\t`it does not index the \"resource\" level`},\n+\t\t{\"collection level\", call(expression.OpSome, &expression.NestedRef{Level: expression.LevelEvent},\n+\t\t\tcall(expression.OpEq, field(expression.LevelEvent, expression.EventFieldName), str(\"x\"))),\n+\t\t\t`it does not index the \"event\" level`},\n+\t\t{\"right side of a comparison\", call(expression.OpNe,\n+\t\t\tattrAt(expression.LevelSpan, \"a\"), attrAt(expression.LevelScope, \"a\")),\n+\t\t\t`it does not index the \"scope\" level`},\n+\t\t{\"call on the right side of a comparison\", call(expression.OpEq,\n+\t\t\tattr(\"a\"), call(expression.OpGt, attr(\"b\"), untyped(\"1\"))),\n+\t\t\t`it does not support the operator \"gt\"`},\n+\t}\n+\tfor _, test := range tests {\n+\t\tt.Run(test.name, func(t *testing.T) {\n+\t\t\terr := caps.EnsureSupported(test.filter)\n+\t\t\tif test.expected == \"\" {\n+\t\t\t\trequire.NoError(t, err)\n+\t\t\t\treturn\n+\t\t\t}\n+\t\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\t\tassert.Contains(t, err.Error(), test.expected)\n+\t\t})\n+\t}\n+}\n+\n+func TestEnsureSupported_RefusesACycle(t *testing.T) {\n+\tcycle := call(expression.OpAnd)\n+\tcycle.Args = []expression.Expression{cycle}\n+\terr := FilterCapabilities{Operators: []expression.Operator{expression.OpAnd}}.EnsureSupported(cycle)\n+\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\trequire.ErrorIs(t, err, expression.ErrTooDeeplyNested)\n+}\n+\n+func TestToFilterShape(t *testing.T) {\n+\tstart := time.Unix(1000, 0)\n+\ttests := []struct {\n+\t\tname     string\n+\t\tquery    func() TraceQueryParams\n+\t\texpected *expression.Call\n+\t}{\n+\t\t{\"nothing\", func() TraceQueryParams { return TraceQueryParams{Attributes: pcommon.NewMap()} }, nil},\n+\t\t{\"zero attributes\", func() TraceQueryParams { return TraceQueryParams{} }, nil},\n+\t\t{\"service alone\", func() TraceQueryParams {\n+\t\t\treturn TraceQueryParams{ServiceName: \"cart\", Attributes: pcommon.NewMap()}\n+\t\t}, call(expression.OpEq, serviceField, str(\"cart\"))},\n+\t\t{\"everything\", func() TraceQueryParams {\n+\t\t\tq := TraceQueryParams{\n+\t\t\t\tServiceName:   \"cart\",\n+\t\t\t\tOperationName: \"GET /cart\",\n+\t\t\t\tAttributes:    pcommon.NewMap(),\n+\t\t\t\tDurationMin:   time.Second,\n+\t\t\t\tDur  &expression.AnyValue{Value: \"1\"})),\n+\t\t\texpectedErr: `it does not index the \"link\" level`,\n+\t\t},\n+\t}\n+\tfor _, test := range tests {\n+\t\tt.Run(test.name, func(t *testing.T) {\n+\t\t\terr := caps.EnsureSupported(test.filter)\n+\t\t\tif test.expectedErr == \"\" {\n+\t\t\t\trequire.NoError(t, err)\n+\t\t\t\treturn\n+\t\t\t}\n+\t\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\t\tassert.ErrorContains(t, err, test.expectedErr)\n+\t\t})\n+\t}\n+}\n+\n+func TestFilterCapabilities_EnsureSupported_RefusesACycle(t *testing.T) {\n+\tcaps := FilterCapabilities{Operators: []expression.Operator{expression.OpAnd, expression.OpEq}}\n+\tcycle := &expression.Call{Op: expression.OpAnd}\n+\tcycle.Args = []expression.Expression{cycle, cycle}\n+\n+\terr := caps.EnsureSupported(cycle)\n+\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\trequire.ErrorIs(t, err, expression.ErrTooDeeplyNested)\n+}\n+\n+func call(op expression.Operator, args ...expression.Expression) *expression.Call {\n+\treturn &expression.Call{Op: op, Args: args}\n+}\ndiff --git a/internal/storage/v2/api/tracestore/query_shape.go b/internal/storage/v2/api/tracestore/query_shape.go\nnew file mode 100644\nindex 0000000..c88c3b0\n--- /dev/null\n+++ b/internal/storage/v2/api/tracestore/query_shape.go\n@@ -0,0 +1,335 @@\n+// Copyright (c) 2026 The Jaeger Authors.\n+// SPDX-License-Identifier: Apache-2.0\n+\n+package tracestore\n+\n+import (\n+\t\"fmt\"\n+\t\"time\"\n+\n+\texpression \"github.com/jaegertracing/jaeger-idl/query/expression/v1\"\n+\t\"go.opentelemetry.io/collector/pdata/pcommon\"\n+)\n+\n+// The names of the legacy predicate fields, as the query API spells them.\n+const (\n+\tlegacyFieldServiceName   = \"service_name\"\n+\tlegacyFieldOperationName = \"operation_name\"\n+\tlegacyFieldDurationMin   = \"duration_min\"\n+\tlegacyFieldDurationMax   = \"duration_max\"\n+\tlegacyFieldAttributes    = \"attributes\"\n+)\n+\n+// EnsureFilterStandsAlone rejects a query that carries both a filter and one\n+// of the predicate fields the filter replaces. A Reader sees one filtering\n+// model, so a mix of the two is malformed whatever the backend can do.\n+func (q TraceQueryParams) EnsureFilterStandsAlone() error {\n+\tif q.Filter == nil {\n+\t\treturn nil\n+\t}\n+\tvar conflicts []string\n+\tif q.ServiceName != \"\" {\n+\t\tconflicts = append(conflicts, legacyFieldServiceName)\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tconflicts = append(conflicts, legacyFieldOperationName)\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tconflicts = append(conflicts, legacyFieldDurationMin)\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tconflicts = append(conflicts, legacyFieldDurationMax)\n+\t}\n+\tif attributeCount(q.Attributes) > 0 {\n+\t\tconflicts = append(conflicts, legacyFieldAttributes)\n+\t}\n+\tif len(conflicts) == 0 {\n+\t\treturn nil\n+\t}\n+\treturn fmt.Errorf(\"%w: a filter cannot be combined with the predicate fields %v\", ErrFilterInvalid, conflicts)\n+}\n+\n+// ForCapabilities gives the Reader whichever of the two filtering models it\n+// declared it can evaluate. A Reader that declares filter support receives the\n+// filter as it is, provided it can evaluate all of it; any other Reader\n+// receives the filter rewritten into the legacy predicate fields.\n+func (q TraceQueryParams) ForCapabilities(caps SearchCapabilities) (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\tif caps.Filter.IsEmpty() {\n+\t\treturn q.ToLegacyShape()\n+\t}\n+\treturn q, caps.Filter.EnsureSupported(q.Filter)\n+}\n+\n+// ToFilterShape expresses q's scalar predicate fields as filter predicates. It\n+// cannot fail, because each legacy field has an exact filter equivalent. A\n+// query that already has a Filter is returned as it is.\n+//\n+// An attribute is compared as an untyped constant holding the value's string\n+// form, because a tag never declared a type.\n+func (q TraceQueryParams) ToFilterShape() TraceQueryParams {\n+\tif q.Filter != nil {\n+\t\treturn q\n+\t}\n+\tvar predicates []*expression.Call\n+\tif q.ServiceName != \"\" {\n+\t\tpredicates = append(predicates, equals(\n+\t\t\t&expression.FieldRef{Level: expression.LevelResource, Name: expression.ResourceFieldService},\n+\t\t\t&expression.StringValue{Value: q.ServiceName}))\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tpredicates = append(predicates, equals(\n+\t\t\t&expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldName},\n+\t\t\t&expression.StringValue{Value: q.OperationName}))\n+\t}\n+\tif attributeCount(q.Attributes) > 0 {\n+\t\tfor key, value := range q.Attributes.All() {\n+\t\t\tpredicates = append(predicates, equals(\n+\t\t\t\t&expression.AttributeRef{Key: key},\n+\t\t\t\t&expression.AnyValue{Value: value.AsString()}))\n+\t\t}\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tpredicates = append(predicates, durationBound(expression.OpGte, q.DurationMin))\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tpredicates = append(predicates, durationBound(expression.OpLte, q.DurationMax))\n+\t}\n+\n+\tq.ServiceName = \"\"\n+\tq.OperationName = \"\"\n+\tq.Attributes = pcommon.NewMap()\n+\tq.DurationMin = 0\n+\tq.DurationMax = 0\n+\tswitch len(predicates) {\n+\tcase 0:\n+\t\tq.Filter = nil\n+\tcase 1:\n+\t\tq.Filter = predicates[0]\n+\tdefault:\n+\t\targs := make([]expression.Expression, len(predicates))\n+\t\tfor i, predicate := range predicates {\n+\t\t\targs[i] = predicate\n+\t\t}\n+\t\tq.Filter = &expression.Call{Op: expression.OpAnd, Args: args}\n+\t}\n+\treturn q\n+}\n+\n+// ToLegacyShape expresses q's Filter in the scalar predicate fields every\n+// backend serves. Those fields can say only \"all of these hold\", so only a flat\n+// conjunction converts (a nested and is flattened), and each conjunct has to be\n+// one that a legacy field expresses exactly. Anything else is refused rather\n+// than approximated, because a dropped predicate widens the result.\n+//\n+// The result has a nil Filter and a new Attributes map, so the caller's map is\n+// not changed. On error the original query is returned. A query that also\n+// carries legacy predicate fields is refused as EnsureFilterStandsAlone refuses\n+// it, since converting it would merge two filtering models.\n+func (q TraceQueryParams) ToLegacyShape() (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\tif err := q.EnsureFilterStandsAlone(); err != nil {\n+\t\treturn q, err\n+\t}\n+\tconjuncts, err := flattenConjunction(q.Filter, nil, 1)\n+\tif err != nil {\n+\t\treturn q, err\n+\t}\n+\tw := legacyWriter{query: q}\n+\tw.query.Filter = nil\n+\tw.query.Attributes = pcommon.NewMap()\n+\tfor _, conjunct := range conjuncts {\n+\t\tif err := w.write(conjunct); err != nil {\n+\t\t\treturn q, err\n+\t\t}\n+\t}\n+\treturn w.query, nil\n+}\n+\n+// attributeCount is the number of entries in m, reading a Map left at its zero\n+// value (not created with pcommon.NewMap) as empty rather than panicking.\n+func attributeCount(m pcommon.Map) int {\n+\tif m == (pcommon.Map{}) {\n+\t\treturn 0\n+\t}\n+\treturn m.Len()\n+}\n+\n+func equals(ref, constant expression.Expression) *expression.Call {\n+\treturn &expression.Call{Op: expression.OpEq, Args: []expression.Expression{ref, constant}}\n+}\n+\n+func durationBound(op expression.Operator, d time.Duration) *expression.Call {\n+\treturn &expression.Call{Op: op, Args: []expression.Expression{\n+\t\t&expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldDuration},\n+\t\t&expression.DurationValue{Value: d},\n+\t}}\n+}\n+\n+// flattenConjunction appends to into the predicates call conjoins, descending\n+// into nested conjunctions. depth bounds the walk, so a filter that contains\n+// itself is refused rather than followed forever.\n+func flattenConjunction(call *expression.Call, into []*expression.Call, depth int) ([]*expression.Call, error) {\n+\tif depth > expression.MaxNestingDepth {\n+\t\treturn nil, fmt.Errorf(\"%w: %w\", ErrFilterInvalid, expression.ErrTooDeeplyNested)\n+\t}\n+\tif call.Op != expression.OpAnd {\n+\t\treturn append(into, call), nil\n+\t}\n+\tfor _, arg := range call.Args {\n+\t\tnested, ok := arg.(*expression.Call)\n+\t\tif !ok || nested == nil {\n+\t\t\treturn nil, fmt.Errorf(\"%w: it serves a conjunction of predicates only\", ErrFilterUnsupported)\n+\t\t}\n+\t\tvar err error\n+\t\tif into, err = flattenConjunction(nested, into, depth+1); err != nil {\n+\t\t\treturn nil, err\n+\t\t}\n+\t}\n+\treturn into, nil\n+}\n+\n+// legacyWriter writes conjuncts into the legacy predicate fields of query,\n+// refusing a second predicate on a field one has already written.\n+type legacyWriter struct {\n+\tquery                                    TraceQueryParams\n+\thasService, hasOperation, hasMin, hasMax bool\n+}\n+\n+func (w *legacyWriter) write(call *expression.Call) error {\n+\tswitch call.Op {\n+\tcase expression.OpOr, expression.OpNot, expression.OpExists:\n+\t\treturn errOperator(call.Op)\n+\t}\n+\tif len(call.Args) != 2 {\n+\t\treturn errOperator(call.Op)\n+\t}\n+\tswitch ref := call.Args[0].(type) {\n+\tcase *expression.AttributeRef:\n+\t\tif ref != nil {\n+\t\t\treturn w.writeAttribute(call.Op, ref, call.Args[1])\n+\t\t}\n+\tcase *expression.FieldRef:\n+\t\tif ref != nil {\n+\t\t\treturn w.writeField(call.Op, ref, call.Args[1])\n+\t\t}\n+\t}\n+\treturn fmt.Errorf(\"%w: it compares a reference against a constant only\", ErrFilterUnsupported)\n+}\n+\n+func (w *legacyWriter) writeAttribute(op expression.Operator, ref *expression.AttributeRef, operand expression.Expression) error {\n+\tswitch ref.Level {\n+\tcase \"\", expression.LevelSpan, expression.LevelResource, expression.LevelEvent:\n+\t\t// A plain tag matches the span, resource and event levels alike, so a\n+\t\t// qualified attribute widens to one.\n+\tdefault:\n+\t\treturn errLevel(ref.Level)\n+\t}\n+\tif op != expression.OpEq {\n+\t\treturn errOperatorOn(op, ref.Key)\n+\t}\n+\tvalue, err := stringOperand(ref.Key, operand)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif _, ok := w.query.Attributes.Get(ref.Key); ok {\n+\t\treturn errSecondPredicate(ref.Key)\n+\t}\n+\tw.query.Attributes.PutStr(ref.Key, value)\n+\treturn nil\n+}\n+\n+func (w *legacyWriter) writeField(op expression.Operator, ref *expression.FieldRef, operand expression.Expression) error {\n+\tswitch {\n+\tcase ref.Level == expression.LevelResource && ref.Name == expression.ResourceFieldService:\n+\t\treturn writeString(op, ref.Name, operand, &w.hasService, &w.query.ServiceName)\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldName:\n+\t\treturn writeString(op, ref.Name, operand, &w.hasOperation, &w.query.OperationName)\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldDuration:\n+\t\tswitch op {\n+\t\tcase expression.OpGte:\n+\t\t\treturn writeDuration(op, ref.Name, operand, &w.hasMin, &w.query.DurationMin)\n+\t\tcase expression.OpLte:\n+\t\t\treturn writeDuration(op, ref.Name, operand, &w.hasMax, &w.query.DurationMax)\n+\t\tdefault:\n+\t\t\treturn errOperatorOn(op, ref.Name)\n+\t\t}\n+\tdefault:\n+\t\treturn fmt.Errorf(\"%w: it does not support the built-in field %q of the %q level\",\n+\t\t\tErrFilterUnsupported, ref.Name, ref.Level)\n+\t}\n+}\n+\n+// writeString writes an equality on a string field into dst, which written\n+// marks as taken.\n+func writeString(op expression.Operator, name string, operand expression.Expression, written *bool, dst *string) error {\n+\tif op != expression.OpEq {\n+\t\treturn errOperatorOn(op, name)\n+\t}\n+\tvalue, err := stringOperand(name, operand)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif *written {\n+\t\treturn errSecondPredicate(name)\n+\t}\n+\t*written, *dst = true, value\n+\treturn nil\n+}\n+\n+// writeDuration writes an inclusive duration bound into dst, which written\n+// marks as taken.\n+func writeDuration(op expression.Operator, name string, operand expression.Expression, written *bool, dst *time.Duration) error {\n+\tvar value time.Duration\n+\tswitch constant := operand.(type) {\n+\tcase *expression.DurationValue:\n+\t\tif constant == nil {\n+\t\t\treturn errNotADuration(name)\n+\t\t}\n+\t\tvalue = constant.Value\n+\tcase *expression.AnyValue:\n+\t\tif constant == nil {\n+\t\t\treturn errNotADuration(name)\n+\t\t}\n+\t\treturn fmt.Errorf(\"%w: the bound %q on %q was never read as a duration\", ErrFilterInvalid, constant.Value, name)\n+\tdefault:\n+\t\treturn errNotADuration(name)\n+\t}\n+\tif *written {\n+\t\treturn errSecondPredicate(name)\n+\t}\n+\t*written, *dst = true, value\n+\treturn nil\n+}\n+\n+// stringOperand returns the text of a string or untyped constant, the only\n+// constants a legacy string field or tag can hold.\n+func stringOperand(name string, operand expression.Expression) (string, error) {\n+\tswitch constant := operand.(type) {\n+\tcase *expression.StringValue:\n+\t\tif constant != nil {\n+\t\t\treturn constant.Value, nil\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif constant != nil {\n+\t\t\treturn constant.Value, nil\n+\t\t}\n+\t}\n+\treturn \"\", fmt.Errorf(\"%w: it compares %q against a string constant only\", ErrFilterUnsupported, name)\n+}\n+\n+func errOperatorOn(op expression.Operator, name string) error {\n+\treturn fmt.Errorf(\"%w: it does not support the operator %q on %q\", ErrFilterUnsupported, op, name)\n+}\n+\n+func errNotADuration(name string) error {\n+\treturn fmt.Errorf(\"%w: it compares %q against a duration such as \\\"2s\\\" only\", ErrFilterUnsupported, name)\n+}\n+\n+func errSecondPredicate(name string) error {\n+\treturn fmt.Errorf(\"%w: it serves only one predicate on %q\", ErrFilterUnsupported, name)\n+}\ndiff --git a/internal/storage/v2/api/tracestore/query_shape_test.go b/internal/storage/v2/api/tracestore/query_shape_test.go\nnew file mode 100644\nindex 0000000..ab58931\n--- /dev/null\n+++ b/internal/storage/v2/api/tracestore/query_shape_test.go\n@@ -0,0 +1,471 @@\n+// Copyright (c) 2026 The Jaeger Authors.\n+// SPDX-License-Identifier: Apache-2.0\n+\n+package tracestore "\" {\n+\t\tpredicates = append(predicates, predicate(expression.OpEq,\n+\t\t\t&expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldName},\n+\t\t\t&expression.StringValue{Value: q.OperationName}))\n+\t}\n+\tif hasAttributes(q.Attributes) {\n+\t\tq.Attributes.Range(func(key string, value pcommon.Value) bool {\n+\t\t\tpredicates = append(predicates, predicate(expression.OpEq,\n+\t\t\t\t&expression.AttributeRef{Key: key},\n+\t\t\t\t&expression.AnyValue{Value: value.AsString()}))\n+\t\t\treturn true\n+\t\t})\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tpredicates = append(predicates, predicate(expression.OpGte, durationRef(),\n+\t\t\t&expression.DurationValue{Value: q.DurationMin}))\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tpredicates = append(predicates, predicate(expression.OpLte, durationRef(),\n+\t\t\t&expression.DurationValue{Value: q.DurationMax}))\n+\t}\n+\n+\tshaped := q\n+\tshaped.ServiceName = \"\"\n+\tshaped.OperationName = \"\"\n+\tshaped.Attributes = pcommon.NewMap()\n+\tshaped.DurationMin = 0\n+\tshaped.DurationMax = 0\n+\tswitch len(predicates) {\n+\tcase 0:\n+\t\tshaped.Filter = nil\n+\tcase 1:\n+\t\tshaped.Filter = predicates[0]\n+\tdefault:\n+\t\targs := make([]expression.Expression, len(predicates))\n+\t\tfor i, p := range predicates {\n+\t\t\targs[i] = p\n+\t\t}\n+\t\tshaped.Filter = &expression.Call{Op: expression.OpAnd, Args: args}\n+\t}\n+\treturn shaped\n+}\n+\n+// ToLegacyShape expresses q's Filter in the scalar predicate fields every\n+// backend serves. A query without a filter is returned unchanged.\n+//\n+// Only a flat conjunction of the predicates the legacy fields can hold\n+// converts: equality on an attribute, the service or the operation name, and\n+// the inclusive duration bounds. Anything else is refused with an error\n+// wrapping ErrFilterUnsupported, rather than approximated. A filter that was\n+// never finalized, or one that sits beside the legacy fields it would write, is\n+// refused with ErrFilterInvalid. On
