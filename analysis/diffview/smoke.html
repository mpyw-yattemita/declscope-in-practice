rUnsupported)\n+}\n+\n+// writeAttribute writes an equality on an attribute as a tag. A tag is looked\n+// up at the span and resource levels, and the event level where a backend\n+// indexes it, so a predicate on one of those levels widens to a plain tag. The\n+// link and scope levels are not searched for tags at all.\n+func (w *legacyWriter) writeAttribute(op expression.Operator, ref *expression.AttributeRef, operand expression.Expression) error {\n+\tswitch ref.Level {\n+\tcase \"\", expression.LevelSpan, expression.LevelResource, expression.LevelEvent:\n+\tdefault:\n+\t\treturn fmt.Errorf(\"%w: it does not index the %q level\", ErrFilterUnsupported, ref.Level)\n+\t}\n+\tif op != expression.OpEq {\n+\t\treturn errOperatorOn(op, ref.Key)\n+\t}\n+\tvalue, err := stringOperand(ref.Key, operand)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif _, ok := w.query.Attributes.Get(ref.Key); ok {\n+\t\treturn errDuplicate(ref.Key)\n+\t}\n+\tw.query.Attributes.PutStr(ref.Key, value)\n+\treturn nil\n+}\n+\n+// writeField writes a predicate on one of the three built-in fields the legacy\n+// fields hold: the service, the operation name and the duration.\n+func (w *legacyWriter) writeField(op expression.Operator, ref *expression.FieldRef, operand expression.Expression) error {\n+\tswitch {\n+\tcase ref.Level == expression.LevelResource && ref.Name == expression.ResourceFieldService:\n+\t\treturn writeString(op, ref.Name, operand, &w.query.ServiceName, &w.wroteService)\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldName:\n+\t\treturn writeString(op, ref.Name, operand, &w.query.OperationName, &w.wroteOperation)\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldDuration:\n+\t\treturn w.writeDuration(op, ref.Name, operand)\n+\tdefault:\n+\t\treturn fmt.Errorf(\"%w: it does not support the built-in field %q of the %q level\",\n+\t\t\tErrFilterUnsupported, ref.Name, ref.Level)\n+\t}\n+}\n+\n+// writeString writes an equality on a string-valued field into target, which\n+// wrote records as written.\n+func writeString(op expression.Operator, name string, operand expression.Expression, target *string, wrote *bool) error {\n+\tif op != expression.OpEq {\n+\t\treturn errOperatorOn(op, name)\n+\t}\n+\tvalue, err := stringOperand(name, operand)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif *wrote {\n+\t\treturn errDuplicate(name)\n+\t}\n+\t*target, *wrote = value, true\n+\treturn nil\n+}\n+\n+// writeDuration writes an inclusive duration bound.\n+func (w *legacyWriter) writeDuration(op expression.Operator, name string, operand expression.Expression) error {\n+\tvar target *time.Duration\n+\tvar wrote *bool\n+\tswitch op {\n+\tcase expression.OpGte:\n+\t\ttarget, wrote = &w.query.DurationMin, &w.wroteDurationMin\n+\tcase expression.OpLte:\n+\t\ttarget, wrote = &w.query.DurationMax, &w.wroteDurationMax\n+\tdefault:\n+\t\treturn errOperatorOn(op, name)\n+\t}\n+\tswitch value := operand.(type) {\n+\tcase *expression.DurationValue:\n+\t\tif value != nil {\n+\t\t\tif *wrote {\n+\t\t\t\treturn errDuplicate(name)\n+\t\t\t}\n+\t\t\t*target, *wrote = value.Value, true\n+\t\t\treturn nil\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif value != nil {\n+\t\t\t// Resolving the filter reads this constant as a duration, so an\n+\t\t\t// untyped one means the filter was never finalized.\n+\t\t\treturn fmt.Errorf(\"%w: the bound %q on %q was never read as a duration\",\n+\t\t\t\tErrFilterInvalid, value.Value, name)\n+\t\t}\n+\t}\n+\treturn fmt.Errorf(\"%w: it compares %q against a duration such as \\\"2s\\\" only\", ErrFilterUnsupported, name)\n+}\n+\n+// stringOperand returns the text of a string or untyped constant, the only\n+// values the legacy string fields and tags hold.\n+func stringOperand(name string, operand expression.Expression) (string, error) {\n+\tswitch value := operand.(type) {\n+\tcase *expression.StringValue:\n+\t\tif value != nil {\n+\t\t\treturn value.Value, nil\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif value != nil {\n+\t\t\treturn value.Value, nil\n+\t\t}\n+\t}\n+\treturn \"\", fmt.Errorf(\"%w: it compares %q against a string constant only\", ErrFilterUnsupported, name)\n+}\n+\n+func errOperator(op expression.Operator) error {\n+\treturn fmt.Errorf(\"%w: it does not support the operator %q\", ErrFilterUnsupported, op)\n+}\n+\n+func errOperatorOn(op expression.Operator, name string) error {\n+\treturn fmt.Errorf(\"%w: it does not support the operator %q on %q\", ErrFilterUnsupported, op, name)\n+}\n+\n+func errDuplicate(name string) error {\n+\treturn fmt.Errorf(\"%w: it accepts only one predicate on %q\", ErrFilterUnsupported, name)\n+}\n+\n+func predicate(op expression.Operator, ref, constant expression.Expression) *expression.Call {\n+\treturn &expression.Call{Op: op, Args: []expression.Expression{ref, constant}}\n+}\n+\n+func durationRef() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldDuration}\n+}\n+\n+// hasAttributes reports whether m holds an entry. A Map left at its zero value,\n+// rather than created with pcommon.NewMap, holds none and must not be read.\n+func hasAttributes(m pcommon.Map) bool {\n+\treturn m != (pcommon.Map{}) && m.Len() > 0\n+}\ndiff --git a/internal/storage/v2/api/tracestore/query_filter_test.go b/internal/storage/v2/api/tracestore/query_filter_test.go\nnew file mode 100644\nindex 0000000..99e60a0\n--- /dev/null\n+++ b/internal/storage/v2/api/tracestore/query_filter_test.go\n@@ -0,0 +1,509 @@\n+// Copyright (c) 2026 The Jaeger Authors.\n+// SPDX-License-Identifier: Apache-2.0\n+\n+package tracestore\n+\n+import (\n+\t\"testing\"\n+\t\"time\"\n+\n+\t\"github.com/jaegertracing/jaeger-idl/query/expression/v1\"\n+\t\"github.com/stretchr/testify/assert\"\n+\t\"github.com/stretchr/testify/require\"\n+\t\"go.opentelemetry.io/collector/pdata/pcommon\"\n+)\n+\n+func call(op expression.Operator, args ...expression.Expression) *expression.Call {\n+\treturn &expression.Call{Op: op, Args: args}\n+}\n+\n+func attr(key string) *expression.AttributeRef {\n+\treturn &expression.AttributeRef{Key: key}\n+}\n+\n+func tagEq(key, value string) *expression.Call {\n+\treturn call(expression.OpEq, attr(key), &expression.AnyValue{Value: value})\n+}\n+\n+func serviceRef() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelResource, Name: expression.ResourceFieldService}\n+}\n+\n+func operationRef() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldName}\n+}\n+\n+func str(v string) *expression.StringValue { return &expression.StringValue{Value: v} }\n+\n+func dur(d time.Duration) *expression.DurationValue { return &expression.DurationValue{Value: d} }\n+\n+func withFilter(filter *expression.Call) TraceQueryParams {\n+\treturn TraceQueryParams{Attributes: pcommon.NewMap(), Filter: filter}\n+}\n+\n+func TestEnsureFilterStandsAlone(t *testing.T) {\n+\tfilter := tagEq(\"http.method\", \"GET\")\n+\ttests := []struct {\n+\t\tname     string\n+\t\tquery    func() TraceQueryParams\n+\t\texpected string\n+\t}{\n+\t\t{name: \"no filter\", query: func() TraceQueryParams {\n+\t\t\treturn TraceQueryParams{ServiceName: \"cart\", Attributes: pcommon.NewMap()}\n+\t\t}},\n+\t\t{name: \"filter alone\", query: func() TraceQueryParams { return withFilter(filter) }},\n+\t\t{name: \"filter with a zero-value attributes map\", query: func() TraceQueryParams {\n+\t\t\treturn TraceQueryParams{Filter: filter}\n+\t\t}},\n+\t\t{name: \"filter beside a service name\", query: func() TraceQueryParams {\n+\t\t\tq := withFilter(filter)\n+\t\t\tq.ServiceName = \"cart\"\n+\t\t\treturn q\n+\t\t}, expected: \"[service_name]\"},\n+\t\t{name: \"filter beside an attribute\", query: func() TraceQueryParams {\n+\t\t\tq := withFilter(filter)\n+\t\t\tq.Attributes.PutStr(\"a\", \"1\")\n+\t\t\treturn q\n+\t\t}, expected: \"[attributes]\"},\n+\t\t{name: \"filter beside every predicate field\", query: func() TraceQueryParams {\n+\t\t\tq := withFilter(filter)\n+\t\t\tq.ServiceName = \"cart\"\n+\t\t\tq.OperationName = \"GET /cart\"\n+\t\t\tq.DurationMin = time.Second\n+\t\t\tq.DurationMax = 2 * time.Second\n+\t\t\tq.Attributes.PutStr(\"a\", \"1\")\n+\t\t\treturn q\n+\t\t}, expected: \"[service_name operation_name duration_min duration_max attributes]\"},\n+\t}\n+\tfor _, test := range tests {\n+\t\tt.Run(test.name, func(t *testing.T) {\n+\t\t\terr := test.query().EnsureFilterStandsAlone()\n+\t\t\tif test.expected == \"\" {\n+\t\t\t\trequire.NoError(t, err)\n+\t\t\t\treturn\n+\t\t\t}\n+\t\t\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\t\t\tassert.Contains(t, err.Error(), test.expected)\n+\t\t})\n+\t}\n+}\n+\n+func TestForCapabilities(t *testing.T) {\n+\tdeclared := SearchCapabilities{Filter: &FilterCapabilities{\n+\t\tLevels:    []expression.Level{expression.LevelSpan},\n+\t\tOperators: []expression.Operator{expression.OpAnd, expression.OpEq},\n+\t}}\n+\n+\tt.Run(\"no filter is returned unchanged\", func(t *testing.T) {\n+\t\tquery := TraceQueryParams{ServiceName: \"cart\", Attributes: pcommon.NewMap()}\n+\t\tgot, err := query.ForCapabilities(declared)\n+\t\trequire.NoError(t, err)\n+\t\tassert.Equal(t, query, got)\n+\t})\n+\n+\tt.Run(\"a declaring reader gets the filter\", func(t *testing.T) {\n+\t\tquery := withFilter(call(expression.OpAnd, tagEq(\"a\", \"1\"), tagEq(\"b\", \"2\")))\n+\t\tgot, err := query.ForCapabilities(declared)\n+\t\trequire.NoError(t, err)\n+\t\tassert.Equal(t, query, got)\n+\t})\n+\n+\tt.Run(\"a declaring reader refuses what it did not declare\", func(t *testing.T) {\n+\t\tquery := withFilter(call(expression.OpOr, tagEq(\"a\", \"1\"), tagEq(\"b\", \"2\")))\n+\t\tgot, err := query.ForCapabilities(declared)\n+\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\tassert.Contains(t, err.Error(), `does not support the operator \"or\"`)\n+\t\tassert.Equal(t, query, got)\n+\t})\n+\n+\tfor name, caps := range map[string]SearchCapabilities{\n+\t\t\"no declaration\":    {},\n+\t\t\"empty declaration\": {Filter: &FilterCapabilities{}},\n+\t} {\n+\t\tt.Run(name+\" gets the legacy shape\", func(t *testing.T) {\n+\t\t\tquery := withFilter(call(expression.OpEq, serviceRef(), str(\"cart\")))\n+\t\t\tgot, err := query.ForCapabilities(caps)\n+\t\t\trequire.NoError(t, err)\n+\t\t\tassert.Nil(t, got.Filter)\n+\t\t\tassert.Equal(t, \"cart\", got.ServiceName)\n+\n+\t\t\t_, err = withFilter(call(expression.OpOr, tagEq(\"a\", \"1\"), tagEq(\"b\", \"2\"))).ForCapabilities(caps)\n+\t\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\t})\n+\t}\n+}\n+\n+func TestToFilterShape(t *testing.T) {\n+\tstart := time.Date(2026, 1, 2, 3, 4, 5, 0, time.UTC)\n+\tquery := TraceQueryParams{\n+\t\tServiceName:   \"cart\",\n+\t\tOperationName: \"GET /cart\",\n+\t\tAttributes:    pcommon.NewMap(),\n+\t\tStartTimeMin:  start,\n+\t\tStartTimeMax:  start.Add(time.Hour),\n+\t\tDurationMin:   time.Second,\n+\t\tDurationMax:   2 * time.Second,\n+\t\tSearchDepth:   20,\n+\t}\n+\tquery.Attributes.PutStr(\"http.method\", \"GET\")\n+\tquery.Attributes.PutStr(\"http.route\", \"/cart\")\n+\n+\tgot := query.ToFilterShape()\n+\n+\tassert.Equal(t, call(expression.OpAnd,\n+\t\tcall(expression.OpEq, serviceRef(), str(\"cart\")),\n+\t\tcall(expression.OpEq, operationRef(), str(\"GET /cart\")),\n+\t\ttagEq(\"http.method\", \"GET\"),\n+\t\ttagEq(\"http.route\", \"/cart\"),\n+\t\tcall(expression.OpGte, durationRef(), dur(time.Second)),\n+\t\tcall(expression.OpLte, durationRef(), dur(2*time.Second)),\n+\t), got.Filter)\n+\tassert.Empty(t, got.ServiceName)\n+\tassert.Empty(t, got.OperationName)\n+\tassert.Zero(t, got.DurationMin)\n+\tassert.Zero(t, got.DurationMax)\n+\tassert.Equal(t, 0, got.Attributes.Len())\n+\tassert.Equal(t, 2, query.Attributes.Len(), \"the caller's map is not changed\")\n+\tassert.Equal(t, start, got.StartTimeMin)\n+\tassert.Equal(t, start.Add(time.Hour), got.StartTimeMax)\n+\tassert.Equal(t, 20, got.SearchDepth)\n+\n+\trequire.NoError(t, expression.ValidateFilter(got.Filter))\n+\tresolved, err := expression.ResolveConstants(got.Filter)\n+\trequire.NoError(t, err)\n+\tassert.Equal(t, got.Filter, resolved, \"the filter needs no further resolution\")\n+}\n+\n+func TestToFilterShape_ConjunctionOnlyWhenNeeded(t *testing.T) {\n+\tt.Run(\"no predicates\", func(t *testing.T) {\n+\t\tgot := TraceQueryParams{Attributes: pcommon.NewMap(), SearchDepth: 5}.ToFilterShape()\n+\t\tassert.Nil(t, got.Filter)\n+\t\tassert.Equal(t, 5, got.SearchDepth)\n+\t})\n+\tt.Run(\"one predicate stands alone\", func(t *testing.T) {\n+\t\tgot := TraceQueryParams{DurationMax: time.Second, Attributes: pcommon.NewMap()}.ToFilterShape()\n+\t\tassert.Equal(t, call(expression.OpLte, durationRef(), dur(time.Second)), got.Filter)\n+\t\trequire.NoError(t, expression.ValidateFilter(got.Filter))\n+\t})\n+\tt.Run(\"a zero-value attributes map\", func(t *testing.T) {\n+\t\tgot := TraceQueryParams{ServiceName: \"cart\"}.ToFilterShape()\n+\t\tassert.Equal(t, call(expression.OpEq, serviceRef(), str(\"cart\")), got.Filter)\n+\t\tassert.Equal(t, 0, got.Attributes.Len())\n+\t})\n+\tt.Run(\"a non-string attribute is written as its text\", func(t *testing.T) {\n+\t\tquery := TraceQueryParams{Attributes: pcommon.NewMap()}\n+\t\tquery.Attributes.PutInt(\"http.status_code\", 500)\n+\t\tassert.Equal(t, tagEq(\"http.status_code\", \"500\"), query.ToFilterShape().Filter)\n+\t})\n+\tt.Run(\"an existing filter is kept as it is\", func(t *testing.T) {\n+\t\tquery := withFilter(tagEq(\"a\", \"1\"))\n+\t\tquery.ServiceName = \"cart\"\n+\t\tassert.Equal(t, query, query.ToFilterShape())\n+\t})\n+}\n+\n+func TestToLegacyShape_RoundTrip(t *testing.T) {\n+\tstart := time.Date(2026, 1, 2, 3, 4, 5, 0, time.UTC)\n+\tquery := TraceQueryParams{\n+\t\tServiceName:   \"cart\",\n+\t\tOperationName: \"GET /cart\",\n+\t\tAttributes:    pcommon.NewMap(),\n+\t\tStartTimeMin:  start,\n+\t\tStartTimeMax:  start.Add(time.Hour),\n+\t\tDurationMin:   time.Second,\n+\t\tDurationMax:   2 * time.Second,\n+\t\tSearchDepth:   20,\n+\t}\n+\tquery.Attributes.PutStr(\"http.method\", \"GET\")\n+\tquery.Attributes.PutStr(\"http.route\", \"/cart\")\n+\n+\tgot, err := query.ToFilterShape().ToLegacyShape()\n+\trequire.NoError(t, err)\n+\tassert.Equal(t, query, got)\n+}\n+\n+func TestToLegacyShape_NoFilter(t *testing.T) {\n+\tquery := TraceQueryParams{ServiceName: \"cart\", Attributes: pcommon.NewMap()}\n+\tgot, err := query.ToLegacyShape()\n+\trequire.NoError(t, err)\n+\tassert.Equal(t, query, got)\n+}\n+\n+func TestToLegacyShape_Converts(t *testing.T) {\n+\tspanAttr := &expression.AttributeRef{Key: \"span.k\", Level: expression.LevelSpan}\n+\tresourceAttr := &expression.AttributeRef{Key: \"resource.k\", Level: expression.LevelResource}\n+\teventAttr := &expression.AttributeRef{Key: \"event.k\", Level: expression.LevelEvent}\n+\tfilter := call(expression.OpAnd,\n+\t\tcall(expression.OpEq, serviceRef(), &expression.AnyValue{Value: \"cart\"}),\n+\t\tcall(expression.OpAnd,\n+\t\t\tcall(expression.OpEq, operationRef(), str(\"GET /cart\")),\n+\t\t\tcall(expression.OpAnd,\n+\t\t\t\tcall(expression.OpEq, spanAttr, str(\"s\")),\n+\t\t\t\tcall(expression.OpEq, resourceAttr, &expression.AnyValue{Value: \"r\"}))),\n+\t\tcall(expression.OpEq, eventAttr, str(\"e\")),\n+\t\ttagEq(\"plain\", \"p\"),\n+\t\tcall(expression.OpGte, durationRef(), dur(time.Second)),\n+\t\tcall(expression.OpLte, durationRef(), dur(3*time.Second)),\n+\t)\n+\tquery := withFilter(filter)\n+\tquery.SearchDepth = 7\n+\n+\tgot, err := query.ToLegacyShape()\n+\trequire.NoError(t, err)\n+\tassert.Nil(t, got.Filter)\n+\tassert.Equal(t, \"cart\", got.ServiceName)\n+\tassert.Equal(t, \"GET /cart\", got.OperationName)\n+\tassert.Equal(t, time.Second, got.DurationMin)\n+\tassert.Equal(t, 3*time.Second, got.DurationMax)\n+\tassert.Equal(t, 7, got.SearchDepth)\n+\tassert.Equal(t, map[string]any{\n+\t\t\"span.k\": \"s\", \"resource.k\": \"r\", \"event.k\": \"e\", \"plain\": \"p\",\n+\t}, got.Attributes.AsRaw())\n+\tassert.Equal(t, 0, query.Attributes.Len(), \"the caller's map is not changed\")\n+\tassert.Same(t, filter, query.Filter)\n+}\n+\n+func TestToLegacyShape_SingleBound(t *testing.T) {\n+\tgot, err := withFilter(call(expression.OpLte, durationRef(), dur(time.Second))).ToLegacyShape()\n+\trequire.NoError(t, err)\n+\tassert.Zero(t, got.DurationMin)\n+\tassert.Equal(t, time.Second, got.DurationMax)\n+}\n+\n+func TestToLegacyShape_Refuses(t *testing.T) {\n+\tlinkAttr := &expression.AttributeRef{Key: \"peer.service\", Level: expression.LevelLink}\n+\tscopeAttr := &expression.AttributeRef{Key: \"otel.library\", Level: expression.LevelScope}\n+\tkind := &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldKind}\n+\tevents := &expression.NestedRef{Level: expression.LevelEvent}\n+\ttests := []struct {\n+\t\tname     string\n+\t\tfilter   *expression.Call\n+\t\texpected string\n+\t}{\n+\t\t{\n+\t\t\tname:     \"a disjunction\",\n+\t\t\tfilter:   call(expression.OpOr, tagEq(\"a\", \"1\"), tagEq(\"b\", \"2\")),\n+\t\t\texpected: `does not support the operator \"or\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a disjunction nested in a conjunction\",\n+\t\t\tfilter:   call(expression.OpAnd, tagEq(\"a\", \"1\"), call(expression.OpOr, tagEq(\"b\", \"2\"), tagEq(\"c\", \"3\"))),\n+\t\t\texpected: `does not support the operator \"or\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a negation\",\n+\t\t\tfilter:   call(expression.OpNot, tagEq(\"a\", \"1\")),\n+\t\t\texpected: `does not support the operator \"not\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"an existence test\",\n+\t\t\tfilter:   call(expression.OpExists, attr(\"a\")),\n+\t\t\texpected: `does not support the operator \"exists\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a predicate with one argument\",\n+\t\t\tfilter:   call(expression.OpEq, attr(\"a\")),\n+\t\t\texpected: `does not support the operator \"eq\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a predicate with three arguments\",\n+\t\t\tfilter:   call(expression.OpEq, attr(\"a\"), str(\"1\"), str(\"2\")),\n+\t\t\texpected: `does not support the operator \"eq\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a bare reference as a conjunct\",\n+\t\t\tfilter:   call(expression.OpAnd, tagEq(\"a\", \"1\"), attr(\"b\")),\n+\t\t\texpected: \"conjunction of predicates only\",\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a nil conjunct\",\n+\t\t\tfilter:   call(expression.OpAnd, tagEq(\"a\", \"1\"), (*expression.Call)(nil)),\n+\t\t\texpected: \"conjunction of predicates only\",\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"ne on an attribute\",\n+\t\t\tfilter:   call(expression.OpNe, attr(\"http.method\"), str(\"GET\")),\n+\t\t\texpected: `does not support the operator \"ne\" on \"http.method\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"in on an attribute\",\n+\t\t\tfilter:   call(expression.OpIn, attr(\"http.status_code\"), &expression.List{Values: []string{\"500\"}, Type: expression.ValueTypeInt}),\n+\t\t\texpected: `does not support the operator \"in\" on \"http.status_code\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"gt on the duration\",\n+\t\t\tfilter:   call(expression.OpGt, durationRef(), dur(time.Second)),\n+\t\t\texpected: `does not support the operator \"gt\" on \"duration\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"regex on the operation name\",\n+\t\t\tfilter:   call(expression.OpRegex, operationRef(), str(\"GET .*\")),\n+\t\t\texpected: `does not support the operator \"regex\" on \"name\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"ne on the service\",\n+\t\t\tfilter:   call(expression.OpNe, serviceRef(), str(\"cart\")),\n+\t\t\texpected: `does not support the operator \"ne\" on \"service\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"an attribute at the link level\",\n+\t\t\tfilter:   call(expression.OpEq, linkAttr, str(\"cart\")),\n+\t\t\texpected: `does not index the \"link\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"an attribute at the scope level\",\n+\t\t\tfilter:   call(expression.OpEq, scopeAttr, str(\"otelhttp\")),\n+\t\t\texpected: `does not index the \"scope\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"another built-in field\",\n+\t\t\tfilter:   call(expression.OpEq, kind, str(\"server\")),\n+\t\t\texpected: `does not support the built-in field \"kind\" of the \"span\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"a built-in field of the right name at another level\",\n+\t\t\tfilter: call(expression.OpEq,\n+\t\t\t\t&expression.FieldRef{Level: expression.LevelEvent, Name: expression.EventFieldName}, str(\"exception\")),\n+\t\t\texpected: `does not support the built-in field \"name\" of the \"event\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"an attribute against a list\",\n+\t\t\tfilter:   call(expression.OpEq, attr(\"a\"), &expression.List{Values: []string{\"1\"}}),\n+\t\t\texpected: `compares \"a\" against a string constant only`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"an attribute against an integer\",\n+\t\t\tfilter:   call(expression.OpEq, attr(\"a\"), &expression.IntValue{Value: 1}),\n+\t\t\texpected: `compares \"a\" against a string constant only`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"an attribute against another reference\",\n+\t\t\tfilter:   call(expression.OpEq, attr(\"a\"), attr(\"b\")),\n+\t\t\texpected: `compares \"a\" against a string constant only`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"the service against a boolean\",\n+\t\t\tfilter:   call(expression.OpEq, serviceRef(), &expression.BoolValue{Value: true}),\n+\t\t\texpected: `compares \"service\" against a string constant only`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"the operation name against a reference\",\n+\t\t\tfilter:   call(expression.OpEq, operationRef(), attr(\"a\")),\n+\t\t\texpected: `compares \"name\" against a string constant only`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a duration against a string\",\n+\t\t\tfilter:   call(expression.OpGte, durationRef(), str(\"2s\")),\n+\t\t\texpected: `compares \"duration\" against a duration such as \"2s\" only`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a duration against an integer\",\n+\t\t\tfilter:   call(expression.OpLte, durationRef(), &expression.IntValue{Value: 2}),\n+\t\t\texpected: `compares \"duration\" against a duration such as \"2s\" only`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a nil duration constant\",\n+\t\t\tfilter:   call(expression.OpGte, durationRef(), (*expression.DurationValue)(nil)),\n+\t\t\texpected: `compares \"duration\" against a duration such as \"2s\" only`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a nil untyped duration constant\",\n+\t\t\tfilter:   call(expression.OpGte, durationRef(), (*expression.AnyValue)(nil)),\n+\t\t\texpected: `compares \"duration\" against a duration such as \"2s\" only`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a nil string constant\",\n+\t\t\tfilter:   call(expression.OpEq, attr(\"a\"), (*expression.StringValue)(nil)),\n+\t\t\texpected: `compares \"a\" against a string constant only`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a nil attribute reference\",\n+\t\t\tfilter:   call(expression.OpEq, (*expression.AttributeRef)(nil), str(\"1\")),\n+\t\t\texpected: \"compares a reference against a constant only\",\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a nil field reference\",\n+\t\t\tfilter:   call(expression.OpEq, (*expression.FieldRef)(nil), str(\"1\")),\n+\t\t\texpected: \"compares a reference against a constant only\",\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a quantifier over the events\",\n+\t\t\tfilter:   call(expression.OpSome, events, call(expression.OpEq, attr(\"a\"), str(\"1\"))),\n+\t\t\texpected: \"compares a reference against a constant only\",\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a constant on the left\",\n+\t\t\tfilter:   call(expression.OpEq, str(\"1\"), attr(\"a\")),\n+\t\t\texpected: \"compares a reference against a constant only\",\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"two predicates on one attribute\",\n+\t\t\tfilter:   call(expression.OpAnd, tagEq(\"a\", \"1\"), tagEq(\"a\", \"2\")),\n+\t\t\texpected: `only one predicate on \"a\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"two predicates on one attribute at different levels\",\n+\t\t\tfilter: call(expression.OpAnd, tagEq(\"a\", \"1\"),\n+\t\t\t\tcall(expression.OpEq, &expression.AttributeRef{Key: \"a\", Level: expression.LevelSpan}, str(\"1\"))),\n+\t\t\texpected: `only one predicate on \"a\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"two predicates on the service\",\n+\t\t\tfilter: call(expression.OpAnd,\n+\t\t\t\tcall(expression.OpEq, serviceRef(), str(\"a\")), call(expression.OpEq, serviceRef(), str(\"b\"))),\n+\t\t\texpected: `only one predicate on \"service\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"two predicates on the empty service\",\n+\t\t\tfilter: call(expression.OpAnd,\n+\t\t\t\tcall(expression.OpEq, serviceRef(), str(\"\")), call(expression.OpEq, serviceRef(), str(\"\"))),\n+\t\t\texpected: `only one predicate on \"service\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"two predicates on the operation name\",\n+\t\t\tfilter: call(expression.OpAnd,\n+\t\t\t\tcall(expression.OpEq, operationRef(), str(\"a\")), call(expression.OpEq, operationRef(), str(\"b\"))),\n+\t\t\texpected: `only one predicate on \"name\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"two lower bounds\",\n+\t\t\tfilter: call(expression.OpAnd,\n+\t\t\t\tcall(expression.OpGte, durationRef(), dur(time.Second)), call(expression.OpGte, durationRef(), dur(time.Minute))),\n+\t\t\texpected: `only one predicate on \"duration\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"two upper bounds\",\n+\t\t\tfilter: call(expression.OpAnd,\n+\t\t\t\tcall(expression.OpLte, durationRef(), dur(time.Second)), call(expression.OpLte, durationRef(), dur(time.Minute))),\n+\t\t\texpected: `only one predicate on \"duration\"`,\n+\t\t},\n+\t}\n+\tfor _, test := range tests {\n+\t\tt.Run(test.name, func(t *testing.T) {\n+\t\t\tquery := withFilter(test.filter)\n+\t\t\tgot, err := query.ToLegacyShape()\n+\t\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\t\tassert.NotErrorIs(t, err, ErrFilterInvalid)\n+\t\t\tassert.Contains(t, err.Error(), test.expected)\n+\t\t\tassert.Equal(t, query, got, \"on error the original query is returned\")\n+\t\t})\n+\t}\n+}\n+\n+func TestToLegacyShape_RefusesAnUnresolvedBound(t *testing.T) {\n+\tquery := withFilter(call(expression.OpGte, durationRef(), &expression.AnyValue{Value: \"2s\"}))\n+\tgot, err := query.ToLegacyShape()\n+\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\tassert.NotErrorIs(t, err, ErrFilterUnsupported)\n+\tassert.Contains(t, err.Error(), `the bound \"2s\" on \"duration\" was never read as a duration`)\n+\tassert.Equal(t, query, got)\n+}\n+\n+func TestToLegacyShape_RefusesAFilterBesideLegacyFields(t *testing.T) {\n+\tquery := withFilter(call(expression.OpEq, serviceRef(), str(\"cart\")))\n+\tquery.ServiceName = \"payments\"\n+\tgot, err := query.ToLegacyShape()\n+\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\tassert.Contains(t, err.Error(), \"[service_name]\")\n+\tassert.Equal(t, query, got)\n+}\n", "cut": false, "full": true}]}]}]};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ARM = { A: "A: なし", P: "P: プロンプト", G: "G: ガードレール" };
const state = { task: 0, step: 0 };

function parseDiff(text) {
  const files = [];
  let cur = null;
  for (const line of text.split("\n")) {
    const m = /^diff --git a\/(.*?) b\/(.*)$/.exec(line);
    if (m) { cur = { path: m[2], lines: [], plus: 0, minus: 0 }; files.push(cur); continue; }
    if (!cur || /^(index |--- |\+\+\+ |new file mode|deleted file mode|similarity |rename )/.test(line)) continue;
    cur.lines.push(line);
    if (line.startsWith("+")) cur.plus++; else if (line.startsWith("-")) cur.minus++;
  }
  return files;
}

// Keep each change with `ctx` lines around it; mark the gaps with a hunk line.
function aroundChanges(lines, ctx) {
  const keep = new Array(lines.length).fill(false);
  lines.forEach((l, i) => {
    if (l.startsWith("+") || l.startsWith("-")) for (let j = Math.max(0, i - ctx); j <= Math.min(lines.length - 1, i + ctx); j++) keep[j] = true;
    if (l.startsWith("@@")) keep[i] = false;
  });
  const out = [];
  let skipped = 0;
  lines.forEach((l, i) => {
    if (l.startsWith("@@")) return;
    if (keep[i]) { if (skipped) { out.push(`@@ ${skipped} 行省略 @@`); skipped = 0; } out.push(l); } else skipped++;
  });
  if (skipped) out.push(`@@ ${skipped} 行省略 @@`);
  return out;
}

// Render lines with the line number in the new file, taken from each hunk header.
function numbered(lines) {
  let n = 0;
  return lines.map((l) => {
    const h = /^@@ -\d+(?:,\d+)? \+(\d+)/.exec(l);
    if (h) { n = +h[1] - 1; return `<div class="h"><span class="ln"></span>${esc(l)}</div>`; }
    if (l.startsWith("@@")) return `<div class="h"><span class="ln"></span>${esc(l)}</div>`;
    const cls = l.startsWith("+") ? "a" : l.startsWith("-") ? "d" : "";
    const ln = l.startsWith("-") ? "" : String(++n);
    return `<div class="${cls}"><span class="ln">${ln}</span>${esc(l) || " "}</div>`;
  }).join("");
}

function isTool(path) { return /(^|\/)\.declscope-baseline\.yaml$/.test(path) || path.startsWith(".claude/"); }

function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function render() {
  const t = DATA.tasks[state.task];
  const step = t.steps[state.step];
  const blind = $("blind").checked, pkgonly = $("pkgonly").checked;
  $("steps").innerHTML = t.steps.map((s, i) =>
    `<button type="button" data-i="${i}" aria-pressed="${i === state.step}">段 ${s.n}${s.pr ? ` · #${s.pr}` : ""}${s.stage === 2 ? " · 段階2" : ""}</button>`).join("");
  $("steptitle").innerHTML = `${esc(step.title || `段 ${step.n}`)}<span class="tag">${step.stage === 2 ? "段階2（どの群も A と同じ条件）" : "段階1（各群の条件）"}</span>`;
  let runs = step.runs.slice();
  if (blind) runs.sort((a, b) => hash(t.id + step.n + a.arm + a.rep) - hash(t.id + step.n + b.arm + b.rep));
  $("cols").innerHTML = runs.map((r, i) => column(r, i, blind, pkgonly, t.package)).join("") ||
    `<p class="empty">この段の結果はまだない。</p>`;
}

function column(r, i, blind, pkgonly, pkg) {
  const name = blind ? `コード ${i + 1}` : `${ARM[r.arm] || r.arm} · ${r.rep}回目`;
  let files = parseDiff(r.diff);
  if (!$("whole").checked) files = files.map((f) => ({ ...f, lines: aroundChanges(f.lines, 3) }));
  if (blind) {
    files = files.filter((f) => !isTool(f.path)).map((f) => {
      const lines = f.lines.filter((l) => !/^[+\- ]\s*\/\/declscope:/.test(l));
      return { ...f, lines: lines.map((l) => l.replace(/\s*\/\/declscope:\S+(?:\s\/\/.*)?$/, "")) };
    });
  }
  const inPkg = (p) => !pkg || p === pkg || p.startsWith(pkg + "/");
  const shown = pkgonly ? files.filter((f) => inPkg(f.path)) : files;
  const hidden = files.length - shown.length;
  const chips = [];
  if (r.success === true) chips.push(`<span class="chip ok">成功</span>`);
  else if (r.success === false) chips.push(`<span class="chip bad">失敗${r.failed && r.failed.length ? `（${r.failed.length}件）` : ""}</span>`);
  if (r.tokens != null) chips.push(`<span class="chip">${(r.tokens / 1000).toFixed(0)}k トークン</span>`);
  if (r.turns != null) chips.push(`<span class="chip">${r.turns} ターン</span>`);
  if (r.files != null) chips.push(`<span class="chip">${r.files} ファイル · ${r.lines} 行</span>`);
  if (!blind && r.directives) chips.push(`<span class="chip">ディレクティブ ${r.directives}</span>`);
  if (r.renamed) chips.push(`<span class="chip warn">名前合わせあり${r.no_counterpart.length ? `・対応なし ${r.no_counterpart.length}` : ""}</span>`);
  if (r.audit_ok === false) chips.push(`<span class="chip bad">監査で違反</span>`);
  const body = shown.map((f) => `
    <details class="file" open>
      <summary><span class="path">${esc(f.path)}</span><span class="n"><span class="plus">+${f.plus}</span> <span class="minus">−${f.minus}</span></span></summary>
      <div class="diff">${numbered(f.lines)}</div>
    </details>`).join("") || `<p class="empty">差分なし</p>`;
  const notes = [];
  if (hidden) notes.push(`package の外の ${hidden} ファイルを隠している。`);
  if (r.cut) notes.push("差分が長いので途中で切った。");
  return `<section class="col" aria-label="${esc(name)}">
    <div class="colhead"><div class="name">${esc(name)}</div><div class="chips">${chips.join("")}</div></div>
    ${body}${notes.length ? `<p class="note">${notes.join(" ")}</p>` : ""}
  </section>`;
}

function init() {
  if (!DATA || !DATA.tasks.length) { $("cols").innerHTML = `<p class="empty">結果はまだない。</p>`; return; }
  $("task").innerHTML = DATA.tasks.map((t, i) => `<option value="${i}">${esc(t.id)}</option>`).join("");
  $("task").addEventListener("change", (e) => { state.task = +e.target.value; state.step = 0; render(); });
  $("steps").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { state.step = +b.dataset.i; render(); } });
  $("blind").addEventListener("change", render);
  $("pkgonly").addEventListener("change", render);
  $("whole").addEventListener("change", render);
  render();
}
init();
</script>
