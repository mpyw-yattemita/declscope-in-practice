m spans\n \t// within its retention period.\n \tGetServices(ctx context.Context) ([]string, error)\n \n \t// GetOperations returns all operation names for a given service\n \t// known to the backend from spans within its retention period.\n \tGetOperations(ctx context.Context, query OperationQueryParams) ([]Operation, error)\n \n \t// FindTraces returns an iterator that retrieves traces matching query parameters.\n \t// The iterator is single-use: once consumed, it cannot be used again.\n \t//\n \t// The chunking rules is the same as for GetTraces.\n \t//\n \t// If no matching traces are found, the function returns an empty iterator.\n \t// If an error is encountered, the iterator returns the error and stops.\n \t//\n \t// There's currently an implementation-dependent ambiguity whether all query filters\n \t// (such as multiple tags) must apply to the same span within a trace, or can be satisfied\n \t// by different spans.\n \tFindTraces(ctx context.Context, query TraceQueryParams) iter.Seq2[[]ptrace.Traces, error]\n \n \t// FindTraceIDs returns an iterator that retrieves IDs of traces matching query parameters.\n \t// The iterator is single-use: once consumed, it cannot be used again.\n \t//\n \t// If no matching traces are found, the function returns an empty iterator.\n \t// If an error is encountered, the iterator returns the error and stops.\n \t//\n \t// This function behaves identically to FindTraces, except that it returns only the list\n \t// of matching trace IDs. This is useful in some contexts, such as batch jobs, where a\n \t// large list of trace IDs may be queried first and then the full traces are loaded\n \t// in batches.\n \tFindTraceIDs(ctx context.Context, query TraceQueryParams) iter.Seq2[[]FoundTraceID, error]\n \n \t// FindTraceSummaries returns an iterator over lightweight summaries of the traces\n \t// matching the query parameters (the metadata shown in search-result lists). The\n \t// iterator is single-use: once consumed, it cannot be used again.\n \t//\n \t// Backends that can compute summaries natively (e.g. via a storage-side aggregation)\n \t// should do so. Backends that cannot must yield errors.ErrUnsupported (wrapped with\n \t// %w) as the first error, before any batch; the caller then falls back to FindTraces\n \t// plus client-side aggregation. Such backends can embed UnsupportedTraceSummaries to\n \t// get this behavior for free.\n \t//\n \t// The iterator streams result batches; each yielded batch may contain one or more\n \t// summaries, and implementations may yield incrementally rather than buffering all\n \t// results first.\n \tFindTraceSummaries(ctx context.Context, query TraceQueryParams) iter.Seq2[[]TraceSummary, error]\n+\n+\t// SearchCapabilities reports how this reader's search methods behave.\n+\t//\n+\t// A reader whose backend cannot be asked returns an error that wraps\n+\t// errors.ErrUnsupported, rather than a value a caller might trust. The\n+\t// zero value with a nil error means the reader declares no capability.\n+\t//\n+\t// A Reader that wraps another Reader must forward this call to it.\n+\tSearchCapabilities(ctx context.Context) (SearchCapabilities, error)\n }\n \n // GetTraceParams contains single-trace parameters for a GetTraces request.\n // Some storage backends (e.g. Tempo) perform GetTraces much more efficiently\n // if they know the approximate time range of the trace.\n type GetTraceParams struct {\n \t// TraceID is the ID of the trace to retrieve. Required.\n \tTraceID pcommon.TraceID\n \t// Start of the time interval to search for trace ID. Optional.\n \tStart time.Time\n \t// End of the time interval to search for trace ID. Optional.\n \tEnd time.Time\n }\n \n // TraceQueryParams contains query parameters to find traces. For a detailed\n // definition of each field in this message, refer to `TraceQueryParameters` in `jaeger.api_v3`\n // (https://github.com/jaegertracing/jaeger-idl/blob/main/proto/api_v3/query_service.proto).\n type TraceQueryParams struct {\n \tServiceName   string\n \tOperationName string\n \t// Attributes must initialized with pcommon.NewMap() before use.\n \tAttributes   pcommon.Map\n \tStartTimeMin time.Time\n \tStartTimeMax time.Time\n \tDurationMin  time.Duration\n \tDurationMax  time.Duration\n \tSearchDepth  int\n }\n \n // FoundTraceID is a wrapper around trace ID returned from FindTraceIDs\n // with an optional time range that may be used in GetTraces calls.\n //\n // The time range is provided as an optimization hint for some storage backends\n // that can perform more efficient queries when they know the approximate time range.\n // The value should not be used for precise time-based filtering or assumptions.\n // It is meant as a rough boundary and may not be populated in all cases.\n type FoundTraceID struct {\n \tTraceID pcommon.TraceID\n \tStart   time.Time\n \tEnd     time.Time\n }\n \n // OperationQueryParams contains parameters of query operations, empty spanKind means get operations for all kinds of span.\n type OperationQueryParams struct {\n \tServiceName string\n \tSpanKind    string\n }\n \n // Operation contains operation name and span kind\n type Operation struct {\n \tName     string\n \tSpanKind string\n }\ndiff --git a/internal/storage/v2/api/tracestore/search_capabilities.go b/internal/storage/v2/api/tracestore/search_capabilities.go\nnew file mode 100644\nindex 0000000..73f6ca0\n--- /dev/null\n+++ b/internal/storage/v2/api/tracestore/search_capabilities.go\n@@ -0,0 +1,17 @@\n+// Copyright (c) 2026 The Jaeger Authors.\n+// SPDX-License-Identifier: Apache-2.0\n+\n+package tracestore\n+\n+// SearchCapabilities describes how a Reader's search methods behave where\n+// backends differ.\n+//\n+// The zero value describes the least capable reader: every field is false.\n+// A capability added later is a new field, so a reader that does not set it\n+// declares that it lacks it.\n+type SearchCapabilities struct {\n+\t// WithoutServiceName is true when FindTraces, FindTraceID orward this call to it.\n \tSearchCapabilities(ctx context.Context) (SearchCapabilities, error)\n }\n \n // GetTraceParams contains single-trace parameters for a GetTraces request.\n // Some storage backends (e.g. Tempo) perform GetTraces much more efficiently\n // if they know the approximate time range of the trace.\n type GetTraceParams struct {\n \t// TraceID is the ID of the trace to retrieve. Required.\n \tTraceID pcommon.TraceID\n \t// Start of the time interval to search for trace ID. Optional.\n \tStart time.Time\n \t// End of the time interval to search for trace ID. Optional.\n \tEnd time.Time\n }\n \n // TraceQueryParams contains query parameters to find traces. For a detailed\n // definition of each field in this message, refer to `TraceQueryParameters` in `jaeger.api_v3`\n // (https://github.com/jaegertracing/jaeger-idl/blob/main/proto/api_v3/query_service.proto).\n type TraceQueryParams struct {\n \tServiceName   string\n \tOperationName string\n \t// Attributes must initialized with pcommon.NewMap() before use.\n \tAttributes   pcommon.Map\n \tStartTimeMin time.Time\n \tStartTimeMax time.Time\n \tDurationMin  time.Duration\n \tDurationMax  time.Duration\n \tSearchDepth  int\n+\n+\t// Filter is the structured query filter. It is mutually exclusive with the\n+\t// predicate fields ServiceName, OperationName, Attributes and the duration\n+\t// bounds, so a reader sees one filtering model, not a mix of the two.\n+\tFilter *expression.Call\n }\n \n // FoundTraceID is a wrapper around trace ID returned from FindTraceIDs\n // with an optional time range that may be used in GetTraces calls.\n //\n // The time range is provided as an optimization hint for some storage backends\n // that can perform more efficient queries when they know the approximate time range.\n // The value should not be used for precise time-based filtering or assumptions.\n // It is meant as a rough boundary and may not be populated in all cases.\n type FoundTraceID struct {\n \tTraceID tinue\n+\t\t}\n+\t\tif level, ok := referenceLevel(arg); ok && !c.SupportsLevel(level) {\n+\t\t\treturn fmt.Errorf(\"%w: it does not index the %q level\", ErrFilterUnsupported, level)\n+\t\t}\n+\t}\n+\treturn nil\n+}\n+\n+// referenceLevel returns the level a reference names. Its second result is\n+// false for anything that is not a reference, such as a constant.\n+func referenceLevel(e expression.Expression) (expression.Level, bool) {\n+\tswitch ref := e.(type) {\n+\tcase *expression.AttributeRef:\n+\t\tif ref != nil {\n+\t\t\treturn ref.Level, true\n+\t\t}\n+\tcase *expression.FieldRef:\n+\t\tif ref != nil {\n+\t\t\treturn ref.Level, true\n+\t\t}\n+\tcase *expression.NestedRef:\n+\t\tif ref != nil {\n+\t\t\treturn ref.Level, true\n+\t\t}\n+\t}\n+\treturn \"\", false\n+}\ndiff --git a/internal/storage/v2/api/tracestore/filter_test.go b/internal/storage/v2/api/tracestore/filter_test.go\nindex f2b06d9..6c0eb5f 100644\n--- a/internal/storage/v2/api/tracestore/filter_test.go\n+++ b/internal/storage/v2/api/tracestore/filter_test.go\n@@ -1,78 +1,169 @@\n // Copyright (c) 2026 The Jaeger Authors.\n // SPDX-License-Identifier: Apache-2.0\n \n package tracestore\n \n import (\n \t\"testing\"\n \n \texpression \"github.com/jaegertracing/jaeger-idl/query/expression/v1\"\n \t\"github.com/stretchr/testify/assert\"\n+\t\"github.com/stretchr/testify/require\"\n )\n \n func TestFilterCapabilitiesIsEmpty(t *testing.T) {\n \ttests := []struct {\n \t\tname  string\n \t\tcaps  *FilterCapabilities\n \t\tempty bool\n \t}{\n \t\t{name: \"nil\", caps: nil, empty: true},\n \t\t{name: \"zero value\", caps: &FilterCapabilities{}, empty: true},\n \t\t{\n \t\t\tname: \"empty non-nil slices\",\n \t\t\tcaps: &FilterCapabilities{\n \t\t\t\tLevels:    []expression.Level{},\n \t\t\t\tOperators: []expression.Operator{},\n \t\t\t},\n \t\t\tempty: true,\n \t\t},\n \t\t{\n \t\t\tname:  \"one level\",\n \t\t\tcaps:  &FilterCapabilities{Levels: []expression.Level{expression.LevelSpan}},\n \t\t\tempty: f aegertracing/jaeger-idl/query/expression/v1\"\n+\t\"go.opentelemetry.io/collector/pdata/pcommon\"\n+)\n+\n+// A query expresses its predicates in one of two models: the scalar fields\n+// ServiceName, OperationName, Attributes and the duration bounds, which every\n+// backend serves, or Filter, which a Reader serves only as far as its\n+// SearchCapabilities.Filter declares. The methods below decide which model a\n+// Reader receives and convert between the two, so that every caller gets the\n+// same answer instead of each backend's own.\n+\n+// EnsureFilterStandsAlone rejects a query that carries both a filter and one\n+// of the predicate fields the filter replaces. Mixing the two would leave each\n+// backend to decide how they combine, so the query is refused instead. An\n+// empty Attributes map is not a predicate.\n+func (q TraceQueryParams) EnsureFilterStandsAlone() error {\n+\tif q.Filter == nil {\n+\t\treturn nil\n+\t}\n+\tvar conflicts []string\n+\tif q.ServiceName != \"\" {\n+\t\tconflicts = append(conflicts, \"service_name\")\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tconflicts = append(conflicts, \"operation_name\")\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tconflicts = append(conflicts, \"duration_min\")\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tconflicts = append(conflicts, \"duration_max\")\n+\t}\n+\tif attributesLen(q.Attributes) > 0 {\n+\t\tconflicts = append(conflicts, \"attributes\")\n+\t}\n+\tif len(conflicts) == 0 {\n+\t\treturn nil\n+\t}\n+\treturn fmt.Errorf(\"%w: a query with a filter cannot also set %v\", ErrFilterInvalid, conflicts)\n+}\n+\n+// ForCapabilities gives the Reader whichever of the two filtering models it\n+// declared it can evaluate. A Reader that declares no filter support receives\n+// the filter expressed in the legacy fields, or a refusal if those cannot\n+// express it. Any other Reader receives the filter as it is, or a refusal for\n+// the first part of it the Reader did not declare.\n+func (q TraceQueryParams) ForCapabilities(caps SearchCapabilities) (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\tif caps.Filter.IsEmpty() {\n+\t\treturn q.ToLegacyShape()\n+\t}\n+\treturn q, caps.Filter.EnsureSupported(q.Filter)\n+}\n+\n+// ToFilterShape expresses q's scalar predicate fields as filter predicates.\n+// It cannot fail, because each legacy field has an exact filter equivalent.\n+// A query that already has a Filter is returned as it is.\n+//\n+// The converted fields are cleared, and the predicates are conjoined in the\n+// order service, operation, attributes, minimum and maximum duration. A query\n+// with no predicate gets a nil Filter, and one with a single predicate gets\n+// that predicate without a conjunction around it.\n+func (q TraceQueryParams) ToFilterShape() TraceQueryParams {\n+\tif q.Filter != nil {\n+\t\treturn q\n+\t}\n+\tvar predicates []*expression.Call\n+\tif q.ServiceName != \"\" {\n+\t\tpredicates = append(predicates, eq(serviceField(), &expression.StringValue{Value: q.ServiceName}))\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tpredicates = append(predicates, eq(operationField(), &expression.StringValue{Value: q.OperationName}))\n+\t}\n+\tif attributesLen(q.Attributes) > 0 {\n+\t\tq.Attributes.Range(func(key string, value pcommon.Value) bool {\n+\t\t\tpredicates = append(predicates, eq(&expression.AttributeRef{Key: key}, &expression.AnyValue{Value: value.AsString()}))\n+\t\t\treturn true\n+\t\t})\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tpredicates = append(predicates, durationBound(expression.OpGte, q.DurationMin))\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tpredicates = append(predicates, durationBound(expression.OpLte, q.DurationMax))\n+\t}\n+\n+\tq.ServiceName = \"\"\n+\tq.OperationName = \"\"\n+\tq.Attributes = pcommon.NewMap()\n+\tq.DurationMin = 0\n+\tq.DurationMax = 0\n+\tq.Filter = conjoin(predicates)\n+\treturn q\n+}\n+\n+// conjoin joins predicates with OpAnd, using a conjunction only when there is\n+// something to conjoin is a conjunction of one predicate.\n+func flattenConjunction(call *expression.Call, into []*expression.Call, depth int) ([]*expression.Call, error) {\n+\tif depth > expression.MaxNestingDepth {\n+\t\treturn nil, fmt.Errorf(\"%w: %w\", ErrFilterInvalid, expression.ErrTooDeeplyNested)\n+\t}\n+\tif call.Op != expression.OpAnd {\n+\t\treturn append(into, call), nil\n+\t}\n+\tif len(call.Args) == 0 {\n+\t\t// Dropping an empty conjunction would answer with every trace in the time\n+\t\t// range, which is not what anyone who sent one meant.\n+\t\treturn nil, fmt.Errorf(\"%w: operator %q takes at least two arguments\", ErrFilterInvalid, expression.OpAnd)\n+\t}\n+\tfor _, arg := range call.Args {\n+\t\tnested, ok := arg.(*expression.Call)\n+\t\tif !ok || nested == nil {\n+\t\t\treturn nil, fmt.Errorf(\"%w: it serves a conjunction of predicates only\", ErrFilterUnsupported)\n+\t\t}\n+\t\tvar err error\n+\t\tif into, err = flattenConjunction(nested, into, depth+1); err != nil {\n+\t\t\treturn nil, err\n+\t\t}\n+\t}\n+\treturn into, nil\n+}\n+\n+// legacyFields collects the scalar predicate fields as a filter's conjuncts\n+// are converted. written names every field set so far, so that a second\n+// predicate on one is refused instead of overwriting the first.\n+type legacyFields struct {\n+\tserviceName   string\n+\toperationName string\n+\tattributes    pcommon.Map\n+\tdurationMin   time.Duration\n+\tdurationMax   time.Duration\n+\twritten       map[string]bool\n+}\n+\n+// Keys of legacyFields.written for the fields that are not attributes. They\n+// cannot collide with an attribute key, which is written as \"attribute:<key>\".\n+const (\n+\twrittenService     = \"field:service\"\n+\twrittenOperation   = \"field:operation\"\n+\twrittenDurationMin = \"field:duration_min\"\n+\twrittenDurationMax = \"field:duration_max\"\n+)\n+\n+// add converts one conjunct into the field it sets.\n+func (l *legacyFields) add(call *expression.Call) error {\n+\tswitch call.Op {\n+\tcase expression.OpOr, expression.OpNot, expression.OpExists:\n+\t\treturn errUnsupportedOperator(call.Op)\n+\t}\n+\tif len(call.Args) != 2 {\n+\t\treturn errUnsupportedOperator(call.Op)\n+\t}\n+\tswitch ref := call.Args[0].(type) {\n+\tcase *expression.AttributeRef:\n+\t\tif ref != nil {\n+\t\t\treturn l.addAttribute(call.Op, ref, call.Args[1])\n+\t\t}\n+\tcase *expression.FieldRef:\n+\t\tif ref != nil {\n+\t\t\treturn l.addField(call.Op, ref, call.Args[1])\n+\t\t}\n+\t}\n+\treturn fmt.Errorf(\"%w: it compares a reference against a constant only\", ErrFilterUnsupported)\n+}\n+\n+// addAttribute converts equality on an attribute into a tag. A tag is matched\n+// at the span, resource and event levels alike, so a predicate naming one of\n+// those levels widens to it.\n+func (l *legacyFields) addAttribute(op expression.Operator, ref *expression.AttributeRef, operand expression.Expression) error {\n+\tswitch ref.Level {\n+\tcase \"\", expression.LevelSpan, expression.LevelResource, expression.LevelEvent:\n+\tdefault:\n+\t\treturn fmt.Errorf(\"%w: it does not index the %q level\", ErrFilterUnsupported, ref.Level)\n+\t}\n+\tif op != expression.OpEq {\n+\t\treturn errUnsupportedOperatorOn(op, ref.Key)\n+\t}\n+\tvalue, err := stringOperand(ref.Key, operand)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif err := l.write(\"attribute:\"+ref.Key, ref.Key); err != nil {\n+\t\treturn err\n+\t}\n+\tl.attributes.PutStr(ref.Key, value)\n+\treturn nil\n+}\n+\n+// addField converts a predicate on one of the three built-in fields the legacy\n+// shape has a field for.\n+func (l *legacyFields) addField(op expression.Operator, ref *expression.FieldRef, operand expression.Expression) error {\n+\tswitch {\n+\tcase ref.Level == expression.LevelResource && ref.Name == expression.ResourceFieldService:\n+\t\treturn l.addString(op, ref.Name, operand, writtenService, &l.serviceName)\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldName:\n+\t\treturn l.addString(op, ref.Name, operand, writtenOperation, &l.operationName)\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldDuration:\n+\t\treturn l.addDuration(op, ref.Name, operand)\n+\tdefault:\n+\t\treturn fmt.Errorf(\"%w: it does not support the built-in field %q of the %q level\",\n+\t\t\tErrFilterUnsupported, ref.Name, ref.Level)\n+\t}\n+}\n+\n+// addString converts equality on a string field into the field that holds it.\n+func (l *legacyFields) addString(\n+\top expression.Operator, name string, operand expression.Expression, key string, field *string,\n+) error {\n+\tif op != expression.OpEq {\n+\t\treturn errUnsupportedOperatorOn(op, name)\n+\t}\n+\tvalue, err := stringOperand(name, operand)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif err := l.write(key, name); err != nil {\n+\t\treturn err\n+\t}\n+\t*field = value\n+\treturn nil\n+}\n+\n+// addDuration converts an inclusive bound on the span duration into\n+// DurationMin or DurationMax.\n+func (l *legacyFields) addDuration(op expression.Operator, name string, operand expression.Expression) error {\n+\tvar key string\n+\tvar field *time.Duration\n+\tswitch op {\n+\tcase expression.OpGte:\n+\t\tkey, field = writtenDurationMin, &l.durationMin\n+\tcase expression.OpLte:\n+\t\tkey, field = writtenDurationMax, &l.durationMax\n+\tdefault:\n+\t\treturn errUnsupportedOperatorOn(op, name)\n+\t}\n+\tswitch value := operand.(type) {\n+\tcase *expression.DurationValue:\n+\t\tif value == nil {\n+\t\t\tbreak\n+\t\t}\n+\t\tif err := l.write(key, name); err != nil {\n+\t\t\treturn err\n+\t\t}\n+\t\t*field = value.Value\n+\t\treturn nil\n+\tcase *expression.AnyValue:\n+\t\tif value == nil {\n+\t\t\tbreak\n+\t\t}\n+\t\t// Finalizing a filter reads such a constant as a duration, so one that\n+\t\t// is still untyped reached here without being finalized.\n+\t\treturn fmt.Errorf(\"%w: the bound %q on %q was never read as a duration\", ErrFilterInvalid, value.Value, name)\n+\t}\n+\treturn fmt.Errorf(\"%w: it compares %q against a duration such as \\\"2s\\\" only\", ErrFilterUnsupported, name)\n+}\n+\n+// write records that a field is set, and refuses a second predicate on it.\n+func (l *legacyFields) write(key, name string) error {\n+\tif l.written[key] {\n+\t\treturn fmt.Errorf(\"%w: it takes only one predicate on %q\", ErrFilterUnsupported, name)\n+\t}\n+\tl.written[key] = true\n+\treturn nil\n+}\n+\n+// stringOperand returns the text of a string or untyped constant, which is all\n+// a legacy field can hold.\n+func stringOperand(name string, operand expression.Expression) (string, error) {\n+\tswitch value := operand.(type) {\n+\tcase *expression.StringValue:\n+\t\tif value != nil {\n+\t\t\treturn value.Value, nil\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif value != nil {\n+\t\t\treturn value.Value, nil\n+\t\t}\n+\t}\n+\treturn \"\", fmt.Errorf(\"%w: it compares %q against a string constant only\", ErrFilterUnsupported, name)\n+}\n+\n+func errUnsupportedOperator(op expression.Operator) error {\n+\treturn fmt.Errorf(\"%w: it does not support the operator %q\", ErrFilterUnsupported, op)\n+}\n+\n+func errUnsupportedOperatorOn(op expression.Operator, name string) error {\n+\treturn fmt.Errorf(\"%w: it does not support the operator %q on %q\", ErrFilterUnsupported, op, name)\n+}\n+\n+func serviceField() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelResource, Name: expression.ResourceFieldService}\n+}\n+\n+func operationField() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldName}\n+}\n+\n+func durationBound(op expression.Operator, bound time.Duration) *expression.Call {\n+\treturn &expression.Call{\n+\t\tOp: op,\n+\t\tArgs: []expression.Expression{\n+\t\t\t&expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldDuration},\n+\t\t\t&expression.DurationValue{Value: bound},\n+\t\t},\n+\t}\n+}\n+\n+func eq(left, right expression.Expression) *expression.Call {\n+\treturn &e const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ARM = { A: "A: なし", P: "P: プロンプト", G: "G: ガードレール" };
const state = { task: 0, step: 0 };

function parseDiff(text) {
  const files = [];
  let cur = null;
  for (const line of text.split("\n")) {
    const m = /^diff --git a\/(.*?) b\/(.*)$/.exec(line);
    if (m) { cur = { path: m[2], lines: [], plus: 0, minus: 0 }; files.push(cur); continue; }
    if (!cur || /^(index |--- |\+\+\+ |new file mode|deleted file mode|similarity |rename )/.test(line)) continue;
    cur.lines.push(line);
    if (line.startsWith("+")) cur.plus++; else if (line.startsWith("-")) cur.minus++;
  }
  return files;
}

// Keep each change with `ctx` lines around it; mark the gaps with a hunk line.
function aroundChanges(lines, ctx) {
  const keep = new Array(lines.length).fill(false);
  lines.forEach((l, i) => {
    if (l.startsWith("+") || l.startsWith("-")) for (let j = Math.max(0, i - ctx); j <= Math.min(lines.length - 1, i + ctx); j++) keep[j] = true;
    if (l.startsWith("@@")) keep[i] = false;
  });
  const out = [];
  let skipped = 0;
  lines.forEach((l, i) => {
    if (l.startsWith("@@")) return;
    if (keep[i]) { if (skipped) { out.push(`@@ ${skipped} 行省略 @@`); skipped = 0; } out.push(l); } else skipped++;
  });
  if (skipped) out.push(`@@ ${skipped} 行省略 @@`);
  return out;
}

// Render lines with the line number in the new file, taken from each hunk header.
function numbered(lines) {
  let n = 0;
  return lines.map((l) => {
    const h = /^@@ -\d+(?:,\d+)? \+(\d+)/.exec(l);
    if (h) { n = +h[1] - 1; return `<div class="h"><span class="ln"></span>${esc(l)}</div>`; }
    if (l.startsWith("@@")) return `<div class="h"><span class="ln"></span>${esc(l)}</div>`;
    const cls = l.startsWith("+") ? "a" : l.startsWith("-") ? "d" : "";
    const ln = l.startsWith("-") ? "" : String(++n);
    return `<div class="${cls}"><span class="ln">${ln}</span>${esc(l) || " "}</div>`;
  }).join("");
}

function isTool(path) { return /(^|\/)\.declscope-baseline\.yaml$/.test(path) || path.startsWith(".claude/"); }

function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function render() {
  const t = DATA.tasks[state.task];
  const step = t.steps[state.step];
  const blind = $("blind").checked, pkgonly = $("pkgonly").checked;
  $("steps").innerHTML = t.steps.map((s, i) =>
    `<button type="button" data-i="${i}" aria-pressed="${i === state.step}">段 ${s.n}${s.pr ? ` · #${s.pr}` : ""}${s.stage === 2 ? " · 段階2" : ""}</button>`).join("");
  $("steptitle").innerHTML = `${esc(step.title || `段 ${step.n}`)}<span class="tag">${step.stage === 2 ? "段階2（どの群も A と同じ条件）" : "段階1（各群の条件）"}</span>`;
  let runs = step.runs.slice();
  if (blind) runs.sort((a, b) => hash(t.id + step.n + a.arm + a.rep) - hash(t.id + step.n + b.arm + b.rep));
  $("cols").innerHTML = runs.map((r, i) => column(r, i, blind, pkgonly, t.package)).join("") ||
    `<p class="empty">この段の結果はまだない。</p>`;
}

function column(r, i, blind, pkgonly, pkg) {
  const name = blind ? `コード ${i + 1}` : `${ARM[r.arm] || r.arm} · ${r.rep}回目`;
  let files = parseDiff(r.diff);
  if (!$("whole").checked) files = files.map((f) => ({ ...f, lines: aroundChanges(f.lines, 3) }));
  if (blind) {
    files = files.filter((f) => !isTool(f.path)).map((f) => {
      const lines = f.lines.filter((l) => !/^[+\- ]\s*\/\/declscope:/.test(l));
      return { ...f, lines: lines.map((l) => l.replace(/\s*\/\/declscope:\S+(?:\s\/\/.*)?$/, "")) };
    });
  }
  const inPkg = (p) => !pkg || p === pkg || p.startsWith(pkg + "/");
  const shown = pkgonly ? files.filter((f) => inPkg(f.path)) : files;
  const hidden = files.length - shown.length;
  const chips = [];
  if (r.success === true) chips.push(`<span class="chip ok">成功</span>`);
  else if (r.success === false) chips.push(`<span class="chip bad">失敗${r.failed && r.failed.length ? `（${r.failed.length}件）` : ""}</span>`);
  if (r.tokens != null) chips.push(`<span class="chip">${(r.tokens / 1000).toFixed(0)}k トークン</span>`);
  if (r.turns != null) chips.push(`<span class="chip">${r.turns} ターン</span>`);
  if (r.files != null) chips.push(`<span class="chip">${r.files} ファイル · ${r.lines} 行</span>`);
  if (!blind && r.directives) chips.push(`<span class="chip">ディレクティブ ${r.directives}</span>`);
  if (r.renamed) chips.push(`<span class="chip warn">名前合わせあり${r.no_counterpart.length ? `・対応なし ${r.no_counterpart.length}` : ""}</span>`);
  if (r.audit_ok === false) chips.push(`<span class="chip bad">監査で違反</span>`);
  const body = shown.map((f) => `
    <details class="file" open>
      <summary><span class="path">${esc(f.path)}</span><span class="n"><span class="plus">+${f.plus}</span> <span class="minus">−${f.minus}</span></span></summary>
      <div class="diff">${numbered(f.lines)}</div>
    </details>`).join("") || `<p class="empty">差分なし</p>`;
  const notes = [];
  if (hidden) notes.push(`package の外の ${hidden} ファイルを隠している。`);
  if (r.cut) notes.push("差分が長いので途中で切った。");
  return `<section class="col" aria-label="${esc(name)}">
    <div class="colhead"><div class="name">${esc(name)}</div><div class="chips">${chips.join("")}</div></div>
    ${body}${notes.length ? `<p class="note">${notes.join(" ")}</p>` : ""}
  </section>`;
}

function init() {
  if (!DATA || !DATA.tasks.length) { $("cols").innerHTML = `<p class="empty">結果はまだない。</p>`; return; }
  $("task").innerHTML = DATA.tasks.map((t, i) => `<option value="${i}">${esc(t.id)}</option>`).join("");
  $("task").addEventListener("change", (e) => { state.task = +e.target.value; state.step = 0; render(); });
  $("steps").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { state.step = +b.dataset.i; render(); } });
  $("blind").addEventListener("change", render);
  $("pkgonly").addEventListener("change", render);
  $("whole").addEventListener("change", render);
  render();
}
init();
</script>
</body>
</html>
