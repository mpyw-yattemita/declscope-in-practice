function parseDiff(text) {
  const files = [];
  let cur = null;
  for (const line of text.split("\n")) {
    const m = /^diff --git a\/(.*?) b\/(.*)$/.exec(line);
    if (m) { cur = { path: m[2], lines: [], plus: 0, minus: 0 }; files.push(cur); continue; }
    if (!cur || /^(index |--- |\+\+\+ |new file mode|deleted file mode|similarity |rename )/.test(line)) continue;
    cur.lines.push(line);
    if (line.startsWith("+")) cur.plus++; else if (line.startsWith("-")) cur.minus++;
  }
  return files;
}

// Keep each change with `ctx` lines around it; mark the gaps with a hunk line.
function aroundChanges(lines, ctx) {
  const keep = new Array(lines.length).fill(false);
  lines.forEach((l, i) => {
    if (l.startsWith("+") || l.startsWith("-")) for (let j = Math.max(0, i - ctx); j <= Math.min(lines.length - 1, i + ctx); j++) keep[j] = true;
    if (l.startsWith("@@")) keep[i] = false;
  });
  const out = [];
  let skipped = 0;
  lines.forEach((l, i) => {
    if (l.startsWith("@@")) return;
    if (keep[i]) { if (skipped) { out.push(`@@ ${skipped} 行省略 @@`); skipped = 0; } out.push(l); } else skipped++;
  });
  if (skipped) out.push(`@@ ${skipped} 行省略 @@`);
  return out;
}

// Render lines with the line number in the new file, taken from each hunk header.
function numbered(lines) {
  let n = 0;
  return lines.map((l) => {
    const h = /^@@ -\d+(?:,\d+)? \+(\d+)/.exec(l);
    if (h) { n = +h[1] - 1; return `<div class="h"><span class="ln"></span>${esc(l)}</div>`; }
    if (l.startsWith("@@")) return `<div class="h"><span class="ln"></span>${esc(l)}</div>`;
    const cls = l.startsWith("+") ? "a" : l.startsWith("-") ? "d" : "";
    const ln = l.startsWith("-") ? "" : String(++n);
    return `<div class="${cls}"><span class="ln">${ln}</span>${esc(l) || " "}</div>`;
  }).join("");
}

function isTool(path) { return /(^|\/)\.declscope-baseline\.yaml$/.test(path) || path.startsWith(".claude/"); }

function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function render() {
  const t = DATA.tasks[state.task];
  const step = t.steps[state.step];
  const blind = $("blind").checked, pkgonly = $("pkgonly").checked;
  $("steps").innerHTML = t.steps.map((s, i) =>
    `<button type="button" data-i="${i}" aria-pressed="${i === state.step}">段 ${s.n}${s.pr ? ` · #${s.pr}` : ""}${s.stage === 2 ? " · 段階2" : ""}</button>`).join("");
  $("steptitle").innerHTML = `${esc(step.title || `段 ${step.n}`)}<span class="tag">${step.stage === 2 ? "段階2（どの群も A と同じ条件）" : "段階1（各群の条件）"}</span>`;
  let runs = step.runs.slice();
  if (blind) runs.sort((a, b) => hash(t.id + step.n + a.arm + a.rep) - hash(t.id + step.n + b.arm + b.rep));
  $("cols").innerHTML = runs.map((r, i) => column(r, i, blind, pkgonly, t.package)).join("") ||
    `<p class="empty">この段の結果はまだない。</p>`;
}

function column(r, i, blind, pkgonly, pkg) {
  const name = blind ? `コード ${i + 1}` : `${ARM[r.arm] || r.arm} · ${r.rep}回目`;
  let files = parseDiff(r.diff);
  if (!$("whole").checked) files = files.map((f) => ({ ...f, lines: aroundChanges(f.lines, 3) }));
  if (blind) {
    files = files.filter((f) => !isTool(f.path)).map((f) => {
      const lines = f.lines.filter((l) => !/^[+\- ]\s*\/\/declscope:/.test(l));
      return { ...f, lines: lines.map((l) => l.replace(/\s*\/\/declscope:\S+(?:\s\/\/.*)?$/, "")) };
    });
  }
  const inPkg = (p) => !pkg || p === pkg || p.startsWith(pkg + "/");
  const shown = pkgonly ? files.filter((f) => inPkg(f.path)) : files;
  const hidden = files.length - shown.length;
  const chips = [];
  if (r.success === true) chips.push(`<span class="chip ok">成功</span>`);
  else if (r.success === false) chips.push(`<span class="chip bad">失敗${r.failed && r.failed.length ? `（${r.failed.length}件）` : ""}</span>`);
  if (r.tokens != null) chips.push(`<span class="chip">${(r.tokens / 1000).toFixed(0)}k トークン</span>`);
  if (r.turns != null) chips.push(`<span class="chip">${r.turns} ターン</span>`);
  if (r.files != null) chips.push(`<span class="chip">${r.files} ファイル · ${r.lines} 行</span>`);
  if (!blind && r.directives) chips.push(`<span class="chip">ディレクティブ ${r.directives}</span>`);
  if (r.renamed) chips.push(`<span class="chip warn">名前合わせあり${r.no_counterpart.length ? `・対応なし ${r.no_counterpart.length}` : ""}</span>`);
  if (r.audit_ok === false) chips.push(`<span class="chip bad">監査で違反</span>`);
  const body = shown.map((f) => `
    <details class="file" open>
      <summary><span class="path">${esc(f.path)}</span><span class="n"><span class="plus">+${f.plus}</span> <span class="minus">−${f.minus}</span></span></summary>
      <div class="diff">${numbered(f.lines)}</div>
    </details>`).join("") || `<p class="empty">差分なし</p>`;
  const notes = [];
  if (hidden) notes.push(`package の外の ${hidden} ファイルを隠している。`);
  if (r.cut) notes.push("差分が長いので途中で切った。");
  return `<section class="col" aria-label="${esc(name)}">
    <div class="colhead"><div class="name">${esc(name)}</div><div class="chips">${chips.join("")}</div></div>
    ${body}${notes.length ? `<p class="note">${notes.join(" ")}</p>` : ""}
  </section>`;
}

function init() {
  if (!DATA || !DATA.tasks.length) { $("cols").innerHTML = `<p class="empty">結果はまだない。</p>`; return; }
  $("task").innerHTML = DATA.tasks.map((t, i) => `<option value="${i}">${esc(t.id)}</option>`).join("");
  $("task").addEventListener("change", (e) => { state.task = +e.target.value; state.step = 0; render(); });
  $("steps").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { state.step = +b.dataset.i; render(); } });
  $("blind").addEventListener("change", render);
  $("pkgonly").addEventListener("change", render);
  $("whole").addEventListener("change", render);
  render();
}
init();
</script>
</body>
</html>
