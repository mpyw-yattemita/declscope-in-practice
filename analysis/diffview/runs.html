own to the backend from spans\n \t// within its retention period.\n \tGetServices(ctx context.Context) ([]string, error)\n \n \t// GetOperations returns all operation names for a given service\n \t// known to the backend from spans within its retention period.\n \tGetOperations(ctx context.Context, query OperationQueryParams) ([]Operation, error)\n \n \t// FindTraces returns an iterator that retrieves traces matching query parameters.\n \t// The iterator is single-use: once consumed, it cannot be used again.\n \t//\n \t// The chunking rules is the same as for GetTraces.\n \t//\n \t// If no matching traces are found, the function returns an empty iterator.\n \t// If an error is encountered, the iterator returns the error and stops.\n \t//\n \t// There's currently an implementation-dependent ambiguity whether all query filters\n \t// (such as multiple tags) must apply to the same span within a trace, or can be satisfied\n \t// by different spans.\n \tFindTraces(ctx context.Context, query TraceQueryParams) iter.Seq2[[]ptrace.Traces, error]\n \n \t// FindTraceIDs returns an iterator that retrieves IDs of traces matching query parameters.\n \t// The iterator is single-use: once consumed, it cannot be used again.\n \t//\n \t// If no matching traces are found, the function returns an empty iterator.\n \t// If an error is encountered, the iterator returns the error and stops.\n \t//\n \t// This function behaves identically to FindTraces, except that it returns only the list\n \t// of matching trace IDs. This is useful in some contexts, such as batch jobs, where a\n \t// large list of trace IDs may be queried first and then the full traces are loaded\n \t// in batches.\n \tFindTraceIDs(ctx context.Context, query TraceQueryParams) iter.Seq2[[]FoundTraceID, error]\n \n \t// FindTraceSummaries returns an iterator over lightweight summaries of the traces\n \t// matching the query parameters (the metadata shown in search-result lists). The\n \t// iterator is single-use: once consumed, it cannot be used again.\n \t//\n \t// Backends that can compute summaries natively (e.g. via a storage-side aggregation)\n \t// should do so. Backends that cannot must yield errors.ErrUnsupported (wrapped with\n \t// %w) as the first error, before any batch; the caller then falls back to FindTraces\n \t// plus client-side aggregation. Such backends can embed UnsupportedTraceSummaries to\n \t// get this behavior for free.\n \t//\n \t// The iterator streams result batches; each yielded batch may contain one or more\n \t// summaries, and implementations may yield incrementally rather than buffering all\n \t// results first.\n \tFindTraceSummaries(ctx context.Context, query TraceQueryParams) iter.Seq2[[]TraceSummary, error]\n \n \t// SearchCapabilities reports how this reader's search methods behave.\n \t//\n \t// A reader that cannot tell, for example because its backend sits behind an\n \t// API that cannot be asked, returns an error that wraps errors.ErrUnsupported\n \t// rather than a value that a caller might trust. The context is there because\n \t// the answer may come over the network.\n \t//\n \t// A Reader that wraps another Reader must forward this call to it, and must\n \t// not answer for it.\n \tSearchCapabilities(ctx context.Context) (SearchCapabilities, error)\n }\n \n // GetTraceParams contains single-trace parameters for a GetTraces request.\n // Some storage backends (e.g. Tempo) perform GetTraces much more efficiently\n // if they know the approximate time range of the trace.\n type GetTraceParams struct {\n \t// TraceID is the ID of the trace to retrieve. Required.\n \tTraceID pcommon.TraceID\n \t// Start of the time interval to search for trace ID. Optional.\n \tStart time.Time\n \t// End of the time interval to search for trace ID. Optional.\n \tEnd time.Time\n }\n \n // TraceQueryParams contains query parameters to find traces. For a detailed\n // definition of each field in this message, refer to `TraceQueryParameters` in `jaeger.api_v3`\n // (https://github.com/jaegertracing/jaeger-idl/blob/main/proto/api_v3/query_service.proto).\n type TraceQueryParams struct {\n \tServiceName   string\n \tOperationName string\n \t// Attributes must initialized with pcommon.NewMap() before use.\n \tAttributes   pcommon.Map\n \tStartTimeMin time.Time\n \tStartTimeMax time.Time\n \tDurationMin  time.Duration\n \tDurationMax  time.Duration\n \tSearchDepth  int\n+\n+\t// Filter is the structured query filter. It is mutually exclusive with the\n+\t// predicate fields ServiceName, OperationName, Attributes and the duration\n+\t// bounds, so a reader sees one filtering model, not a mix of the two.\n+\tFilter *expression.Call\n }\n \n // FoundTraceID is a wrapper around trace ID returned from FindTraceIDs\n // with an optional time range that may be used in GetTraces calls.\n //\n // The time range is provided as an optimization hint for some storage backends\n // that can perform more efficient queries when they know the approximate time range.\n // The value should not be used for precise time-based filtering or assumptions.\n // It is meant as a rough boundary and may not be populated in all cases.\n type FoundTraceID struct {\n \tTraceID pcommon.TraceID\n \tStart   time.Time\n \tEnd     time.Time\n }\n \n // OperationQueryParams contains parameters of query operations, empty spanKind means get operations for all kinds of span.\n type OperationQueryParams struct {\n \tServiceName string\n \tSpanKind    string\n }\n \n // Operation contains operation name and span kind\n type Operation struct {\n \tName     string\n \tSpanKind string\n }\ndiff --git a/internal/storage/v2/api/tracestore/search_capabilities.go b/internal/storage/v2/api/tracestore/search_capabilities.go\nindex b2746d6..70a22bf 100644\n--- a/internal/storage/v2/api/tracestore/search_capabilities.go\n+++ b/internal/storage/v2/api/tracestore/search_capabilities.go\n@@ -1,17 +1,29 @@\n // Copyright (c) 2026 The Jaeger Authors.\n // SPDX-License-Identifier: Apa end's own.\n+\n+// EnsureFilterStandsAlone rejects a query that carries both a filter and one\n+// of the predicate fields the filter replaces.\n+//\n+// The error wraps ErrFilterInvalid and names every conflicting field, because the\n+// query is malformed whatever the backend can serve.\n+func (q TraceQueryParams) EnsureFilterStandsAlone() error {\n+\tif q.Filter == nil {\n+\t\treturn nil\n+\t}\n+\tvar conflicts []string\n+\tif q.ServiceName != \"\" {\n+\t\tconflicts = append(conflicts, \"service_name\")\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tconflicts = append(conflicts, \"operation_name\")\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tconflicts = append(conflicts, \"duration_min\")\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tconflicts = append(conflicts, \"duration_max\")\n+\t}\n+\tif hasAttributes(q.Attributes) {\n+\t\tconflicts = append(conflicts, \"attributes\")\n+\t}\n+\tif len(conflicts) == 0 {\n+\t\treturn nil\n+\t}\n+\treturn fmt.Errorf(\"%w: the filter replaces the predicate fields %v, so a query sets one or the other\",\n+\t\tErrFilterInvalid, conflicts)\n+}\n+\n+// ForCapabilities gives the Reader whichever of the two filtering models it\n+// declared it can evaluate.\n+//\n+// A Reader that declared no filter capabilities receives the filter rewritten into the\n+// legacy predicate fields, or a refusal where they cannot express it. A Reader that declared\n+// some receives the filter as it is, or a refusal naming the first part it did not declare.\n+func (q TraceQueryParams) ForCapabilities(caps SearchCapabilities) (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\tif caps.Filter.IsEmpty() {\n+\t\treturn q.ToLegacyShape()\n+\t}\n+\treturn q, caps.Filter.EnsureSupported(q.Filter)\n+}\n+\n+// EnsureSupported walks the filter and refuses the first predicate the Reader\n+// did not declare it can evaluate.\n+//\n+// Every operator must be listed, and every reference must name a level the Reader\n+// indexes. Constants need no support. The refusal wraps ErrFilterUnsupported.\n+func (c FilterCapabilities) EnsureSupported(filter *expression.Call) error {\n+\tif filter == nil {\n+\t\treturn nil\n+\t}\n+\tif !c.SupportsOperator(filter.Op) {\n+\t\treturn fmt.Errorf(\"%w: it does not support the operator %q\", ErrFilterUnsupported, filter.Op)\n+\t}\n+\tfor _, arg := range filter.Args {\n+\t\tif nested, ok := arg.(*expression.Call); ok {\n+\t\t\tif err := c.EnsureSupported(nested); err != nil {\n+\t\t\t\treturn err\n+\t\t\t}\n+\t\t\tcontinue\n+\t\t}\n+\t\tif level, ok := referenceLevel(arg); ok && !c.SupportsLevel(level) {\n+\t\t\treturn fmt.Errorf(\"%w: it does not index the %q level\", ErrFilterUnsupported, level)\n+\t\t}\n+\t}\n+\treturn nil\n+}\n+\n+// referenceLevel returns the level a reference names. Its second result is false for\n+// anything that is not a reference, such as a constant.\n+func referenceLevel(e expression.Expression) (expression.Level, bool) {\n+\tswitch ref := e.(type) {\n+\tcase *expression.AttributeRef:\n+\t\tif ref != nil {\n+\t\t\treturn ref.Level, true\n+\t\t}\n+\tcase *expression.FieldRef:\n+\t\tif ref != nil {\n+\t\t\treturn ref.Level, true\n+\t\t}\n+\tcase *expression.NestedRef:\n+\t\tif ref != nil {\n+\t\t\treturn ref.Level, true\n+\t\t}\n+\t}\n+\treturn \"\", false\n+}\n+\n+// ToFilterShape expresses q's scalar predicate fields as filter predicates.\n+//\n+// It cannot fail, because each legacy field has an exact filter equivalent. A query\n+// that already has a Filter is returned as it is. The result is already finalized:\n+// it passes expression.ValidateFilter, and expression.ResolveConstants changes nothing.\n+func (q TraceQueryParams) ToFilterShape() TraceQueryParams {\n+\tif q.Filter != nil {\n+\t\treturn q\n+\t}\n+\tvar predicates []expression.Expression\n+\tif q.ServiceName != \"\" {\n+\t\tpredicates = append(predicates, call(expression.OpEq, serviceField(), &expression.StringValue{Value: q.ServiceName}))\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tpredicates = append(predicates, call(expression.OpEq, operationField(), &expression.StringValue{Value: q.OperationName}))\n+\t}\n+\tif hasAttributes(q.Attributes) {\n+\t\tfor key, value := range q.Attributes.All() {\n+\t\t\tpredicates = append(predicates, call(expression.OpEq,\n+\t\t\t\t&expression.AttributeRef{Key: key}, &expression.AnyValue{Value: value.AsString()}))\n+\t\t}\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tpredicates = append(predicates, call(expression.OpGte, durationField(), &expression.DurationValue{Value: q.DurationMin}))\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tpredicates = append(predicates, call(expression.OpLte, durationField(), &expression.DurationValue{Value: q.DurationMax}))\n+\t}\n+\n+\tq.ServiceName = \"\"\n+\tq.OperationName = \"\"\n+\tq.Attributes = pcommon.NewMap()\n+\tq.DurationMin = 0\n+\tq.DurationMax = 0\n+\tswitch len(predicates) {\n+\tcase 0:\n+\t\tq.Filter = nil\n+\tcase 1:\n+\t\tq.Filter = predicates[0].(*expression.Call)\n+\tdefault:\n+\t\tq.Filter = call(expression.OpAnd, predicates...)\n+\t}\n+\treturn q\n+}\n+\n+// ToLegacyShape expresses q's Filter in the scalar predicate fields every\n+// backend serves.\n+//\n+// Only a flat conjunction of the predicates the legacy fields can hold converts; anything\n+// else is refused rather than approximated, with an error wrapping ErrFilterUnsupported (or\n+// ErrFilterInvalid for a filter that was never finalized). On error q is returned as it is.\n+// The result has a new Attributes map, so the caller's own map is not changed.\n+func (q TraceQueryParams) ToLegacyShape() (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\tif err := q.EnsureFilterStandsAlone(); err != nil {\n+\t\treturn q, err\n+\t}\n+\tw := legacyWriter{\n+\t\tquery:   q,\n+\t\tclaimed: make(map[legacySlot]bool),\n+\t}\n+\tw.query.Filter = nil\n+\tw.query.Attributes = pcommon.NewMap()\n+\tfor _, conjunct := range conjuncts(q.Filter, nil) {\n+\t\tif err := w.write(conjunct); err != nil {\n+\t\t\treturn q, err\n+\t\t}\n+\t}\n+\treturn w.query, nil\n+}\n+\n+// conjuncts flattens nested OpAnd calls into the list of their operands, appended to out.\n+// OpAnd is associative, so the flattened list asks the same question.\n+func conjuncts(e expression.Expression, out []expression.Expression) []expression.Expression {\n+\tc, ok := e.(*expression.Call)\n+\tif !ok || c == nil || c.Op != expression.OpAnd {\n+\t\treturn append(out, e)\n+\t}\n+\tfor _, arg := range c.Args {\n+\t\tout = conjuncts(arg, out)\n+\t}\n+\treturn out\n+}\n+\n+// legacySlot identifies one legacy field a predicate writes, so that a second predicate on\n+// the same field is refused rather than silently overwriting the first.\n+type legacySlot struct {\n+\tkind string\n+\tname string\n+}\n+\n+var (\n+\tserviceSlot     = legacySlot{kind: \"service\"}\n+\toperationSlot   = legacySlot{kind: \"operation\"}\n+\tdurationMinSlot = legacySlot{kind: \"duration_min\"}\n+\tdurationMaxSlot = legacySlot{kind: \"duration_max\"}\n+)\n+\n+func attributeSlot(key string) legacySlot {\n+\treturn legacySlot{kind: \"attribute\", name: key}\n+}\n+\n+// legacyWriter writes conjuncts into the legacy fields of query, one predicate at a time.\n+type legacyWriter struct {\n+\tquery   TraceQueryParams\n+\tclaimed map[legacySlot]bool\n+}\n+\n+// write converts one conjunct, or refuses it.\n+func (w *legacyWriter) write(conjunct expression.Expression) error {\n+\tpredicate, ok := conjunct.(*expression.Call)\n+\tif !ok || predicate == nil {\n+\t\treturn fmt.Errorf(\"%w: it serves a conjunction of predicates only\", ErrFilterUnsupported)\n+\t}\n+\tswitch {\n+\tcase predicate.Op == expression.OpOr,\n+\t\tpredicate.Op == expression.OpNot,\n+\t\tpredicate.Op == expression.OpExists,\n+\t\tlen(predicate.Args) != 2:\n+\t\treturn fmt.Errorf(\"%w: it does not support the operator %q\", ErrFilterUnsupported, predicate.Op)\n+\t}\n+\top, subject, value := predicate.Op, predicate.Args[0], predicate.Args[1]\n+\tswitch ref := subject.(type) {\n+\tcase *expression.AttributeRef:\n+\t\tif ref != nil {\n+\t\t\treturn w.writeAttribute(op, ref, value)\n+\t\t}\n+\tcase *expression.FieldRef:\n+\t\tif ref != nil {\n+\t\t\treturn w.writeField(op, ref, value)\n+\t\t}\n+\t}\n+\treturn fmt.Errorf(\"%w: it compares a reference against a constant only\", ErrFilterUnsupported)\n+}\n+\n+// writeAttribute converts an equality on an attribute into a tag. The legacy tags do not\n+// record a level, so a span-, resource- or event-level attribute widens to a plain tag. The\n+// link and scope levels are not searched by tags at all.\n+func (w *legacyWriter) writeAttribute(op expression.Operator, ref *expression.AttributeRef, value expression.Expression) error {\n+\tswitch ref.Level {\n+\tcase \"\", expression.LevelSpan, expression.LevelResource, expression.LevelEvent:\n+\tdefault:\n+\t\treturn fmt.Errorf(\"%w: it does not index the %q level\", ErrFilterUnsupported, ref.Level)\n+\t}\n+\ttext, err := equalsString(op, ref.Key, value)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif err := w.claim(attributeSlot(ref.Key), ref.Key); err != nil {\n+\t\treturn err\n+\t}\n+\tw.query.Attributes.PutStr(ref.Key, text)\n+\treturn nil\n+}\n+\n+// writeField converts a predicate on one of the three built-in fields the legacy fields hold.\n+func (w *legacyWriter) writeField(op expression.Operator, ref *expression.FieldRef, value expression.Expression) error {\n+\tswitch *ref {\n+\tcase *serviceField():\n+\t\ttext, err := equalsString(op, ref.Name, value)\n+\t\tif err != nil {\n+\t\t\treturn err\n+\t\t}\n+\t\tif err := w.claim(serviceSlot, ref.Name); err != nil {\n+\t\t\treturn err\n+\t\t}\n+\t\tw.query.ServiceName = text\n+\t\treturn nil\n+\tcase *operationField():\n+\t\ttext, err := equalsString(op, ref.Name, value)\n+\t\tif err != nil {\n+\t\t\treturn err\n+\t\t}\n+\t\tif err := w.claim(operationSlot, ref.Name); err != nil {\n+\t\t\treturn err\n+\t\t}\n+\t\tw.query.OperationName = text\n+\t\treturn nil\n+\tcase *durationField():\n+\t\treturn w.writeDuration(op, ref.Name, value)\n+\tdefault:\n+\t\treturn fmt.Errorf(\"%w: it does not support the built-in field %q of the %q level\",\n+\t\t\tErrFilterUnsupported, ref.Name, ref.Level)\n+\t}\n+}\n+\n+// writeDuration converts an inclusive bound on the span duration into DurationMin or\n+// DurationMax.\n+func (w *legacyWriter) writeDuration(op expression.Operator, name string, value expression.Expression) error {\n+\tvar slot legacySlot\n+\tvar target *time.Duration\n+\tswitch op {\n+\tcase expression.OpGte:\n+\t\tslot, target = durationMinSlot, &w.query.DurationMin\n+\tcase expression.OpLte:\n+\t\tslot, target = durationMaxSlot, &w.query.DurationMax\n+\tdefault:\n+\t\treturn fmt.Errorf(\"%w: it does not support the operator %q on %q\", ErrFilterUnsupported, op, name)\n+\t}\n+\tswitch bound := value.(type) {\n+\tcase *expression.DurationValue:\n+\t\tif bound != nil {\n+\t\t\tif err := w.claim(slot, name); err != nil {\n+\t\t\t\treturn err\n+\t\t\t}\n+\t\t\t*target = bound.Value\n+\t\t\treturn nil\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif bound != nil {\n+\t\t\treturn fmt.Errorf(\"%w: the bound %q on %q was never read as a duration; finalize the filter first\",\n+\t\t\t\tErrFilterInvalid, bound.Value, name)\n+\t\t}\n+\t}\n+\treturn fmt.Errorf(\"%w: it compares %q against a duration such as \\\"2s\\\" only\", ErrFilterUnsupported, name)\n+}\n+\n+// claim records that a predicate writes slot, and refuses a second one.\n+func (w *legacyWriter) claim(slot legacySlot, name string) error {\n+\tif w.claimed[slot] {\n+\t\treturn fmt.Errorf(\"%w: it takes only one predicate on %q\", ErrFilterUnsupported, name)\n+\t}\n+\tw.claimed[slot] = true\n+\treturn nil\n+}\n+\n+// equalsString returns the text of an equality between a string-valued reference, named name,\n+// and a string or untyped constant.\n+func equalsString(op expression.Operator, name string, value expression.Expression) (string, error) {\n+\tif op != expression.OpEq {\n+\t\treturn \"\", fmt.Errorf(\"%w: it does not support the operator %q on %q\", ErrFilterUnsupported, op, name)\n+\t}\n+\tswitch constant := value.(type) {\n+\tcase *expression.StringValue:\n+\t\tif constant != nil {\n+\t\t\treturn constant.Value, nil\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif constant != nil {\n+\t\t\treturn constant.Value, nil\n+\t\t}\n+\t}\n+\treturn \"\", fmt.Errorf(\"%w: it compares %q against a string constant only\", ErrFilterUnsupported, name)\n+}\n+\n+// hasAttributes reports whether m holds an entry. It is safe to call on the zero value,\n+// which a TraceQueryParams built without pcommon.NewMap() carries.\n+func hasAttributes(m pcommon.Map) bool {\n+\treturn m != (pcommon.Map{}) && m.Len() > 0\n+}\n+\n+func call(op expression.Operator, args ...expression.Expression) *expression.Call {\n+\treturn &expression.Call{Op: op, Args: args}\n+}\n+\n+func serviceField() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelResource, Name: expression.ResourceFieldService}\n+}\n+\n+func operationField() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldName}\n+}\n+\n+func durationField() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldDuration}\n+}\ndiff --git a/internal/storage/v2/api/tracestore/filter_test.go b/internal/storage/v2/api/tracestore/filter_test.go\nnew file mode 100644\nindex 0000000..cdd6c18\n--- /dev/null\n+++ b/internal/storage/v2/api/tracestore/filter_test.go\n@@ -0,0 +1,490 @@\n+// Copyright (c) 2026 The Jaeger Authors.\n+// SPDX-License-Identifier: Apache-2.0\n+\n+package tracestore\n+\n+import (\n+\t\"testing\"\n+\t\"time\"\n+\n+\texpression \"github.com/jaegertracing/jaeger-idl/query/expression/v1\"\n+\t\"github.com/stretchr/testify/assert\"\n+\t\"github.com/stretchr/testify/require\"\n+\t\"go.opentelemetry.io/collector/pdata/pcommon\"\n+)\n+\n+func attr(key string, level expression.Level) *expression.AttributeRef {\n+\treturn &expression.AttributeRef{Key: key, Level: level}\n+}\n+\n+func field(level expression.Level, name string) *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: level, Name: name}\n+}\n+\n+func anyValue(v string) *expression.AnyValue { return &expression.AnyValue{Value: v} }\n+\n+func str(v string) *expression.StringValue { return &expression.StringValue{Value: v} }\n+\n+func dur(d time.Duration) *expression.DurationValue { return &expression.DurationValue{Value: d} }\n+\n+func tagEq(key, value string) *expression.Call {\n+\treturn call(expression.OpEq, attr(key, \"\"), anyValue(value))\n+}\n+\n+func withFilter(filter *expression.Call) TraceQueryParams {\n+\treturn TraceQueryParams{Attributes: pcommon.NewMap(), Filter: filter}\n+}\n+\n+func TestEnsureFilterStandsAlone(t *testing.T) {\n+\tfilter := tagEq(\"a\", \"1\")\n+\ttests := []struct {\n+\t\tname     string\n+\t\tquery    TraceQueryParams\n+\t\texpected string // empty when the query passes\n+\t}{\n+\t\t{name: \"no filter\", query: TraceQueryParams{ServiceName: \"cart\", Attributes: pcommon.NewMap()}},\n+\t\t{name: \"filter alone\", query: withFilter(filter)},\n+\t\t{name: \"filter with zero-value attributes\", query: TraceQueryParams{Filter: filter}},\n+\t\t{\n+\t\t\tname:     \"service name\",\n+\t\t\tquery:    TraceQueryParams{Filter: filter, ServiceName: \"cart\"},\n+\t\t\texpected: \"[service_name]\",\n+\t\t},\n+\t\t{\n+\t\t\tname: \"every field\",\n+\t\t\tquery: func() TraceQueryParams {\n+\t\t\t\tq := TraceQueryParams{\n+\t\t\t\t\tFilter:        filter,\n+\t\t\t\t\tServiceName:   \"cart\",\n+\t\t\t\t\tOperationName: \"GET\",\n+\t\t\t\t\tDurationMin:   time.Second,\n+\t\t\t\t\tDurationMax:   time.Minute,\n+\t\t\t\t\tAttributes:    pcommon.NewMap(),\n+\t\t\t\t}\n+\t\t\t\tq.Attributes.PutStr(\"a\", \"1\")\n+\t\t\t\treturn q\n+\t\t\t}(),\n+\t\t\texpected: \"[service_name operation_name duration_min duration_max attributes]\",\n+\t\t},\n+\t}\n+\tfor _, test := range tests {\n+\t\tt.Run(test.name, func(t *testing.T) {\n+\t\t\terr := test.query.EnsureFilterStandsAlone()\n+\t\t\tif test.expected == \"\" {\n+\t\t\t\trequire.NoError(t, err)\n+\t\t\t\treturn\n+\t\t\t}\n+\t\t\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\t\t\tassert.Contains(t, err.Error(), test.expected)\n+\t\t})\n+\t}\n+}\n+\n+func TestFilterCapabilities_EnsureSupported(t *testing.T) {\n+\tcaps := FilterCapabilities{\n+\t\tLevels:    []expression.Level{expression.LevelSpan},\n+\t\tOperators: []expression.Operator{expression.OpAnd, expression.OpEq, expression.OpNe, expression.OpSome},\n+\t}\n+\ttests := []struct {\n+\t\tname     string\n+\t\tfilter   *expression.Call\n+\t\texpected string // empty when the filter is supported\n+\t}{\n+\t\t{name: \"nil filter\"},\n+\t\t{name: \"unqualified attribute\", filter: tagEq(\"a\", \"1\")},\n+\t\t{\n+\t\t\tname:   \"nested conjunction at a listed level\",\n+\t\t\tfilter: call(expression.OpAnd, tagEq(\"a\", \"1\"), call(expression.OpEq, attr(\"b\", expression.LevelSpan), str(\"x\"))),\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"an operator it did not list\",\n+\t\t\tfilter:   call(expression.OpGt, attr(\"a\", \"\"), anyValue(\"1\")),\n+\t\t\texpected: `it does not support the operator \"gt\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"an operator it did not list, nested\",\n+\t\t\tfilter:   call(expression.OpAnd, tagEq(\"a\", \"1\"), call(expression.OpOr, tagEq(\"b\", \"1\"), tagEq(\"c\", \"1\"))),\n+\t\t\texpected: `it does not support the operator \"or\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"an attribute level it does not index\",\n+\t\t\tfilter:   call(expression.OpEq, attr(\"a\", expression.LevelLink), anyValue(\"1\")),\n+\t\t\texpected: `it does not index the \"link\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a field level it does not index\",\n+\t\t\tfilter:   call(expression.OpEq, field(expression.LevelResource, expression.ResourceFieldService), str(\"x\")),\n+\t\t\texpected: `it does not index the \"resource\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname:     \"a level it does not index, on the right of a comparison\",\n+\t\t\tfilter:   call(expression.OpNe, attr(\"a\", expression.LevelSpan), attr(\"a\", expression.LevelScope)),\n+\t\t\texpected: `it does not index the \"scope\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"a nested call on the right of a quantifier\",\n+\t\t\tfilter: call(expression.OpSome, &expression.NestedRef{Level: expression.LevelSpan},\n+\t\t\t\tcall(expression.OpEq, field(expression.LevelEvent, expression.EventFieldName), str(\"x\"))),\n+\t\t\texpected: `it does not index the \"event\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"a collection it does not index\",\n+\t\t\tfilter: call(expression.OpSome, &expression.NestedRef{Level: expression.LevelEvent},\n+\t\t\t\tcall(expression.OpEq, attr(\"a\", \"\"), str(\"x\"))),\n+\t\t\texpected: `it does not index the \"event\" level`,\n+\t\t},\n+\t}\n+\tfor _, test := range tests {\n+\t\tt.Run(test.name, func(t *testing.T) {\n+\t\t\terr := caps.EnsureSupported(test.filter)\n+\t\t\tif test.expected == \"\" {\n+\t\t\t\trequire.NoError(t, err)\n+\t\t\t\treturn\n+\t\t\t}\n+\t\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\t\tassert.Contains(t, err.Error(), test.expected)\n+\t\t})\n+\t}\n+}\n+\n+func TestForCapabilities(t *testing.T) {\n+\tdeclaring := SearchCapabilities{Filter: &FilterCapabilities{Operators: []expression.Operator{expression.OpEq}}}\n+\n+\tt.Run(\"no filter is returned unchanged\", func(t *testing.T) {\n+\t\tquery := TraceQueryParams{ServiceName: \"cart\", Attributes: pcommon.NewMap()}\n+\t\tfor _, caps := range []SearchCapabilities{{}, declaring} {\n+\t\t\tgot, err := query.ForCapabilities(caps)\n+\t\t\trequire.NoError(t, err)\n+\t\t\tassert.Equal(t, query, got)\n+\t\t}\n+\t})\n+\n+\tt.Run(\"an empty declaration gets the legacy shape\", func(t *testing.T) {\n+\t\tfor _, caps := range []SearchCapabilities{{}, {Filter: &FilterCapabilities{}}} {\n+\t\t\tgot, err := withFilter(tagEq(\"a\", \"1\")).ForCapabilities(caps)\n+\t\t\trequire tor{expression.OpAnd, expression.OpOr, expression.OpNot, expression.OpEq} {\n \t\tassert.False(t, zero.SupportsOperator(op), \"zero value must not support %q\", op)\n \t}\n }\n+\n+func TestFilterCapabilitiesEnsureSupported(t *testing.T) {\n+\tcaps := FilterCapabilities{\n+\t\tLevels:    []expression.Level{expression.LevelSpan},\n+\t\tOperators: []expression.Operator{expression.OpAnd, expression.OpEq, expression.OpNe, expression.OpSome},\n+\t}\n+\tspanName := &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldName}\n+\ttests := []struct {\n+\t\tname    string\n+\t\tfilter  *expression.Call\n+\t\twantErr string\n+\t}{\n+\t\t{name: \"nil filter\"},\n+\t\t{\n+\t\t\tname: \"declared operators and levels, with constants\",\n+\t\t\tfilter: call(expression.OpAnd,\n+\t\t\t\tcall(expression.OpEq, attr(\"a\"), anyValue(\"1\")),\n+\t\t\t\tcall(expression.OpEq, spanName, &expression.IntValue{Value: 1})),\n+\t\t},\n+\t\t{\n+\t\t\tname:    \"an undeclared operator\",\n+\t\t\tfilter:  call(expression.OpOr, call(expression.OpEq, attr(\"a\"), anyValue(\"1\"))),\n+\t\t\twantErr: `it does not support the operator \"or\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"an undeclared operator nested on the right of a comparison\",\n+\t\t\tfilter: call(expression.OpEq, attr(\"a\"),\n+\t\t\t\tcall(expression.OpGt, attr(\"b\"), anyValue(\"1\"))),\n+\t\t\twantErr: `it does not support the operator \"gt\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"an attribute at an undeclared level\",\n+\t\t\tfilter: call(expression.OpEq,\n+\t\t\t\t&expression.AttributeRef{Key: \"a\", Level: expression.LevelResource}, anyValue(\"1\")),\n+\t\t\twantErr: `it does not index the \"resource\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"a field at an undeclared level\",\n+\t\t\tfilter: call(expression.OpEq,\n+\t\t\t\t&expression.FieldRef{Level: expression.LevelScope, Name: expression.ScopeFieldName}, str(\"x\")),\n+\t\t\twantErr: `it does not index the \"scope\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"a nested reference at an undeclared level\",\n+\t\t\tfilter: call(expression.OpSome, &expression.NestedRef{Level: expression.LevelEvent},\n+\t\t\t\tcall(expression.OpEq, attr(\"a\"), anyValue(\"1\"))),\n+\t\t\twantErr: `it does not index the \"event\" level`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"a reference at an undeclared level on the right\",\n+\t\t\tfilter: call(expression.OpNe, attr(\"a\"),\n+\t\t\t\t&expression.AttributeRef{Key: \"a\", Level: expression.LevelLink}),\n+\t\t\twantErr: `it does not index the \"link\" level`,\n+\t\t},\n+\t}\n+\tfor _, tt := range tests {\n+\t\tt.Run(tt.name, func(t *testing.T) {\n+\t\t\terr := caps.EnsureSupported(tt.filter)\n+\t\t\tif tt.wantErr == \"\" {\n+\t\t\t\trequire.NoError(t, err)\n+\t\t\t\treturn\n+\t\t\t}\n+\t\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\t\tassert.Contains(t, err.Error(), tt.wantErr)\n+\t\t})\n+\t}\n+\n+\tt.Run(\"a call that contains itself\", func(t *testing.T) {\n+\t\tcyclic := call(expression.OpAnd, call(expression.OpEq, attr(\"a\"), anyValue(\"1\")))\n+\t\tcyclic.Args = append(cyclic.Args, cyclic)\n+\t\terr := caps.EnsureSupported(cyclic)\n+\t\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\t\trequire.ErrorIs(t, err, expression.ErrTooDeeplyNested)\n+\t})\n+}\ndiff --git a/internal/storage/v2/api/tracestore/query_shape.go b/internal/storage/v2/api/tracestore/query_shape.go\nnew file mode 100644\nindex 0000000..bcebb1e\n--- /dev/null\n+++ b/internal/storage/v2/api/tracestore/query_shape.go\n@@ -0,0 +1,350 @@\n+// Copyright (c) 2026 The Jaeger Authors.\n+// SPDX-License-Identifier: Apache-2.0\n+\n+package tracestore\n+\n+import (\n+\t\"fmt\"\n+\t\"time\"\n+\n+\texpression \"github.com/jaegertracing/jaeger-idl/query/expression/v1\"\n+\t\"go.opentelemetry.io/collector/pdata/pcommon\"\n+)\n+\n+// A TraceQueryParams states its predicates in one of two shapes: the legacy\n+// scalar fields (ServiceName, OperationName, Attributes and the duration\n+// bounds), which every backend serves, or Filter, which only a Reader that\n+// declares SearchCapabilities.Filter evaluates. The methods in this file decide\n+// which shape a Reader receives and convert between the two.\n+\n+// EnsureFilterStandsAlone rejects a query that carries both a filter and one\n+// of the predicate fields the filter replaces. The error wraps ErrFilterInvalid\n+// and names every conflicting field.\n+func (q TraceQueryParams) EnsureFilterStandsAlone() error {\n+\tif q.Filter == nil {\n+\t\treturn nil\n+\t}\n+\tvar conflicts []string\n+\tif q.ServiceName != \"\" {\n+\t\tconflicts = append(conflicts, \"service_name\")\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tconflicts = append(conflicts, \"operation_name\")\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tconflicts = append(conflicts, \"duration_min\")\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tconflicts = append(conflicts, \"duration_max\")\n+\t}\n+\tif attributeCount(q.Attributes) > 0 {\n+\t\tconflicts = append(conflicts, \"attributes\")\n+\t}\n+\tif len(conflicts) > 0 {\n+\t\treturn fmt.Errorf(\"%w: the filter replaces the predicate fields %v, which must be empty beside it\",\n+\t\t\tErrFilterInvalid, conflicts)\n+\t}\n+\treturn nil\n+}\n+\n+// ForCapabilities gives the Reader whichever of the two filtering models it\n+// declared it can evaluate. A query without a filter is returned unchanged. A\n+// Reader that declares no filter capability receives q.ToLegacyShape(); any\n+// other Reader receives q as it is, provided it declared everything the filter\n+// uses (see FilterCapabilities.EnsureSupported).\n+func (q TraceQueryParams) ForCapabilities(caps SearchCapabilities) (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\tif caps.Filter.IsEmpty() {\n+\t\treturn q.ToLegacyShape()\n+\t}\n+\treturn q, caps.Filter.EnsureSupported(q.Filter)\n+}\n+\n+// ToFilterShape expresses q's scalar predicate fields as filter predicates. It\n+// cannot fail, because each legacy field has an exact filter equivalent. A\n+// query that already has a Filter is returned as it is.\n+//\n+// The converted fields are cleared and every other field is kept. The filter\n+// is already finalized: it holds typed constants with the reference first, so\n+// expression.Finalize returns an equal tree.\n+func (q TraceQueryParams) ToFilterShape() TraceQueryParams {\n+\tif q.Filter != nil {\n+\t\treturn q\n+\t}\n+\tvar predicates []*expression.Call\n+\tif q.ServiceName != \"\" {\n+\t\tpredicates = append(predicates, eq(serviceRef(), &expression.StringValue{Value: q.ServiceName}))\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tpredicates = append(predicates, eq(operationRef(), &expression.StringValue{Value: q.OperationName}))\n+\t}\n+\tif attributeCount(q.Attributes) > 0 {\n+\t\tfor key, value := range q.Attributes.All() {\n+\t\t\tpredicates = append(predicates,\n+\t\t\t\teq(&expression.AttributeRef{Key: key}, &expression.AnyValue{Value: value.AsString()}))\n+\t\t}\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tpredicates = append(predicates, &expression.Call{\n+\t\t\tOp:   expression.OpGte,\n+\t\t\tArgs: []expression.Expression{durationRef(), &expression.DurationValue{Value: q.DurationMin}},\n+\t\t})\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tpredicates = append(predicates, &expression.Call{\n+\t\t\tOp:   expression.OpLte,\n+\t\t\tArgs: []expression.Expression{durationRef(), &expression.DurationValue{Value: q.DurationMax}},\n+\t\t})\n+\t}\n+\n+\tq.ServiceName = \"\"\n+\tq.OperationName = \"\"\n+\tq.Attributes = pcommon.NewMap()\n+\tq.DurationMin = 0\n+\tq.DurationMax = 0\n+\tswitch len(predicates) {\n+\tcase 0:\n+\t\tq.Filter = nil\n+\tcase 1:\n+\t\tq.Filter = predicates[0]\n+\tdefault:\n+\t\targs := make([]expression.Expression, len(predicates))\n+\t\tfor i, predicate := range predicates {\n+\t\t\targs[i] = predicate\n+\t\t}\n+\t\tq.Filter = &expression.Call{Op: expression.OpAnd, Args: args}\n+\t}\n+\treturn q\n+}\n+\n+// ToLegacyShape expresses q's Filter in the scalar predicate fields every\n+// backend serves. A query without a filter is returned unchanged.\n+//\n+// Only a flat conjunction of the predicates the legacy fields can hold converts;\n+// anything else is refused with ErrFilterUnsupported rather than approximated.\n+// A query that also sets a legacy predicate field is refused as\n+// EnsureFilterStandsAlone refuses it, since converting would overwrite that\n+// field. On error the original query is returned.\n+//\n+// The result has a nil Filter and a new Attributes map, so the caller's map is\n+// not changed.\n+func (q TraceQueryParams) ToLegacyShape() (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\tif err := q.EnsureFilterStandsAlone(); err != nil {\n+\t\treturn q, err\n+\t}\n+\tconjuncts, err := flattenConjunction(q.Filter, nil, 1)\n+\tif err != nil {\n+\t\treturn q, err\n+\t}\n+\tlegacy := legacyQuery{query: q}\n+\tlegacy.query.Filter = nil\n+\tlegacy.query.Attributes = pcommon.NewMap()\n+\tfor _, conjunct := range conjuncts {\n+\t\tif err := legacy.add(conjunct); err != nil {\n+\t\t\treturn q, err\n+\t\t}\n+\t}\n+\treturn legacy.query, nil\n+}\n+\n+// flattenConjunction appends the conjuncts of e to out, descending into nested\n+// OpAnd calls, which is safe because and is associative.\n+func flattenConjunction(e expression.Expression, out []expression.Expression, depth int) ([]expression.Expression, error) {\n+\tcall, ok := e.(*expression.Call)\n+\tif !ok || call == nil || call.Op != expression.OpAnd {\n+\t\treturn append(out, e), nil\n+\t}\n+\tif depth > expression.MaxNestingDepth {\n+\t\treturn nil, fmt.Errorf(\"%w: %w\", ErrFilterInvalid, expression.ErrTooDeeplyNested)\n+\t}\n+\tfor _, arg := range call.Args {\n+\t\tvar err error\n+\t\tif out, err = flattenConjunction(arg, out, depth+1); err != nil {\n+\t\t\treturn nil, err\n+\t\t}\n+\t}\n+\treturn out, nil\n+}\n+\n+// legacyQuery accumulates the legacy predicate fields of a query, one\n+// predicate at a time, and remembers which fields a predicate has written so a\n+// second predicate on the same field is refused rather than overwriting it.\n+type legacyQuery struct {\n+\tquery                                    TraceQueryParams\n+\thasService, hasOperation, hasMin, hasMax bool\n+}\n+\n+func (l *legacyQuery) add(conjunct expression.Expression) error {\n+\tcall, ok := conjunct.(*expression.Call)\n+\tif !ok || call == nil {\n+\t\treturn fmt.Errorf(\"%w: it serves a conjunction of predicates only, not %T\", ErrFilterUnsupported, conjunct)\n+\t}\n+\tswitch call.Op {\n+\tcase expression.OpOr, expression.OpNot, expression.OpExists:\n+\t\treturn errOperatorUnsupported(call.Op)\n+\t}\n+\tif len(call.Args) != 2 {\n+\t\treturn errOperatorUnsupported(call.Op)\n+\t}\n+\tswitch ref := call.Args[0].(type) {\n+\tcase *expression.AttributeRef:\n+\t\tif ref != nil {\n+\t\t\treturn l.addAttribute(call.Op, ref, call.Args[1])\n+\t\t}\n+\tcase *expression.FieldRef:\n+\t\tif ref != nil {\n+\t\t\treturn l.addField(call.Op, ref, call.Args[1])\n+\t\t}\n+\t}\n+\treturn fmt.Errorf(\"%w: it compares a reference against a constant only, not %T\",\n+\t\tErrFilterUnsupported, call.Args[0])\n+}\n+\n+func (l *legacyQuery) addAttribute(op expression.Operator, ref *expression.AttributeRef, operand expression.Expression) error {\n+\tswitch ref.Level {\n+\tcase \"\", expression.LevelSpan, expression.LevelResource, expression.LevelEvent:\n+\t\t// A tag is searched across these levels, so a qualified attribute widens\n+\t\t// to a plain tag.\n+\tdefault:\n+\t\treturn errLevelNotIndexed(ref.Level)\n+\t}\n+\tif op != expression.OpEq {\n+\t\treturn errOperatorOnUnsupported(op, ref.Key)\n+\t}\n+\tvalue, err := stringConstant(ref.Key, operand)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif _, exists := l.query.Attributes.Get(ref.Key); exists {\n+\t\treturn errOnePredicateOnly(ref.Key)\n+\t}\n+\tl.query.Attributes.PutStr(ref.Key, value)\n+\treturn nil\n+}\n+\n+func (l *legacyQuery) addField(op expression.Operator, ref *expression.FieldRef, operand expression.Expression) error {\n+\tswitch {\n+\tcase ref.Level == expression.LevelResource && ref.Name == expression.ResourceFieldService:\n+\t\treturn addStringField(op, ref.Name, operand, &l.hasService, &l.query.ServiceName)\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldName:\n+\t\treturn addStringField(op, ref.Name, operand, &l.hasOperation, &l.query.OperationName)\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldDuration:\n+\t\tswitch op {\n+\t\tcase expression.OpGte:\n+\t\t\treturn addDurationBound(op, operand, &l.hasMin, &l.query.DurationMin)\n+\t\tcase expression.OpLte:\n+\t\t\treturn addDurationBound(op, operand, &l.hasMax, &l.query.DurationMax)\n+\t\tdefault:\n+\t\t\treturn errOperatorOnUnsupported(op, ref.Name)\n+\t\t}\n+\tdefault:\n+\t\treturn fmt.Errorf(\"%w: it does not support the built-in field %q of the %q level\",\n+\t\t\tErrFilterUnsupported, ref.Name, ref.Level)\n+\t}\n+}\n+\n+func addStringField(op expression.Operator, name string, operand expression.Expression, written *bool, field *string) error {\n+\tif op != expression.OpEq {\n+\t\treturn errOperatorOnUnsupported(op, name)\n+\t}\n+\tvalue, err := stringConstant(name, operand)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif value == \"\" {\n+\t\t// The legacy field reads an empty string as no predicate at all, which\n+\t\t// would widen the query rather than serve it.\n+\t\treturn fmt.Errorf(\"%w: it reads an empty %q as no predicate\", ErrFilterUnsupported, name)\n+\t}\n+\tif *written {\n+\t\treturn errOnePredicateOnly(name)\n+\t}\n+\t*written = true\n+\t*field = value\n+\treturn nil\n+}\n+\n+func addDurationBound(op expression.Operator, operand expression.Expression, written *bool, bound *time.Duration) error {\n+\tname := expression.SpanFieldDuration\n+\tif untyped, ok := operand.(*expression.AnyValue); ok && untyped != nil {\n+\t\treturn fmt.Errorf(\"%w: the bound %q on %q was never read as a duration\",\n+\t\t\tErrFilterInvalid, untyped.Value, name)\n+\t}\n+\tconstant, ok := operand.(*expression.DurationValue)\n+\tif !ok || constant == nil {\n+\t\treturn fmt.Errorf(\"%w: it compares %q against a duration such as %q only\",\n+\t\t\tErrFilterUnsupported, name, \"2s\")\n+\t}\n+\tvalue := constant.Value\n+\tif op == expression.OpLte && value == 0 {\n+\t\t// DurationMax reads zero as no bound, which would widen the query\n+\t\t// rather than serve it. A lower bound of zero is no bound either way.\n+\t\treturn fmt.Errorf(\"%w: it reads a bound of %q on %q as no bound\", ErrFilterUnsupported, value, name)\n+\t}\n+\tif *written {\n+\t\treturn errOnePredicateOnly(name)\n+\t}\n+\t*written = true\n+\t*bound = value\n+\treturn nil\n+}\n+\n+// stringConstant returns the text of the constant a string predicate compares\n+// against: a string, or an untyped constant, which a tag always was.\n+func stringConstant(name string, operand expression.Expression) (string, error) {\n+\tswitch constant := operand.(type) {\n+\tcase *expression.StringValue:\n+\t\tif constant != nil {\n+\t\t\treturn constant.Value, nil\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif constant != nil {\n+\t\t\treturn constant.Value, nil\n+\t\t}\n+\t}\n+\treturn \"\", fmt.Errorf(\"%w: it compares %q against a string constant only, not %T\",\n+\t\tErrFilterUnsupported, name, operand)\n+}\n+\n+func errOperatorUnsupported(op expression.Operator) error {\n+\treturn fmt.Errorf(\"%w: it does not support the operator %q\", ErrFilterUnsupported, op)\n+}\n+\n+func errOperatorOnUnsupported(op expression.Operator, name string) error {\n+\treturn fmt.Errorf(\"%w: it does not support the operator %q on %q\", ErrFilterUnsupported, op, name)\n+}\n+\n+func errOnePredicateOnly(name string) error {\n+\treturn fmt.Errorf(\"%w: it supports only one predicate on %q\", ErrFilterUnsupported, name)\n+}\n+\n+// attributeCount is m.Len(), except that it also accepts the zero value of\n+// pcommon.Map, which a caller gets by not calling pcommon.NewMap() and whose\n+// Len panics.\n+func attributeCount(m ey), anyValue(value))\n+}\n+\n+func filterOnly(filter *expression.Call) TraceQueryParams {\n+\treturn TraceQueryParams{Attributes: pcommon.NewMap(), Filter: filter}\n+}\n+\n+func TestEnsureFilterStandsAlone(t *testing.T) {\n+\tfilter := tagEq(\"http.method\", \"GET\")\n+\ttests := []struct {\n+\t\tname    string\n+\t\tquery   func() TraceQueryParams\n+\t\twantErr string\n+\t}{\n+\t\t{name: \"no filter\", query: func() TraceQueryParams {\n+\t\t\treturn TraceQueryParams{ServiceName: \"cart\", Attributes: pcommon.NewMap()}\n+\t\t}},\n+\t\t{name: \"filter alone\", query: func() TraceQueryParams { return filterOnly(filter) }},\n+\t\t{name: \"filter with zero-value attributes\", query: func() TraceQueryParams {\n+\t\t\treturn TraceQueryParams{Filter: filter}\n+\t\t}},\n+\t\t{name: \"service name\", wantErr: \"[service_name]\", query: func() TraceQueryParams {\n+\t\t\tq := filterOnly(filter)\n+\t\t\tq.ServiceName = \"cart\"\n+\t\t\treturn q\n+\t\t}},\n+\t\t{name: \"operation name\", wantErr: \"[operation_name]\", query: func() TraceQueryParams {\n+\t\t\tq := filterOnly(filter)\n+\t\t\tq.OperationName = \"GET /cart\"\n+\t\t\treturn q\n+\t\t}},\n+\t\t{name: \"duration min\", wantErr: \"[duration_min]\", query: func() TraceQueryParams {\n+\t\t\tq := filterOnly(filter)\n+\t\t\tq.DurationMin = time.Second\n+\t\t\treturn q\n+\t\t}},\n+\t\t{name: \"duration max\", wantErr: \"[duration_max]\", query: func() TraceQueryParams {\n+\t\t\tq := filterOnly(filter)\n+\t\t\tq.DurationMax = time.Second\n+\t\t\treturn q\n+\t\t}},\n+\t\t{name: \"attributes\", wantErr: \"[attributes]\", query: func() TraceQueryParams {\n+\t\t\tq := filterOnly(filter)\n+\t\t\tq.Attributes.PutStr(\"a\", \"1\")\n+\t\t\treturn q\n+\t\t}},\n+\t\t{\n+\t\t\tname:    \"all of them, in order\",\n+\t\t\twantErr: \"[service_name operation_name duration_min duration_max attributes]\",\n+\t\t\tquery: func() TraceQueryParams {\n+\t\t\t\tq := filterOnly(filter)\n+\t\t\t\tq.Attributes.PutStr(\"a\", \"1\")\n+\t\t\t\tq.DurationMax = 2 * time.Second\n+\t\t\t\tq.DurationMin = time.Second\n+\t\t\t\tq.OperationName = \"op\"\n+\t\t\t\tq.ServiceName = \"svc\"\n+\t\t\t\treturn q\n+\t\t\t},\n+\t\t},\n+\t}\n+\tfor _, tt := range tests {\n+\t\tt.Run(tt.name, func(t *testing.T) {\n+\t\t\terr := tt.query().EnsureFilterStandsAlone()\n+\t\t\tif tt.wantErr == \"\" {\n+\t\t\t\trequire.NoError(t, err)\n+\t\t\t\treturn\n+\t\t\t}\n+\t\t\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\t\t\tassert.Contains(t, err.Error(), tt.wantErr)\n+\t\t})\n+\t}\n+}\n+\n+func TestForCapabilities(t *testing.T) {\n+\tt.Run(\"no filter is returned unchanged\", func(t *testing.T) {\n+\t\tq := TraceQueryParams{ServiceName: \"cart\", Attributes: pcommon.NewMap(), SearchDepth: 7}\n+\t\tgot, err := q.ForCapabilities(SearchCapabilities{})\n+\t\trequire.NoError(t, err)\n+\t\tassert.Equal(t, q, got)\n+\t})\n+\n+\tt.Run(\"no declaration gets the legacy shape\", func(t *testing.T) {\n+\t\tfor name, caps := range map[string]SearchCapabilities{\n+\t\t\t\"nil\":   {},\n+\t\t\t\"empty\": {Filter: &FilterCapabilities{}},\n+\t\t} {\n+\t\t\tt.Run(name, func(t *testing.T) {\n+\t\t\t\tgot, err := filterOnly(tagEq(\"http.method\", \"GET\")).ForCapabilities(caps)\n+\t\t\t\trequire.NoError(t, err)\n+\t\t\t\tassert.Nil(t, got.Filter)\n+\t\t\t\tassert.Equal(t, map[string]any{\"http.method\": \"GET\"}, got.Attributes.AsRaw())\n+\t\t\t})\n+\t\t}\n+\t})\n+\n+\tt.Run(\"no declaration and an unconvertible filter is refused\", func(t *testing.T) {\n+\t\tq := filterOnly(call(expression.OpOr, tagEq(\"a\", \"1\"), tagEq(\"b\", \"2\")))\n+\t\tgot, err := q.ForCapabilities(SearchCapabilities{})\n+\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\tassert.Equal(t, q, got)\n+\t})\n+\n+\tcaps := SearchCapabilities{Filter: &FilterCapabilities{\n+\t\tOperators: []expression.Operator{expression.OpAnd, expression.OpEq},\n+\t}}\n+\n+\tt.Run(\"a declared filter is passed as it is\", func(t *testing.T) {\n+\t\tq := filterOnly(call(expression.OpAnd, tagEq(\"a\", \"1\") ), \"the caller's map is not changed\")\n+\t\tassert.Equal(t, start, got.StartTimeMin)\n+\t\tassert.Equal(t, end, got.StartTimeMax)\n+\t\tassert.Equal(t, 20, got.SearchDepth)\n+\n+\t\trequire.NoError(t, expression.ValidateFilter(got.Filter))\n+\t\tresolved, err := expression.ResolveConstants(got.Filter)\n+\t\trequire.NoError(t, err)\n+\t\tassert.Equal(t, got.Filter, resolved)\n+\t})\n+\n+\tt.Run(\"one predicate stands on its own\", func(t *testing.T) {\n+\t\tgot := TraceQueryParams{ServiceName: \"cart\", Attributes: pcommon.NewMap()}.ToFilterShape()\n+\t\tassert.Equal(t, call(expression.OpEq, serviceRef(), str(\"cart\")), got.Filter)\n+\t\trequire.NoError(t, expression.ValidateFilter(got.Filter))\n+\t})\n+\n+\tt.Run(\"no predicate gives no filter\", func(t *testing.T) {\n+\t\tgot := TraceQueryParams{SearchDepth: 5, Attributes: pcommon.NewMap()}.ToFilterShape()\n+\t\tassert.Nil(t, got.Filter)\n+\t\tassert.Equal(t, 5, got.SearchDepth)\n+\t})\n+\n+\tt.Run(\"zero-value attributes do not panic\", func(t *testing.T) {\n+\t\tvar got TraceQueryParams\n+\t\trequire.NotPanics(t, func() {\n+\t\t\tgot = TraceQueryParams{DurationMax: time.Second}.ToFilterShape()\n+\t\t})\n+\t\tassert.Equal(t, call(expression.OpLte, durationRef(), duration(time.Second)), got.Filter)\n+\t\tassert.Equal(t, 0, got.Attributes.Len())\n+\t})\n+\n+\tt.Run(\"a query with a filter is returned as it is\", func(t *testing.T) {\n+\t\tq := filterOnly(tagEq(\"a\", \"1\"))\n+\t\tq.ServiceName = \"cart\"\n+\t\tassert.Equal(t, q, q.ToFilterShape())\n+\t})\n+}\n+\n+func TestToLegacyShape_Converts(t *testing.T) {\n+\tt.Run(\"no filter is returned unchanged\", func(t *testing.T) {\n+\t\tq := TraceQueryParams{ServiceName: \"cart\", Attributes: pcommon.NewMap()}\n+\t\tgot, err := q.ToLegacyShape()\n+\t\trequire.NoError(t, err)\n+\t\tassert.Equal(t, q, got)\n+\t})\n+\n+\tt.Run(\"round trip\", func(t *testing.T) {\n+\t\tattrs := pcommon.NewMap()\n+\t\tattrs.PutStr(\"http.method\", \"GET\")\n+\t\tattrs.PutStr(\"error\", \"true\")\n+\t\tq := TraceQueryParams{\n+\t\t\tServiceName:   \"cart\",\n+\t\t\tOperationName: \"GET /cart\",\n+\t\t\tAttributes:    attrs,\n+\t\t\tStartTimeMin:  time.Unix(100, 0),\n+\t\t\tStartTimeMax:  time.Unix(200, 0),\n+\t\t\tDurationMin:   time.Second,\n+\t\t\tDurationMax:   2 * time.Second,\n+\t\t\tSearchDepth:   20,\n+\t\t}\n+\t\tgot, err := q.ToFilterShape().ToLegacyShape()\n+\t\trequire.NoError(t, err)\n+\t\tassert.Equal(t, q.ServiceName, got.ServiceName)\n+\t\tassert.Equal(t, q.OperationName, got.OperationName)\n+\t\tassert.Equal(t, q.Attributes.AsRaw(), got.Attributes.AsRaw())\n+\t\tgot.Attributes = q.Attributes\n+\t\tassert.Equal(t, q, got)\n+\t})\n+\n+\tt.Run(\"every convertible form, nested and flattened\", func(t *testing.T) {\n+\t\tfilter := call(expression.OpAnd,\n+\t\t\tcall(expression.OpEq, &expression.AttributeRef{Key: \"span.a\", Level: expression.LevelSpan}, str(\"1\")),\n+\t\t\tcall(expression.OpAnd,\n+\t\t\t\tcall(expression.OpEq, &expression.AttributeRef{Key: \"res.b\", Level: expression.LevelResource}, anyValue(\"2\")),\n+\t\t\t\tcall(expression.OpEq, &expression.AttributeRef{Key: \"event.c\", Level: expression.LevelEvent}, anyValue(\"3\")),\n+\t\t\t\tcall(expression.OpAnd,\n+\t\t\t\t\ttagEq(\"d\", \"4\"),\n+\t\t\t\t\tcall(expression.OpEq, serviceRef(), anyValue(\"cart\")))),\n+\t\t\tcall(expression.OpEq, operationRef(), str(\"GET /cart\")),\n+\t\t\tcall(expression.OpGte, durationRef(), duration(time.Second)),\n+\t\t\tcall(expression.OpLte, durationRef(), duration(3*time.Second)),\n+\t\t)\n+\t\tq := filterOnly(filter)\n+\t\tq.SearchDepth = 10\n+\t\tgot, err := q.ToLegacyShape()\n+\t\trequire.NoError(t, err)\n+\t\tassert.Nil(t, got.Filter)\n+\t\tassert.Equal(t, \"cart\", got.ServiceName)\n+\t\tassert.Equal(t, \"GET /cart\", got.OperationName)\n+\t\tassert.Equal(t, time.Second, got.DurationMin)\n+\t\tassert.Equal(t, 3*time.Second, got.DurationMax)\n+\t\tassert.Equal(t, 10, got.SearchDepth)\n+\t\tassert.Equal(t, map[string]any{\"span.a\": \"1\", \"res.b\": \"2\", \"event.c\": \"3\", \"d\": \"4\"}, got.Attributes.AsRaw())\n+\t})\n+\n+\tt.Run(\"the caller's map is not changed\", func(t *testing.T) {\n+\t\tq := filterOnly(tagEq(\"a\", \"1\"))\n+\t\tgot, err := q.ToLegacyShape()\n+\t\trequire.NoError(t, err)\n+\t\tassert.Equal(t, 0, q.Attributes.Len())\n+\t\tassert.Equal(t, 1, got.Attributes.Len())\n+\t\tassert.NotNil(t, q.Filter)\n+\t})\n+\n+\tt.Run(\"zero-value attributes\", func(t *testing.T) {\n+\t\tgot, err := TraceQueryParams{Filter: tagEq(\"a\", \"1\")}.ToLegacyShape()\n+\t\trequire.NoError(t, err)\n+\t\tassert.Equal(t, map[string]any{\"a\": \"1\"}, got.Attributes.AsRaw())\n+\t})\n+\n+\tt.Run(\"a lower bound of zero\", func(t *testing.T) {\n+\t\tgot, err := filterOnly(call(expression.OpGte, durationRef(), duration(0))).ToLegacyShape()\n+\t\trequire.NoError(t, err)\n+\t\tassert.Zero(t, got.DurationMin)\n+\t})\n+}\n+\n+func TestToLegacyShape_Refuses(t *testing.T) {\n+\tdurationEq := func(op expression.Operator, value expression.Expression) *expression.Call {\n+\t\treturn call(op, durationRef(), value)\n+\t}\n+\ttests := []struct {\n+\t\tname    string\n+\t\tfilter  *expression.Call\n+\t\twantErr string\n+\t}{\n+\t\t{\n+\t\t\tname:    \"or\",\n+\t\t\tfilter:  call(expression.OpOr, tagEq(\"a\", \"1\"), tagEq(\"b\", \"2\")),\n+\t\t\twantErr: `does not support the operator \"or\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:    \"not\",\n+\t\t\tfilter:  call(expression.OpNot, tagEq(\"a\", \"1\")),\n+\t\t\twantErr: `does not support the operator \"not\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:    \"exists\",\n+\t\t\tfilter:  call(expression.OpExists, attr(\"a\")),\n+\t\t\twantErr: `does not support the operator \"exists\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:    \"or nested in a conjunction\",\n+\t\t\tfilter:  call(expression.OpAnd, tagEq(\"a\", \"1\"), call(expression.OpOr, tagEq(\"b\", \"2\"), tagEq(\"c\", \"3\"))),\n+\t\t\twantErr: `does not support the operator \"or\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname:    \"a predicate without tw ata/pcommon\"\n+)\n+\n+// A query carries its predicates in one of two filtering models: the scalar\n+// predicate fields every backend serves (ServiceName, OperationName, Attributes\n+// and the duration bounds), or the structured Filter. The methods in this file\n+// decide which model a Reader is handed and convert between the two, so every\n+// caller gets the same answer rather than each backend's own.\n+\n+// EnsureFilterStandsAlone rejects a query that carries both a filter and one\n+// of the predicate fields the filter replaces. A query without a filter\n+// passes, and so does an empty Attributes map, which is not a predicate.\n+//\n+// The error wraps ErrFilterInvalid and names every conflicting field.\n+func (q TraceQueryParams) EnsureFilterStandsAlone() error {\n+\tif q.Filter == nil {\n+\t\treturn nil\n+\t}\n+\tvar conflicts []string\n+\tif q.ServiceName != \"\" {\n+\t\tconflicts = append(conflicts, \"service_name\")\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tconflicts = append(conflicts, \"operation_name\")\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tconflicts = append(conflicts, \"duration_min\")\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tconflicts = append(conflicts, \"duration_max\")\n+\t}\n+\tif attributeCount(q.Attributes) > 0 {\n+\t\tconflicts = append(conflicts, \"attributes\")\n+\t}\n+\tif len(conflicts) == 0 {\n+\t\treturn nil\n+\t}\n+\treturn fmt.Errorf(\"%w: a filter replaces the predicate fields %v, which must be left empty beside it\",\n+\t\tErrFilterInvalid, conflicts)\n+}\n+\n+// ForCapabilities gives the Reader whichever of the two filtering models it\n+// declared it can evaluate. A query without a filter is returned unchanged. A\n+// Reader that declares no filter support gets the filter expressed in the\n+// legacy predicate fields (see ToLegacyShape); one that declares support gets\n+// the query as it is, or a refusal if the filter uses something it did not\n+// declare (see FilterCapabilities.EnsureSupported).\n+//\n+// It expects a query that has passed EnsureFilterStandsAlone.\n+func (q TraceQueryParams) ForCapabilities(caps SearchCapabilities) (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\tif caps.Filter.IsEmpty() {\n+\t\treturn q.ToLegacyShape()\n+\t}\n+\treturn q, caps.Filter.EnsureSupported(q.Filter)\n+}\n+\n+// ToFilterShape expresses q's scalar predicate fields as filter predicates. It\n+// cannot fail, because each legacy field has an exact filter equivalent. A\n+// query that already has a Filter is returned as it is.\n+//\n+// The converted fields are cleared and everything else is kept. The filter is\n+// nil when there is nothing to convert, a single predicate when there is one,\n+// and a conjunction otherwise. It needs no further resolution: it is valid,\n+// and its constants are already typed.\n+func (q TraceQueryParams) ToFilterShape() TraceQueryParams {\n+\tif q.Filter != nil {\n+\t\treturn q\n+\t}\n+\tvar predicates []*expression.Call\n+\tif q.ServiceName != \"\" {\n+\t\tpredicates = append(predicates, compare(expression.OpEq,\n+\t\t\t&expression.FieldRef{Level: expression.LevelResource, Name: expression.ResourceFieldService},\n+\t\t\t&expression.StringValue{Value: q.ServiceName}))\n+\t}\n+\tif q.OperationName != \"\" {\n+\t\tpredicates = append(predicates, compare(expression.OpEq,\n+\t\t\t&expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldName},\n+\t\t\t&expression.StringValue{Value: q.OperationName}))\n+\t}\n+\tif attributeCount(q.Attributes) > 0 {\n+\t\tq.Attributes.Range(func(key string, value pcommon.Value) bool {\n+\t\t\tpredicates = append(predicates, compare(expression.OpEq,\n+\t\t\t\t&expression.AttributeRef{Key: key},\n+\t\t\t\t&expression.AnyValue{Value: value.AsString()}))\n+\t\t\treturn true\n+\t\t})\n+\t}\n+\tduration := func() *expression.FieldRef {\n+\t\treturn &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldDuration}\n+\t}\n+\tif q.DurationMin != 0 {\n+\t\tpredicates = append(predicates, compare(expression.OpGte,\n+\t\t\tduration(), &expression.DurationValue{Value: q.DurationMin}))\n+\t}\n+\tif q.DurationMax != 0 {\n+\t\tpredicates = append(predicates, compare(expression.OpLte,\n+\t\t\tduration(), &expression.DurationValue{Value: q.DurationMax}))\n+\t}\n+\n+\tq.ServiceName = \"\"\n+\tq.OperationName = \"\"\n+\tq.Attributes = pcommon.NewMap()\n+\tq.DurationMin = 0\n+\tq.DurationMax = 0\n+\tswitch len(predicates) {\n+\tcase 0:\n+\t\tq.Filter = nil\n+\tcase 1:\n+\t\tq.Filter = predicates[0]\n+\tdefault:\n+\t\targs := make([]expression.Expression, len(predicates))\n+\t\tfor i, predicate := range predicates {\n+\t\t\targs[i] = predicate\n+\t\t}\n+\t\tq.Filter = &expression.Call{Op: expression.OpAnd, Args: args}\n+\t}\n+\treturn q\n+}\n+\n+func compare(op expression.Operator, ref, value expression.Expression) *expression.Call {\n+\treturn &expression.Call{Op: op, Args: []expression.Expression{ref, value}}\n+}\n+\n+// ToLegacyShape expresses q's Filter in the scalar predicate fields every\n+// backend serves. It is the inverse of ToFilterShape, and accepts what a flat\n+// index can answer exactly: a conjunction of equalities on attributes, the\n+// service and the operation name, and inclusive bounds on the span duration.\n+// Anything else is refused with ErrFilterUnsupported rather than approximated.\n+//\n+// A query without a filter is returned unchanged. Otherwise the result has a\n+// nil Filter and a new Attributes map, so the caller's map is not changed; on\n+// error the original query is returned. It expects a query that has passed\n+// EnsureFilterStandsAlone: a legacy field the filter also sets is overwritten.\n+func (q TraceQueryParams) ToLegacyShape() (TraceQueryParams, error) {\n+\tif q.Filter == nil {\n+\t\treturn q, nil\n+\t}\n+\tpredicates, err := conjuncts(q.Filter, nil, 1)\n+\tif err != nil {\n+\t\treturn q, err\n+\t}\n+\tout := q\n+\tout.Filter = nil\n+\tout.Attributes = pcommon.NewMap()\n+\tif attributeCount(q.Attributes) > 0 {\n+\t\tq.Attributes.CopyTo(out.Attributes)\n+\t}\n+\tvar written legacyFields\n+\tfor _, predicate := range predicates {\n+\t\tif err := written.apply(&out, predicate); err != nil {\n+\t\t\treturn q, err\n+\t\t}\n+\t}\n+\treturn out, nil\n+}\n+\n+// conjuncts flattens nested conjunctions into the predicates they conjoin.\n+func conjuncts(call *expression.Call, into []*expression.Call, depth int) ([]*expression.Call, error) {\n+\tif depth > expression.MaxNestingDepth {\n+\t\treturn nil, fmt.Errorf(\"%w: %w\", ErrFilterInvalid, expression.ErrTooDeeplyNested)\n+\t}\n+\tif call.Op != expression.OpAnd {\n+\t\treturn append(into, call), nil\n+\t}\n+\tfor _, arg := range call.Args {\n+\t\tnested, ok := arg.(*expression.Call)\n+\t\tif !ok || nested == nil {\n+\t\t\treturn nil, fmt.Errorf(\"%w: it serves a conjunction of predicates only\", ErrFilterUnsupported)\n+\t\t}\n+\t\tvar err error\n+\t\tif into, err = conjuncts(nested, into, depth+1); err != nil {\n+\t\t\treturn nil, err\n+\t\t}\n+\t}\n+\treturn into, nil\n+}\n+\n+// legacyFields records which legacy fields the filter has written, so that a\n+// second predicate on the same field is refused rather than silently replacing\n+// the first: the legacy fields hold one value each.\n+type legacyFields struct {\n+\tattributes  map[string]bool\n+\tservice     bool\n+\toperation   bool\n+\tdurationMin bool\n+\tdurationMax bool\n+}\n+\n+// apply writes one predicate into the legacy fields of q.\n+func (w *legacyFields) apply(q *TraceQueryParams, predicate *expression.Call) error {\n+\tswitch predicate.Op {\n+\tcase expression.OpOr, expression.OpNot, expression.OpExists:\n+\t\treturn unsupportedOperator(predicate.Op)\n+\t}\n+\tif len(predicate.Args) != 2 {\n+\t\treturn unsupportedOperator(predicate.Op)\n+\t}\n+\tvalue := predicate.Args[1]\n+\tswitch ref := predicate.Args[0].(type) {\n+\tcase *expression.AttributeRef:\n+\t\tif ref != nil {\n+\t\t\treturn w.applyAttribute(q, predicate.Op, ref, value)\n+\t\t}\n+\tcase *expression.FieldRef:\n+\t\tif ref != nil {\n+\t\t\treturn w.applyField(q, predicate.Op, ref, value)\n+\t\t}\n+\t}\n+\treturn fmt.Errorf(\"%w: it compares a reference against a constant only\", ErrFilterUnsupported)\n+}\n+\n+func (w *legacyFields) applyAttribute(\n+\tq *TraceQueryParams, op expression.Operator, ref *expression.AttributeRef, value expression.Expression,\n+) error {\n+\tswitch ref.Level {\n+\tcase \"\", expression.LevelSpan, expression.LevelResource, expression.LevelEvent:\n+\t\t// A tag of the legacy model matches any of these levels.\n+\tdefault:\n+\t\treturn fmt.Errorf(\"%w: it does not index the %q level\", ErrFilterUnsupported, ref.Level)\n+\t}\n+\ttext, err := equalityText(op, ref.Key, value)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif w.attributes[ref.Key] {\n+\t\treturn onlyOnePredicate(ref.Key)\n+\t}\n+\tif w.attributes == nil {\n+\t\tw.attributes = make(map[string]bool)\n+\t}\n+\tw.attributes[ref.Key] = true\n+\tq.Attributes.PutStr(ref.Key, text)\n+\treturn nil\n+}\n+\n+func (w *legacyFields) applyField(\n+\tq *TraceQueryParams, op expression.Operator, ref *expression.FieldRef, value expression.Expression,\n+) error {\n+\tswitch {\n+\tcase ref.Level == expression.LevelResource && ref.Name == expression.ResourceFieldService:\n+\t\treturn applyString(&q.ServiceName, &w.service, op, ref.Name, value)\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldName:\n+\t\treturn applyString(&q.OperationName, &w.operation, op, ref.Name, value)\n+\tcase ref.Level == expression.LevelSpan && ref.Name == expression.SpanFieldDuration:\n+\t\treturn w.applyDuration(q, op, ref.Name, value)\n+\tdefault:\n+\t\treturn fmt.Errorf(\"%w: it does not support the built-in field %q of the %q level\",\n+\t\t\tErrFilterUnsupported, ref.Name, ref.Level)\n+\t}\n+}\n+\n+func applyString(\n+\tfield *string, written *bool, op expression.Operator, name string, value expression.Expression,\n+) error {\n+\ttext, err := equalityText(op, name, value)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif *written {\n+\t\treturn onlyOnePredicate(name)\n+\t}\n+\t*written = true\n+\t*field = text\n+\treturn nil\n+}\n+\n+func (w *legacyFields) applyDuration(\n+\tq *TraceQueryParams, op expression.Operator, name string, value expression.Expression,\n+) error {\n+\tvar field *time.Duration\n+\tvar written *bool\n+\tswitch op {\n+\tcase expression.OpGte:\n+\t\tfield, written = &q.DurationMin, &w.durationMin\n+\tcase expression.OpLte:\n+\t\tfield, written = &q.DurationMax, &w.durationMax\n+\tdefault:\n+\t\treturn unsupportedOperatorOn(op, name)\n+\t}\n+\tbound, err := durationBound(name, value)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif *written {\n+\t\treturn onlyOnePredicate(name)\n+\t}\n+\t*written = true\n+\t*field = bound\n+\treturn nil\n+}\n+\n+// durationBound returns the length of time a bound on name compares against.\n+func durationBound(name string, value expression.Expression) (time.Duration, error) {\n+\tswitch v := value.(type) {\n+\tcase *expression.DurationValue:\n+\t\tif v != nil {\n+\t\t\treturn v.Value, nil\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif v != nil {\n+\t\t\treturn 0, fmt.Errorf(\"%w: the bound %q on %q was never read as a duration\",\n+\t\t\t\tErrFilterInvalid, v.Value, name)\n+\t\t}\n+\t}\n+\treturn 0, fmt.Errorf(\"%w: it compares %q against a duration such as \\\"2s\\\" only\",\n+\t\tErrFilterUnsupported, name)\n+}\n+\n+// equalityText returns the text an equality on name compares against, which is\n+// all a legacy field can hold.\n+func equalityText(op expression.Operator, name string, value expression.Expression) (string, error) {\n+\tif op != expression.OpEq {\n+\t\treturn \"\", unsupportedOperatorOn(op, name)\n+\t}\n+\tswitch v := value.(type) {\n+\tcase *expression.StringValue:\n+\t\tif v != nil {\n+\t\t\treturn v.Value, nil\n+\t\t}\n+\tcase *expression.AnyValue:\n+\t\tif v != nil {\n+\t\t\treturn v.Value, nil\n+\t\t}\n+\t}\n+\treturn \"\", fmt.Errorf(\"%w: it compares %q against a string constant only\", ErrFilterUnsupported, name)\n+}\n+\n+func unsupportedOperator(op expression.Operator) error {\n+\treturn fmt.Errorf(\"%w: it does not support the operator %q\", ErrFilterUnsupported, op)\n+}\n+\n+func unsupportedOperatorOn(op expression.Operator, name string) error {\n+\treturn fmt.Errorf(\"%w: it does not support the operator %q on %q\", ErrFilterUnsupported, op, name)\n+}\n+\n+func onlyOnePredicate(name string) error {\n+\treturn fmt.Errorf(\"%w: it takes only one predicate on %q\", ErrFilterUnsupported, name)\n+}\n+\n+// attributeCount is m.Len(), except that it answers 0 for a Map left at its\n+// zero value, whose methods would panic.\n+func attributeCount(m pcommon.Map) int {\n+\tif m == (pcommon.Map{}) {\n+\t\treturn 0\n+\t}\n+\treturn m.Len()\n+}\ndiff --git a/internal/storage/v2/api/tracestore/query_filter_test.go b/internal/storage/v2/api/tracestore/query_filter_test.go\nnew file mode 100644\nindex 0000000..59efd65\n--- /dev/null\n+++ b/internal/storage/v2/api/tracestore/query_filter_test.go\n@@ -0,0 +1,516 @@\n+// Copyright (c) 2026 The Jaeger Authors.\n+// SPDX-License-Identifier: Apache-2.0\n+\n+package tracestore\n+\n+import (\n+\t\"testing\"\n+\t\"time\"\n+\n+\texpression \"github.com/jaegertracing/jaeger-idl/query/expression/v1\"\n+\t\"github.com/stretchr/testify/assert\"\n+\t\"github.com/stretchr/testify/require\"\n+\t\"go.opentelemetry.io/collector/pdata/pcommon\"\n+)\n+\n+func attrEq(key, value string) *expression.Call {\n+\treturn call(expression.OpEq, &expression.AttributeRef{Key: key}, &expression.AnyValue{Value: value})\n+}\n+\n+func serviceRef() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelResource, Name: expression.ResourceFieldService}\n+}\n+\n+func operationRef() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldName}\n+}\n+\n+func durationRef() *expression.FieldRef {\n+\treturn &expression.FieldRef{Level: expression.LevelSpan, Name: expression.SpanFieldDuration}\n+}\n+\n+func boundCall(op expression.Operator, d time.Duration) *expression.Call {\n+\treturn call(op, durationRef(), &expression.DurationValue{Value: d})\n+}\n+\n+func withFilter(filter *expression.Call) TraceQueryParams {\n+\treturn TraceQueryParams{Attributes: pcommon.NewMap(), Filter: filter}\n+}\n+\n+// legacyQuery is a query that sets every legacy predicate field, beside fields\n+// that are not predicates and so survive every conversion.\n+func legacyQuery() TraceQueryParams {\n+\tattrs := pcommon.NewMap()\n+\tattrs.PutStr(\"http.method\", \"GET\")\n+\tattrs.PutStr(\"http.status_code\", \"500\")\n+\treturn TraceQueryParams{\n+\t\tServiceName:   \"cart\",\n+\t\tOperationName: \"GET /cart\",\n+\t\tAttributes:    attrs,\n+\t\tStartTimeMin:  time.Unix(100, 0),\n+\t\tStartTimeMax:  time.Unix(200, 0),\n+\t\tDurationMin:   time.Second,\n+\t\tDurationMax:   2 * time.Second,\n+\t\tSearchDepth:   20,\n+\t}\n+}\n+\n+func TestEnsureFilterStandsAlone(t *testing.T) {\n+\tfilter := attrEq(\"a\", \"1\")\n+\ttests := []struct {\n+\t\tname    string\n+\t\tquery   func() TraceQueryParams\n+\t\twantErr string\n+\t}{\n+\t\t{name: \"no filter\", query: legacyQuery},\n+\t\t{name: \"filter alone\", query: func() TraceQueryParams { return withFilter(filter) }},\n+\t\t{\n+\t\t\tname: \"filter with zero-value attributes\",\n+\t\t\tquery: func() TraceQueryParams {\n+\t\t\t\treturn TraceQueryParams{Filter: filter}\n+\t\t\t},\n+\t\t},\n+\t\t{\n+\t\t\tname: \"service name\",\n+\t\t\tquery: func() TraceQueryParams {\n+\t\t\t\tq := withFilter(filter)\n+\t\t\t\tq.ServiceName = \"cart\"\n+\t\t\t\treturn q\n+\t\t\t},\n+\t\t\twantErr: \"[service_name]\",\n+\t\t},\n+\t\t{\n+\t\t\tname: \"operation name\",\n+\t\t\tquery: func() TraceQueryParams {\n+\t\t\t\tq := withFilter(filter)\n+\t\t\t\tq.OperationName = \"op\"\n+\t\t\t\treturn q\n+\t\t\t},\n+\t\t\twantErr: \"[operation_name]\",\n+\t\t},\n+\t\t{\n+\t\t\tname: \"attributes\",\n+\t\t\tquery: func() Tra Err: `compares \"a\" against a string constant only`,\n+\t\t},\n+\t\t{\n+\t\t\tname:    \"the service against a boolean\",\n+\t\t\tfilter:  call(expression.OpEq, serviceRef(), &expression.BoolValue{Value: true}),\n+\t\t\twantErr: `compares \"service\" against a string constant only`,\n+\t\t},\n+\t\t{\n+\t\t\tname:    \"the operation against an integer\",\n+\t\t\tfilter:  call(expression.OpEq, operationRef(), &expression.IntValue{Value: 1}),\n+\t\t\twantErr: `compares \"name\" against a string constant only`,\n+\t\t},\n+\t\t{\n+\t\t\tname:    \"a duration bound against a string\",\n+\t\t\tfilter:  call(expression.OpGte, durationRef(), str),\n+\t\t\twantErr: `compares \"duration\" against a duration such as \"2s\" only`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"a quantifier over the events\",\n+\t\t\tfilter: call(expression.OpSome, &expression.NestedRef{Level: expression.LevelEvent},\n+\t\t\t\tcall(expression.OpEq, &expression.FieldRef{Level: expression.LevelEvent, Name: expression.EventFieldName}, str)),\n+\t\t\twantErr: \"compares a reference against a constant only\",\n+\t\t},\n+\t\t{\n+\t\t\tname:    \"a constant on the left\",\n+\t\t\tfilter:  call(expression.OpEq, str, attr(\"a\", \"\")),\n+\t\t\twantErr: \"compares a reference against a constant only\",\n+\t\t},\n+\t\t{\n+\t\t\tname:    \"the same attribute twice\",\n+\t\t\tfilter:  call(expression.OpAnd, attrEq(\"a\", \"1\"), call(expression.OpEq, attr(\"a\", expression.LevelSpan), str)),\n+\t\t\twantErr: `only one predicate on \"a\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"the service twice\",\n+\t\t\tfilter: call(expression.OpAnd,\n+\t\t\t\tcall(expression.OpEq, serviceRef(), str), call(expression.OpEq, serviceRef(), str)),\n+\t\t\twantErr: `only one predicate on \"service\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"the operation twice\",\n+\t\t\tfilter: call(expression.OpAnd,\n+\t\t\t\tcall(expression.OpEq, operationRef(), str), call(expression.OpEq, operationRef(), str)),\n+\t\t\twantErr: `only one predicate on \"name\"`,\n+\t\t},\n+\t\t{\n+\t\t\tname: \"the same duration bound twice\",\n+\t\t\tfilter: call(expression.OpAnd,\n+\t\t\t\tboundCall(expression.OpLte, time.Second), boundCall(expression.OpLte, time.Minute)),\n+\t\t\twantErr: `only one predicate on \"duration\"`,\n+\t\t},\n+\t}\n+\tfor _, tt := range tests {\n+\t\tt.Run(tt.name, func(t *testing.T) {\n+\t\t\tq := withFilter(tt.filter)\n+\t\t\tgot, err := q.ToLegacyShape()\n+\t\t\trequire.ErrorIs(t, err, ErrFilterUnsupported)\n+\t\t\tassert.ErrorContains(t, err, tt.wantErr)\n+\t\t\tassert.Equal(t, q, got, \"the original query is returned on error\")\n+\t\t})\n+\t}\n+}\n+\n+func TestToLegacyShape_UnresolvedDuration(t *testing.T) {\n+\tq := withFilter(call(expression.OpGte, durationRef(), &expression.AnyValue{Value: \"2s\"}))\n+\tgot, err := q.ToLegacyShape()\n+\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\trequire.ErrorContains(t, err, `the bound \"2s\" on \"duration\" was never read as a duration`)\n+\tassert.Equal(t, q, got)\n+}\n+\n+func TestToLegacyShape_RefusesACycle(t *testing.T) {\n+\tcycle := &expression.Call{Op: expression.OpAnd}\n+\tcycle.Args = []expression.Expression{attrEq(\"a\", \"1\"), cycle}\n+\t_, err := withFilter(cycle).ToLegacyShape()\n+\trequire.ErrorIs(t, err, ErrFilterInvalid)\n+\trequire.ErrorIs(t, err, expression.ErrTooDeeplyNested)\n+}\n+\n+// TestToLegacyShape_KeepsLegacyAttributes covers a query that did not pass\n+// EnsureFilterStandsAlone: its own tags are copied rather than dropped, and the\n+// caller's map is still left alone.\n+func TestToLegacyShape_KeepsLegacyAttributes(t *testing.T) {\n+\tq := withFilter(attrEq(\"b\", \"2\"))\n+\tq.Attributes.PutStr(\"a\", \"1\")\n+\tgot, err := q.ToLegacyShape()\n+\trequire.NoError(t, err)\n+\tassert.Equal(t, map[string]any{\"a\": \"1\", \"b\": \"2\"}, got.Attributes.AsRaw())\n+\tassert.Equal(t, map[string]any{\"a\": \"1\"}, q.Attributes.AsRaw())\n+}\n+\n+// TestToLegacyShape_NilTerms covers a tree holding typed nil pointers, which a\n+// caller can build and const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ARM = { A: "A: なし", P: "P: プロンプト", G: "G: ガードレール" };
const state = { task: 0, step: 0 };

function parseDiff(text) {
  const files = [];
  let cur = null;
  for (const line of text.split("\n")) {
    const m = /^diff --git a\/(.*?) b\/(.*)$/.exec(line);
    if (m) { cur = { path: m[2], lines: [], plus: 0, minus: 0 }; files.push(cur); continue; }
    if (!cur || /^(index |--- |\+\+\+ |new file mode|deleted file mode|similarity |rename )/.test(line)) continue;
    cur.lines.push(line);
    if (line.startsWith("+")) cur.plus++; else if (line.startsWith("-")) cur.minus++;
  }
  return files;
}

// Keep each change with `ctx` lines around it; mark the gaps with a hunk line.
function aroundChanges(lines, ctx) {
  const keep = new Array(lines.length).fill(false);
  lines.forEach((l, i) => {
    if (l.startsWith("+") || l.startsWith("-")) for (let j = Math.max(0, i - ctx); j <= Math.min(lines.length - 1, i + ctx); j++) keep[j] = true;
    if (l.startsWith("@@")) keep[i] = false;
  });
  const out = [];
  let skipped = 0;
  lines.forEach((l, i) => {
    if (l.startsWith("@@")) return;
    if (keep[i]) { if (skipped) { out.push(`@@ ${skipped} 行省略 @@`); skipped = 0; } out.push(l); } else skipped++;
  });
  if (skipped) out.push(`@@ ${skipped} 行省略 @@`);
  return out;
}

// Render lines with the line number in the new file, taken from each hunk header.
function numbered(lines) {
  let n = 0;
  return lines.map((l) => {
    const h = /^@@ -\d+(?:,\d+)? \+(\d+)/.exec(l);
    if (h) { n = +h[1] - 1; return `<div class="h"><span class="ln"></span>${esc(l)}</div>`; }
    if (l.startsWith("@@")) return `<div class="h"><span class="ln"></span>${esc(l)}</div>`;
    const cls = l.startsWith("+") ? "a" : l.startsWith("-") ? "d" : "";
    const ln = l.startsWith("-") ? "" : String(++n);
    return `<div class="${cls}"><span class="ln">${ln}</span>${esc(l) || " "}</div>`;
  }).join("");
}

function isTool(path) { return /(^|\/)\.declscope-baseline\.yaml$/.test(path) || path.startsWith(".claude/"); }

function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function render() {
  const t = DATA.tasks[state.task];
  const step = t.steps[state.step];
  const blind = $("blind").checked, pkgonly = $("pkgonly").checked;
  $("steps").innerHTML = t.steps.map((s, i) =>
    `<button type="button" data-i="${i}" aria-pressed="${i === state.step}">段 ${s.n}${s.pr ? ` · #${s.pr}` : ""}${s.stage === 2 ? " · 段階2" : ""}</button>`).join("");
  $("steptitle").innerHTML = `${esc(step.title || `段 ${step.n}`)}<span class="tag">${step.stage === 2 ? "段階2（どの群も A と同じ条件）" : "段階1（各群の条件）"}</span>`;
  let runs = step.runs.slice();
  if (blind) runs.sort((a, b) => hash(t.id + step.n + a.arm + a.rep) - hash(t.id + step.n + b.arm + b.rep));
  $("cols").innerHTML = runs.map((r, i) => column(r, i, blind, pkgonly, t.package)).join("") ||
    `<p class="empty">この段の結果はまだない。</p>`;
}

function column(r, i, blind, pkgonly, pkg) {
  const name = blind ? `コード ${i + 1}` : `${ARM[r.arm] || r.arm} · ${r.rep}回目`;
  let files = parseDiff(r.diff);
  if (!$("whole").checked) files = files.map((f) => ({ ...f, lines: aroundChanges(f.lines, 3) }));
  if (blind) {
    files = files.filter((f) => !isTool(f.path)).map((f) => {
      const lines = f.lines.filter((l) => !/^[+\- ]\s*\/\/declscope:/.test(l));
      return { ...f, lines: lines.map((l) => l.replace(/\s*\/\/declscope:\S+(?:\s\/\/.*)?$/, "")) };
    });
  }
  const inPkg = (p) => !pkg || p === pkg || p.startsWith(pkg + "/");
  const shown = pkgonly ? files.filter((f) => inPkg(f.path)) : files;
  const hidden = files.length - shown.length;
  const chips = [];
  if (r.success === true) chips.push(`<span class="chip ok">成功</span>`);
  else if (r.success === false) chips.push(`<span class="chip bad">失敗${r.failed && r.failed.length ? `（${r.failed.length}件）` : ""}</span>`);
  if (r.tokens != null) chips.push(`<span class="chip">${(r.tokens / 1000).toFixed(0)}k トークン</span>`);
  if (r.turns != null) chips.push(`<span class="chip">${r.turns} ターン</span>`);
  if (r.files != null) chips.push(`<span class="chip">${r.files} ファイル · ${r.lines} 行</span>`);
  if (!blind && r.directives) chips.push(`<span class="chip">ディレクティブ ${r.directives}</span>`);
  if (r.renamed) chips.push(`<span class="chip warn">名前合わせあり${r.no_counterpart.length ? `・対応なし ${r.no_counterpart.length}` : ""}</span>`);
  if (r.audit_ok === false) chips.push(`<span class="chip bad">監査で違反</span>`);
  const body = shown.map((f) => `
    <details class="file" open>
      <summary><span class="path">${esc(f.path)}</span><span class="n"><span class="plus">+${f.plus}</span> <span class="minus">−${f.minus}</span></span></summary>
      <div class="diff">${numbered(f.lines)}</div>
    </details>`).join("") || `<p class="empty">差分なし</p>`;
  const notes = [];
  if (hidden) notes.push(`package の外の ${hidden} ファイルを隠している。`);
  if (r.cut) notes.push("差分が長いので途中で切った。");
  return `<section class="col" aria-label="${esc(name)}">
    <div class="colhead"><div class="name">${esc(name)}</div><div class="chips">${chips.join("")}</div></div>
    ${body}${notes.length ? `<p class="note">${notes.join(" ")}</p>` : ""}
  </section>`;
}

function init() {
  if (!DATA || !DATA.tasks.length) { $("cols").innerHTML = `<p class="empty">結果はまだない。</p>`; return; }
  $("task").innerHTML = DATA.tasks.map((t, i) => `<option value="${i}">${esc(t.id)}</option>`).join("");
  $("task").addEventListener("change", (e) => { state.task = +e.target.value; state.step = 0; render(); });
  $("steps").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { state.step = +b.dataset.i; render(); } });
  $("blind").addEventListener("change", render);
  $("pkgonly").addEventListener("change", render);
  $("whole").addEventListener("change", render);
  render();
}
init();
</script>
</body>
</html>
